  svg.addEventListener("pointerdown", function (e) { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); try { svg.setPointerCapture(e.pointerId); } catch (x) {} moved = 0; if (ptrs.size === 2) pinch = dist(); svg.classList.add("drag"); });
  svg.addEventListener("pointermove", function (e) {
    var p = ptrs.get(e.pointerId); if (!p) return;
    if (ptrs.size === 1) { var dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy); vt.x += dx; vt.y += dy; applyTransform(); }
    else if (ptrs.size === 2 && pinch) { p.x = e.clientX; p.y = e.clientY; var d = dist(), r = svg.getBoundingClientRect(), m = mid(); zoomAt(d / pinch, m.x - r.left, m.y - r.top); pinch = d; moved += 10; }
    p.x = e.clientX; p.y = e.clientY;
  });
  function endPtr(e) {
    var had = ptrs.has(e.pointerId); ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) svg.classList.remove("drag");
    if (had && e.type === "pointerup" && moved < 7 && !ptrs.size) tap(e.clientX, e.clientY);
  }
  svg.addEventListener("pointerup", endPtr); svg.addEventListener("pointercancel", endPtr);
  function dist() { var a = Array.from(ptrs.values()); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1; }
  function mid() { var a = Array.from(ptrs.values()); return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 }; }
  svg.addEventListener("wheel", function (e) { e.preventDefault(); if (e.ctrlKey || e.metaKey) { var r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top); } else { vt.x -= e.deltaX; vt.y -= e.deltaY; applyTransform(); } }, { passive: false });
  svg.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.closest) { var n = e.target.closest(".node"); if (n) { e.preventDefault(); selectNode(n.getAttribute("data-id")); } } });
  function tap(x, y) {
    var t = document.elementFromPoint(x, y); if (!t || !t.closest) return;
    var n = t.closest(".node"); if (n) { selectNode(n.getAttribute("data-id")); return; }
    var ed = t.closest(".edge"); if (ed) { selectEdge(ed.getAttribute("data-edge")); return; }
    clearSel();
  }
  $("#zin").onclick = function () { zoomAt(1.25); }; $("#zout").onclick = function () { zoomAt(0.8); }; $("#zfit").onclick = function () { fit(true); };

  /* ---------- panel + outline content ---------- */
  function tagsFor(n) {
    var g = G[n.group], h = '<div class="tags"><span class="tag role" style="--c:' + kv(g.slot) + '">' + esc(g.label) + "</span>";
    (n.chips || []).forEach(function (c) { h += '<span class="tag">' + esc(c) + "</span>"; });
    return h + "</div>";
  }
  function edgeTag(e) { return esc(e.short) + (e.kind === "indirect" ? " · " + e.hops + " steps" : ""); }
  function relList(edges, side) {
    if (!edges.length) return '<p class="detail">' + (side === "to" ? esc(M.noDeps) : esc(M.noUsers)) + "</p>";
    return '<ul class="rel">' + edges.map(function (e) {
      var o = N.get(side === "to" ? e.to : e.from), vis = isVisible(o), cls = e.kind === "indirect" ? " ind" : e.kind === "doc" ? " docl" : "";
      return "<li><div class=\"row\"><button type=\"button\" class=\"link\" data-go=\"" + o.id + "\">" + esc(o.title) + "</button><span class=\"lbl" + cls + "\">" + edgeTag(e) + "</span>" +
        "<button type=\"button\" class=\"link\" style=\"font-weight:400;font-size:.8rem\" data-edgego=\"" + e.id + "\">details</button></div><p>" + esc(e.why) + (vis ? "" : " (group hidden)") + "</p></li>";
    }).join("") + "</ul>";
  }
  function copyBtn(t) { return '<button type="button" class="copy" data-copy="' + esc(t) + '">Copy</button>'; }
  function nodeBody(n, skipGist) {
    var h = skipGist ? "" : '<p class="gist">' + esc(n.gist) + "</p>";
    if (n.detail) h += '<p class="detail">' + esc(n.detail) + "</p>";
    var d = OUT.get(n.id), u = IN.get(n.id);
    h += "<h3>Depends on (" + d.length + ")</h3>" + relList(d, "to");
    h += "<h3>Used by (" + u.length + ")</h3>" + relList(u, "from");
    if (n.note) {
      var lv = M.noteLevels[n.note.level] || { label: n.note.level, slot: 10 };
      h += "<h3>" + esc(M.noteHeading) + '</h3><p class="gb" style="--gbc:' + kv(lv.slot) + '"><strong>' + esc(lv.label) + ".</strong>" + (n.note.text ? " " + esc(n.note.text) : "") + "</p>";
    }
    if (n.meta && n.meta.length) {
      h += "<h3>Where it lives</h3><dl class=\"meta\">" + n.meta.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd><code>" + esc(r[1]) + "</code>" + (r[2] ? copyBtn(r[1]) : "") + "</dd>"; }).join("") + "</dl>";
    }
    if (n.source) h += "<details style=\"margin-top:12px\"><summary>" + esc(n.sourceLabel || M.sourceLabel) + "</summary><pre>" + esc(n.source) + "</pre></details>";
    return h;
  }
  function introHTML() {
    var h = "<h2>" + esc(M.introTitle) + '</h2><ul class="plain">' + M.intro.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
    h += '<h3>Start here</h3><div class="start">' + M.start.map(function (s) { return '<button type="button" data-go="' + s.id + '">' + esc(s.label) + "</button>"; }).join("") + "</div>";
    h += '<h3>Read with care</h3><ul class="plain">' + M.care.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
    return h + '<p class="stats">' + M.statsHTML + "</p>";
  }
  function nodePanel(n) { return '<button type="button" class="x" id="px" aria-label="Close">&times;</button><h2>' + esc(n.title) + "</h2>" + tagsFor(n) + nodeBody(n); }
  function edgePanel(e) {
    var a = N.get(e.from), b = N.get(e.to);
    var h = '<button type="button" class="x" id="px" aria-label="Close">&times;</button><h2>' + esc(a.title) + " &rarr; " + esc(b.title) + "</h2>";
    h += '<div class="tags"><span class="tag">' + esc(M.edgeKinds[e.kind].label) + (e.kind === "indirect" ? " · " + e.hops + " steps" : "") + "</span><span class=\"tag\">" + esc(e.short) + "</span></div>";
    h += '<p class="gist">' + esc(e.why) + "</p>";
    h += "<h3>How this was found</h3>";
    h += "<p class=\"detail\">" + esc(M.edgeKinds[e.kind].how) + "</p>";
    if (e.kind === "indirect") h += "<ol class=\"chain\">" + e.chain.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ol>";
    if (e.source) h += "<p class=\"detail\"><code>" + esc(e.source) + "</code></p>";
    h += "<h3>Open</h3><div class=\"start\"><button type=\"button\" data-go=\"" + a.id + "\">" + esc(a.title) + "</button><button type=\"button\" data-go=\"" + b.id + "\">" + esc(b.title) + "</button></div>";
    return h;
  }
  function renderPanel() {
    var p = $("#panel"), n = state.sel && N.get(state.sel), e = state.selEdge && E.get(state.selEdge);
    if (e) p.innerHTML = edgePanel(e); else if (n) p.innerHTML = nodePanel(n); else p.innerHTML = '<button type="button" class="x" id="px" aria-label="Close">&times;</button>' + introHTML();
    p.classList.toggle("open", !!(n || e)); p.scrollTop = 0;
    $("#introInline").innerHTML = introHTML();
  }
  function renderOutline() {
    var o = $("#outline"), q = state.q.toLowerCase(), html = "";
    D.groups.forEach(function (g) {
      var ns = D.nodes.filter(function (n) { return n.group === g.id && (!q || matches(n)); });
      if (!ns.length) return;
      html += '<section><h2><i style="--c:' + kv(g.slot) + '"></i>' + esc(g.label) + ' <small style="color:var(--muted);font-weight:400">' + ns.length + "</small></h2><p class=\"blurb\">" + esc(g.blurb) + "</p>";
      ns.forEach(function (n) {
        html += '<details class="card" id="o-' + n.id + '"' + (state.sel === n.id ? " open" : "") + '><summary><strong>' + esc(n.title) + '</strong><span class="gistline">' + esc(n.gist) + '</span></summary><div class="body">' + tagsFor(n) + nodeBody(n, true) + "</div></details>";
      });
      html += "</section>";
    });
    o.innerHTML = html || '<p class="empty">Nothing matches. Clear the search to see everything.</p>';
  }
  function updateLegend() {
    var l = $("#legend"), h = "", L = lensDef(state.lens);
    if (L.id === "role") D.groups.forEach(function (g) { h += '<span><i style="background:' + kv(g.slot) + '"></i>' + esc(g.label) + "</span>"; });
    else (L.values || []).forEach(function (v) { h += '<span><i style="background:' + kv(v.slot) + '"></i>' + esc(v.label) + "</span>"; });
    var dash = { direct: "", indirect: ' stroke-dasharray="6 4"', doc: ' stroke-dasharray="1.5 5.5" stroke-linecap="round"' };
    Object.keys(M.edgeKinds).forEach(function (k) { h += '<button type="button" class="lk" data-kind="' + k + '" aria-pressed="' + (state.kinds[k] ? "true" : "false") + '" title="Show or hide these links"><svg viewBox="0 0 34 10" aria-hidden="true"><path d="M1 5 H33" stroke="var(--edge)" stroke-width="1.8" fill="none"' + dash[k] + "/></svg>" + esc(M.edgeKinds[k].legend) + "</button>"; });
    l.innerHTML = h;
  }
  function renderLensSeg() {
    $("#lensSeg").innerHTML = LENSES.map(function (l) { return '<button type="button" data-l="' + l.id + '" aria-pressed="' + (l.id === state.lens) + '">' + esc(l.label) + "</button>"; }).join("");
  }
  function renderChips() {
    $("#chips").innerHTML = D.groups.map(function (g) {
      var c = D.nodes.filter(function (n) { return n.group === g.id; }).length;
      return '<button type="button" class="chip" style="--c:' + kv(g.slot) + '" data-grp="' + g.id + '" aria-pressed="' + (!state.hidden[g.id]) + '" title="' + esc(g.blurb) + '"><i></i>' + esc(g.label) + " <small>" + c + "</small></button>";
    }).join("");
  }
  function renderFoot() { $("#foot").innerHTML = M.footHTML; }

  /* ---------- state changes ---------- */
  function selectNode(id) {
    if (!N.has(id)) return; if (!isVisible(N.get(id))) { delete state.hidden[N.get(id).group]; renderChips(); persist(); }
    state.sel = id; state.selEdge = null; renderMap(); renderPanel(); renderOutline();
    if (state.view === "map") { if (window.innerWidth < 900) { try { $("#mapwrap").scrollIntoView({ block: "start", behavior: "smooth" }); } catch (x) {} } reveal(id); } else { var c = $("#o-" + id); if (c) { c.open = true; c.scrollIntoView({ block: "start", behavior: "smooth" }); } }
    try { history.replaceState(null, "", "#" + hashFor(id)); } catch (e) {}
  }
  function selectEdge(id) { state.selEdge = id; state.sel = null; renderMap(); renderPanel(); }
  function clearSel() { state.sel = null; state.selEdge = null; renderMap(); renderPanel(); try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  function setView(v) {
    state.view = v; persist();
    $("#root").classList.toggle("outline-on", v === "outline");
    $("#mapwrap").hidden = v === "outline"; $("#legend").hidden = v === "outline"; $("#outline").hidden = v !== "outline"; $("#introInline").hidden = v === "outline";
    Array.prototype.forEach.call($("#viewSeg").children, function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === v)); });
    if (v === "map") { renderMap(); requestAnimationFrame(function () { fit(false); if (state.sel) reveal(state.sel); else if (M.focus) reveal(M.focus); }); } else { renderOutline(); }
  }
  function setLens(l) { state.lens = l; persist(); $("#root").setAttribute("data-lens", l); renderLensSeg(); renderMap(); }

  document.addEventListener("click", function (e) {
    var t = e.target; if (!t.closest) return;
    var b;
    if ((b = t.closest("[data-go]"))) { e.preventDefault(); selectNode(b.getAttribute("data-go")); return; }
    if ((b = t.closest("[data-edgego]"))) { selectEdge(b.getAttribute("data-edgego")); if (state.view === "outline") { setView("map"); } return; }
    if ((b = t.closest("[data-copy]"))) { var txt = b.getAttribute("data-copy"); var done = function () { var o = b.textContent; b.textContent = "Copied"; setTimeout(function () { b.textContent = o; }, 1200); };
      try { navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(b, txt); }); } catch (x) { fallbackCopy(b, txt); } return; }
    if ((b = t.closest("[data-grp]"))) { var g = b.getAttribute("data-grp"); if (state.hidden[g]) delete state.hidden[g]; else state.hidden[g] = 1; persist(); if (state.sel && !isVisible(N.get(state.sel))) { state.sel = null; } renderChips(); renderMap(); renderPanel(); renderOutline(); fit(false); return; }
    if ((b = t.closest("[data-kind]"))) { var kd = b.getAttribute("data-kind"); state.kinds[kd] = state.kinds[kd] ? 0 : 1; persist(); renderMap(); return; }
    if (t.closest("#px")) { clearSel(); return; }
    if ((b = t.closest("#viewSeg button"))) { setView(b.getAttribute("data-v")); return; }
    if ((b = t.closest("#lensSeg button"))) { setLens(b.getAttribute("data-l")); return; }
  });
  function fallbackCopy(b, txt) { var r = document.createRange(); var c = b.previousElementSibling; if (c) { r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
  $("#q").addEventListener("input", function (e) { state.q = e.target.value.trim(); renderMap(); renderOutline(); });
  $("#q").addEventListener("keydown", function (e) { if (e.key === "Enter") { var m = D.nodes.filter(function (n) { return isVisible(n) && matches(n); })[0]; if (m) selectNode(m.id); } });
  window.addEventListener("hashchange", function () { var id = idFromHash(); if (id && id !== state.sel) selectNode(id); });
  function placeLens() {
    var wide = window.innerWidth >= 900, lens = $("#lensField"), bar = $("#bar"), body = $("#optsbody"), opts = $("#opts");
    if (wide) { if (lens.parentNode !== bar) bar.insertBefore(lens, $("#searchField")); opts.open = true; }
    else { if (lens.parentNode !== body) body.insertBefore(lens, body.firstChild); }
  }
  function setHdr() { var h = $(".top"); if (h) document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px"); }
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { placeLens(); setHdr(); }, 120); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && (state.sel || state.selEdge)) clearSel(); });

  /* ---------- boot ---------- */
  renderChips(); renderFoot(); setLens(state.lens); renderPanel(); renderOutline();
  placeLens(); setHdr(); setView(state.view);
  var h0 = idFromHash(); if (h0) selectNode(h0);
})();
</script>
</body></html>
