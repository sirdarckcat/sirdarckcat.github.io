message only above about 1.028 times the Johnson radius, falling toward the radius as the lattice degree grows. Below it, no non-planted solution was ever found although 10² to 10⁷ are expected.", "detail": "390 decodes with predeclared trials. It checks, on a case small enough to run, that practical lattice decoding does not exploit the abundance of solutions.", "chips": ["toy", "LLL"], "f": {"status": "comp", "impact": "bound"}, "meta": [["Results", "goldbach/phd/toy_crt/results.md", false]], "search": "toy crt decoder lattice LLL johnson howgrave-graham"}, {"id": "m_wp10", "group": "res", "title": "A proof of RH/GRH would move no lever", "gist": "Granting the claimed proof, RH and GRH give square-root-quality estimates, while every bottleneck lives at x^(o(1)) scale: the RH window would still fall short by 10^97 at the 200-digit record.", "detail": "GRH would only make Miller's test a proof (not competitive with elliptic-curve or BLS proofs) and change constants: the Linnik gain is a factor 1.2, after an erratum, not 2.5. The research sessions assumed the claim without examining its Lean archive.", "chips": ["GRH", "WP10"], "f": {"status": "comp", "impact": "aside"}, "meta": [["Memo", "goldbach/phd/wp10_grh_remark.md", false], ["Ledger", "goldbach/phd/wp12_prime_covering_grh_ledger.md §3", false]], "search": "GRH RH remark pdf frontier no lever", "note": {"level": "aside", "text": "Why only the method of the GRH note was used: find a toy over function fields, look for the integer counterpart, formalise as you go."}}, {"id": "m_thm1", "group": "res", "title": "Theorem: covers reach 1.349 · x · ln x", "gist": "Residue classes modulo the odd primes up to x can cover every odd prime below (e^γ/(2C₂) − o(1))·x·ln x, so some explicit N has no Goldbach summand below 1.349·ln N·ln ln N.", "detail": "Proved on paper by pigeonhole, Mertens and one survivor per prime in (x/ln x, x]. It beats the thesis's bound by ln₃N/ln₄N and the counting constant 1/2 (Shi). Greedy covers track 0.72·x·ln²x, one logarithm higher; proving any f(x) → ∞ times x·ln x is the named open next theorem. Letting each mop-up prime cover two rows would double the constant, and several rows per prime would add a factor ln ln X / ln ln ln X; the research session states both only as remarks, proved neither there nor in Lean, which has the one-row-per-prime version.", "chips": ["WP12", "Theorem 1"], "f": {"status": "paper", "impact": "bound"}, "meta": [["Proof", "goldbach/phd/wp12_prime_covering_grh_ledger.md §2", false]], "search": "theorem 1.349 covering lower bound mertens", "note": {"level": "bound", "text": "Kernel-checked in Lean as the covering bound with c \u003c 1.349 and no hypothesis, with Mertens' third theorem proved in the same library."}}, {"id": "m_thm2", "group": "res", "title": "Theorem: no cover beyond x^(4+ε)", "gist": "For every ε > 0 and large x, classes modulo primes up to x cannot cover all primes below x^(4+ε), or x^(2+ε) under Elliott–Halberstam.", "detail": "By the linear sieve with Bombieri–Vinogradov. The first unconditional impossibility statement for covering certificates, but asymptotic and vacuous at record parameters (moduli up to 79,139 against Q up to 2×10^6). GRH adds nothing.", "chips": ["WP12", "Theorem 2"], "f": {"status": "paper", "impact": "bound"}, "meta": [["Proof", "goldbach/phd/wp12_prime_covering_grh_ledger.md §2", false]], "search": "theorem x^4 impossibility sieve bombieri-vinogradov", "note": {"level": "bound", "text": "Brackets certified deserts between (1.349 − o(1))·ln N·ln ln N and (ln N)^(4+ε)."}}, {"id": "m_lower", "group": "res", "title": "Unconditional growth: g ≫ ln N · ln₂N · ln₄N / ln₃N", "gist": "There are infinitely many even N with g(N) ≫ (log N)(log₂ N)(log₄ N)/log₃ N. The proof uses the Erdős–Rankin covering of an interval (Ford–Green–Konyagin–Maynard–Tao) with Linnik's size bound.", "detail": "This matches the best known prime-gap order. Between it and the conjectured (log N)² log log N lies a factor of about log N; whether covering only the prime offsets beats the prime-gap scale asymptotically would be new mathematics. It relies on external theorems and is not formalised.", "chips": ["thesis ch2", "FGKMT"], "f": {"status": "paper", "impact": "bound"}, "meta": [["Theorem", "goldbach/thesis/ch2_foundations.tex (Theorem thm:lower)", false]], "search": "unconditional growth erdos rankin FGKMT lower bound", "note": {"level": "bound", "text": "The rigorous lower end of the maximal order of g. The 1.349·ln N·ln ln N theorem is stronger by a log-ratio."}}, {"id": "m_classical", "group": "res", "title": "Thesis chapter 2: the classical constructions", "gist": "A factorial leaves one residue class per small prime. A multiple of the primorial has no small summands. A congruence cover needs only 356 congruences and a 1,020-digit modulus for Q = 10^5, against a primorial of 43,000 digits. Every cover is realised by true Goldbach numbers (Dirichlet). A prime gap gives a Goldbach gap, but not conversely.", "detail": "Worked example: N = 27! + 28 (29 digits) has g = 71. A complete greedy cover for Q = 10^8 would need about 327,455 digits.", "chips": ["thesis ch2", "paper"], "f": {"status": "paper", "impact": "engine"}, "meta": [["Chapter", "goldbach/thesis/ch2_foundations.tex", false]], "search": "classical factorial primorial cover dirichlet prime gap transfer", "note": {"level": "engine", "text": "These are the paper's statements; the Lean library proves them (primorial core, covering certificate, cover realisation, Dirichlet existence with and without Linnik, prime-gap transfer)."}}, {"id": "m_bls", "group": "res", "title": "N − 1 (BLS) certificate by CRT: no ECPP", "gist": "Choose N by CRT so that P = N − g equals m·2ⁿ + 1 with 2ⁿ at least P^(1/3). One modular exponentiation and an integer square root then prove P prime (Brillhart–Lehmer–Selfridge). With a complete cover, g(N) = g is certified with no luck, no ECPP and no heuristic.", "detail": "The price is about 1.5 times the digits. Found independently by two sessions. It removed the height game's certification wall (the ECPP-limited ceiling had been forecast at 2.5 million). It needs a complete cover, which under the 10^200 cap stops near 16,000, so it is not used for the budget game.", "chips": ["WP11", "WP12"], "f": {"status": "paper", "impact": "engine"}, "meta": [["Construction", "goldbach/phd/wp11_bls_game1.md", false], ["Records", "goldbach/proth/README.md, goldbach/bls/README.md", false]], "search": "BLS N-1 pocklington proth certificate crt", "note": {"level": "engine", "text": "Formalising it in Lean needs Pocklington's N − 1 criterion, ‘a page of orderOf reasoning’, and was not done."}}, {"id": "m_proofcarrying", "group": "res", "title": "Proof-carrying records: proposed, then delivered", "gist": "Research proposed that a record should carry a machine-checkable proof: a decidable check that every prime below g is covered or fails a Fermat test, plus a primality certificate for N − g. The Lean session built exactly that for the budget game.", "detail": "Research estimated it as ‘a few hundred lines’ and noted that the Lean toolchain install had been refused. For the height game (BLS) it is still not done: it needs Pocklington's criterion.", "chips": ["WP10", "WP12"], "f": {"status": "open", "impact": "engine"}, "meta": [["Proposal", "goldbach/phd/wp12_prime_covering_grh_ledger.md §4", false], ["Proposal", "goldbach/phd/wp10_grh_remark.md §2", false]], "search": "proof-carrying records lean machine-checked", "note": {"level": "engine", "text": "The one idea taken from the GRH remark that was actually carried out."}}, {"id": "m_selection", "group": "res", "title": "Selection identity: where the successes sit", "gist": "If rows-left is normal across candidates and success probability is (1 − p)^R, the candidates at least z standard deviations below the mean hold the fraction Φ(λ − z) of all successes. The identity is exact for the normal.", "detail": "Measured on 131,072 members of a Q = 130,000 vector: the emptiest 8% hold 23.7% of the hit mass against 24.3% by the model; the fleet's 3% rule holds 15.6%, worth 2.0 nats. The model is 5–10% optimistic in the tail.", "chips": ["tilt", "hit mass"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Statement", "goldbach/fscan/cover/README.md (Which members to test)", false], ["Verdicts", "goldbach/fscan/cover/brainstorm/verdicts_on_lean_ideas.txt", false]], "search": "selection identity hit mass tilt gaussian", "note": {"level": "steer", "text": "Lean proves that the logged ‘hit mass’ is exactly the expected number of successes, and proves the tilt identity."}}, {"id": "v_brainstorm", "group": "res", "title": "The 200-idea brainstorm: nothing worth a nat", "gist": "On 2026-11-22 the two sessions each wrote 100 ideas for a large step at 200 digits and tested each other's. None is worth a nat as a change of method; what is left is engineering (0.6–1.3 nats) and compute.", "detail": "Reaching 20% (E near 80) is out of reach of every mechanism on both lists, by more than 20 nats even for an oracle. Compute levers: 1,000 volunteer cards (+5.8 nats, 8% to 9.3%) and a tenfold fleet (+2.3 nats). The one open door is the sublinear decoding problem, worth about 10 nats. The Lean session settled 21 of the ideas by theorem; a refuted claim (‘E ≥ 33 for every modulus set’) shows the exchange ran in both directions.", "chips": ["2026-11-22"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Summary", "goldbach/fscan/cover/brainstorm/README.md", false], ["Verdicts", "goldbach/fscan/cover/brainstorm/verdicts_on_research_ideas.txt", false], ["Ideas", "goldbach/IDEAS100.md", false]], "search": "brainstorm 100 ideas verdicts nothing worth a nat", "note": {"level": "steer", "text": "The origin of the sublinear programme and of the conclusion that what is left is compute."}}, {"id": "m_errata", "group": "res", "title": "Retractions and errata", "gist": "Claims walked back so far: an ‘open window’ for CRT decoding (WP3), a factor-10 units slip in the sub-100 cost, two ‘independent’ unlucky searches that were one event (p = 0.046), ‘first record without ECPP’ (it was an independent second certificate), GRH's gain of 2.5 (really 1.2), Theorem 2 as practical (asymptotic only), the fitted ceiling constant, and fail-open PARI scripts.", "detail": "Each was found by cross-review or by recomputation, and none changed a record. Still open in the ledgers: a campaign-1 ‘P ≈ 0.30’ that the log's own table puts near 0.09; the 57-versus-68-nat entropy arithmetic in WP3; and the claim that the model is within 0.1 nats when campaign 3's log is 0.2–0.4 above.", "chips": ["errata"], "f": {"status": "open", "impact": "aside"}, "meta": [["Errata list", "goldbach/phd/merge_2026-11-21.md", false], ["Cross-reviews", "goldbach/phd/crossreview_2ce9e63a.md, crossreview_8ffe9d7a.md", false]], "search": "retractions errata corrections open window units slip", "note": {"level": "aside", "text": "Every retraction came from the team itself, which is a good sign for the rest of the record."}}, {"id": "s_question", "group": "res", "title": "The sublinear search question (P′)", "gist": "Can we find, faster than scoring every candidate, an N below 10^200 with at most 1,320 of the primes q \u003c 213,070 having N − q free of prime factors up to 1,000? About e^36 such N exist; the best covers give 1,439 ± 11.", "detail": "A solution would be worth 3.5 nats (a factor 30) at the 10% target. The programme began on 2026-11-23, taking only the method from the GRH note: find a function-field toy, look for the integer counterpart, formalise as you go.", "chips": ["(P′)", "open problem"], "f": {"status": "open", "impact": "steer"}, "meta": [["Question", "goldbach/sublinear/README.md (The question; Open problem (P′))", false]], "search": "sublinear search question P prime open door", "note": {"level": "steer", "text": "The one open door of the brainstorm, and the whole sublinear programme."}}, {"id": "s_prize", "group": "res", "title": "What a perfect search would be worth", "gist": "An ideal search at the 10% target would need to test e^39.3 numbers per success today, e^35.8 if it could see rows to depth 1,000, e^30.5 for depth 5,000 and e^26.7 for 20,000. The prize is 3.5, 5.9, 8.8, 12.6 and 14.8 nats for depths 1,000 to 50,000.", "detail": "Computed by tempering plus multi-histogram reweighting over residue vectors (108 temperatures), assuming numbers below 10^200 are a fair sample of the vectors. With the remaining budget of e^30.75, an ideal search to depth 5,000 would reach 214,000 (10.0%) and to depth 20,000 would reach 235,000. About 10^175 numbers qualify at 10%, one in 10^25: the difficulty is entirely location.", "chips": ["ideal tilt"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Result", "goldbach/sublinear/README.md (Result 3)", false], ["Data", "goldbach/sublinear/ideal_tilt_213070.txt", false]], "search": "prize ideal search tilt nats depth 213070", "note": {"level": "steer", "text": "Sizes the most any sublinear algorithm could win."}}, {"id": "s_crt", "group": "res", "title": "Barrier: free coordinates stop at the cap", "gist": "By the Chinese remainder theorem the residues modulo primes whose product is at most 10^200 can be prescribed, and N is then determined. Beyond that line the landscape is a random-energy model, so there are no local moves.", "detail": "The odd primes up to 463 and 2 multiply to 10^192.67, so the 460.5 nats of 10^200 just suffice to pin the primes up to 463: enumerating covers best-first is already an ideal search to depth 463. Lean: two numbers below X agreeing modulo M and every s in T satisfy M·∏T \u003c X; with X ≤ M·463⁴ at most three sieve primes can be kept.", "chips": ["Lean: move_budget"], "f": {"status": "comp", "impact": "bound"}, "meta": [["Argument", "goldbach/sublinear/README.md (Why nothing known collects the prize, point 1)", false]], "search": "barrier crt free coordinates cap random energy model local moves", "note": {"level": "bound", "text": "Explains why neither annealing nor hill-climbing helps above the line."}}, {"id": "s_lattice", "group": "res", "title": "Barrier: lattices and CRT with errors or lists", "gist": "Chinese remaindering with errors finds N only when lists are short and agreement is high: the decoding radius is about four times the typical agreement, while the best member among K exceeds the typical one by a few percent.", "detail": "For the 580 primes from 467 to 5,000 with one-class lists in a population of e^83, the best agreement that exists is about 22 against a radius of 78. Lean proves the radius is at least 3.88 times the typical agreement for K = 2³², and that informative lists lie outside it.", "chips": ["Johnson radius", "Lean: Radius"], "f": {"status": "comp", "impact": "bound"}, "meta": [["Argument", "goldbach/sublinear/README.md (point 2; Ladder rung 4)", false]], "search": "barrier lattice crt errors list decoding radius"}, {"id": "s_mitm", "group": "res", "title": "Barrier: meet in the middle, birthday trees, hashing", "gist": "A meet-in-the-middle yields solutions at constant cost each only when the list entropy H ≤ 2(F − C). For the whole problem and a memory of e^21 it extends the reach by one prime, worth about 0.2 nats. Locality-sensitive hashing gets at best K^0.94.", "detail": "The measured instance is the joint representative construction, which cancelled 24.3 digits of modulus at the price of the search entropy. Two independent derivations give hashing exponents 0.88 and 0.99.", "chips": ["Wagner", "LSH"], "f": {"status": "comp", "impact": "bound"}, "meta": [["Argument", "goldbach/sublinear/README.md (points 3–4)", false], ["Construction", "goldbach/joint.py", false]], "search": "barrier meet in the middle birthday wagner hashing LSH", "note": {"level": "bound", "text": "Going past the line by enumeration is possible, but only one prime at a time."}}, {"id": "s_score", "group": "res", "title": "Barrier: linear-time scoring is optimal", "gist": "What remains is to score every member (the fleet's sieve does it at 23 ns each). The gain of selection depends only on the kept fraction, and the sieve cannot skip members because marks are generated along progressions.", "detail": "Lean bounds: m questions to a black box reach the fraction m·g/K of the target set, and a perfect solver on the present progressions is worth at most 4.3–5.3 nats over the 3% rule for a population of e^22. Lattices of moves, additive and multiplicative splittings, tree search with bounds, polynomial parametrisations and row sharing by convolution were tried without success. The optimality statement itself is a conjecture.", "chips": ["Lean: BlackBox, Population"], "f": {"status": "comp", "impact": "bound"}, "meta": [["Argument", "goldbach/sublinear/README.md (point 5)", false]], "search": "barrier scoring linear time optimal black box selection"}, {"id": "s_lists", "group": "res", "title": "Barrier: list gain above Q is tiny", "gist": "For one prime s, any list of classes gains at most (W − μ)/ln(W/μ) rows per nat of constraint. For primes above Q (W = 1, at most 1,609 rows) that is 0.207 rows, or 0.005 nats of success, per nat spent: six times less than an extra covering prime.", "detail": "So nothing that enumerates a product of lists collects the part of the prize above Q. For arbitrary lists, ‘does any N below a bound meet every list’ is NP-complete already with two classes per modulus (Manders–Adleman).", "chips": ["Lean: ListGain", "NP-complete"], "f": {"status": "comp", "impact": "bound"}, "meta": [["Argument", "goldbach/sublinear/README.md (end of Why nothing known collects the prize)", false]], "search": "barrier list gain above Q np-complete manders adleman"}, {"id": "s_miniature", "group": "res", "title": "Exact miniature: N below 10^9, Q = 1,000", "gist": "A testbed small enough to enumerate: among the 157,947,020 even N below 10^9 with no prime factor from 3 to 29, exactly 256 have g ≥ 1,000. Ordering by rows left at depth 200 finds the first success after 13 numbers; ‘cover first’ needs 2,982.", "detail": "The tilt prediction matches the exact count within 3% where counts are large. The best numbers are independent needles, with no structure tying one to another (correlation −0.029). The Lean session's independent re-enumeration gave the same joint histogram byte for byte.", "chips": ["testbed"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Experiment", "goldbach/sublinear/README.md (The same thing in miniature, exactly)", false], ["Code", "goldbach/sublinear/toy_exact.c, toy_compare.py", false]], "search": "miniature exact enumeration 1e9 256 successes needles", "note": {"level": "steer", "text": "Any proposed method for (P′) can be tried here against the truth in seconds."}}, {"id": "s_parity", "group": "res", "title": "Function-field toy: a parity desert, formally proved", "gist": "Over F_q[x] with q an odd square, N = λ·V^p (V the product of all irreducibles up to degree J, λ a non-square) makes N − Q reducible for every irreducible Q up to degree J + 1. The extra degree comes from a parity theorem proved with Stickelberger–Swan.", "detail": "The Lean session derived the parity theorem independently as one identity over any field and gave, as far as either session knows, the first formal proof of Stickelberger–Swan. It also found two extensions (any degree; smooth derivative). Checked by factoring over F_3 to F_49 in every case tried.", "chips": ["toy model", "rung 1"], "f": {"status": "lean", "impact": "steer"}, "meta": [["Result", "goldbach/sublinear/README.md (Result 1; Corollary)", false], ["Checks", "goldbach/sublinear/parity_desert.py, parity_rule.py", false]], "search": "function field parity desert stickelberger swan toy", "note": {"level": "steer", "text": "The proof of concept that a compositeness mechanism that is neither a small factor nor luck exists, in a toy. The mechanism is classical (Swan 1962; Conrad–Conrad–Gross; Sawin–Shusterman)."}}, {"id": "s_ffsearch", "group": "res", "title": "Toy search over F₃[x]: the parity filter is worth 4–5×", "gist": "A full search in the toy (greedy cover on the 14 irreducibles of degree ≤ 3, 1,318 rows, members of degree 93) shows half the rows have odd parity and no irreducible N − Q has even parity. Testing only odd rows at the best 3% of members gives 4.5 times more successes per test.", "detail": "That is 1.4–1.6 nats: a constant factor, with every member still looked at. Counting also settles desert versus cover: an ordinary cover equals the desert at degree J + 1 and beats it above, so the toy's lesson is ‘use an ordinary cover, a generic N, and the parity filter on what is left’.", "chips": ["rung 2", "toy search"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Experiment", "goldbach/sublinear/README.md (Result 2; Desert or cover?)", false], ["Code", "goldbach/sublinear/toy_search.py", false]], "search": "toy search F3 parity filter 4.5x desert versus cover"}, {"id": "s_nonanalogy", "group": "res", "title": "Why the integers are harder: a known non-analogy", "gist": "The integer counterpart would compute or force the parity of the number of prime factors of N − q. But λ(n) has no formula short of factoring, and congruence information is uncorrelated with λ by the parity problem of sieve theory.", "detail": "Every algebraic certificate tried exhibits a factorisation costing a congruence per row. Genus theory gives an integer shadow (the number of prime factors is the 2-rank of a class group plus one) but reading it means finding ambiguous forms, as hard as factoring. The function-field mechanism is the standard ‘non-analogy’ example (K. Conrad).", "chips": ["parity problem"], "f": {"status": "heur", "impact": "bound"}, "meta": [["Argument", "goldbach/sublinear/README.md (Why the integers are harder)", false]], "search": "integers harder non-analogy parity problem sieve genus", "note": {"level": "bound", "text": "Names the new mathematics that would be needed: an integer parity filter, the counterpart of H2."}}, {"id": "s_ladder", "group": "res", "title": "The sublinear programme's ladder", "gist": "Eight rungs: (1) toy theorem with formal proof, done; (2) toy search with the parity filter, done; (3) a fully enumerable toy, to do; (4) formal barrier statements for the integer search, done; (5) integer information that is not a residue, open; (6) wheel and list merges, costed at 0.1–0.4 nats; (7) the ideal-search prize, done; (8) problem (P′), open.", "detail": "The programme's own account of what is proved, measured and open, as of 2026-11-23.", "chips": ["rungs 1–8"], "f": {"status": "open", "impact": "steer"}, "meta": [["Ladder", "goldbach/sublinear/README.md (Ladder)", false]], "search": "ladder rungs programme status"}, {"id": "s_verdict", "group": "res", "title": "Sublinear verdict so far: none known, none ruled out", "gist": "A third compositeness mechanism exists in the toy (worth 4–5×, or 1.4–1.6 nats). Over the integers a perfect search would win 3.5–14.8 nats. Beyond the Chinese-remainder line, lattices, list decoding, meet-in-the-middle, birthday trees and hashing are ruled out with numbers, and linear-time scoring is at its optimum.", "detail": "Nothing proves that no sublinear algorithm exists. Still open: (P′), the fully enumerable toy, non-residue information (equal to H2) and constants worth 0.1–0.4 nats. The research session has since corrected the README (commit 02564fb): ‘about e^10’ now names an explicit family and points to the count of about e^27 at depth 10^8, and the cost exponent between neighbouring targets runs from 1.2 to 2.3, not 1.4 to 1.8.", "chips": ["verdict"], "f": {"status": "open", "impact": "steer"}, "meta": [["Verdict", "goldbach/sublinear/README.md", false]], "search": "sublinear verdict programme none known", "note": {"level": "steer", "text": "As of 23 November: the prize is real and of known size, covers collect all of it below the line, and above it every known method costs more than scoring members one by one."}}], "edges": [{"id": "c_brainstorm>c_budget", "from": "c_brainstorm", "to": "c_budget", "kind": "direct", "hops": 1, "chain": [], "short": "uses the budget law", "why": "The idea about moving a candidate under the cap (idea 46) is settled by the budget law: the moduli's product leaves only so many numbers below the cap."}, {"id": "c_cover_cap>c_layers", "from": "c_cover_cap", "to": "c_layers", "kind": "direct", "hops": 1, "chain": [], "short": "finite layered form", "why": "The layered form of the cap theorem calls the layered-cover lemma to obtain the classes, then the Chinese remainder theorem to obtain N."}, {"id": "c_cover_cap>l_cover", "from": "c_cover_cap", "to": "l_cover", "kind": "direct", "hops": 1, "chain": [], "short": "applies", "why": "The cap theorem applies the covering certificate to show that the chosen N, which lies in all the classes, has no Goldbach summand below Q."}, {"id": "c_johnson>c_deficit", "from": "c_johnson", "to": "c_deficit", "kind": "direct", "hops": 1, "chain": [], "short": "sums the per-list loss", "why": "The Johnson-radius theorem is the single-list inequality added up over all lists: each informative list loses at least ln 2 − 2 ln r/r."}, {"id": "c_layers>c_pigeon", "from": "c_layers", "to": "c_pigeon", "kind": "direct", "hops": 1, "chain": [], "short": "uses pigeonhole", "why": "The layered cover reduces to the first-moment pigeonhole: the middle layer is a residue vector leaving at most the average number of rows."}, {"id": "c_listgain_q>c_listgain", "from": "c_listgain_q", "to": "c_listgain", "kind": "direct", "hops": 1, "chain": [], "short": "special case", "why": "The 'above Q' limit is the general one-prime bound for primes where every class kills at most one row, with 213,070 and 1,609 fixing the constant 0.207."}, {"id": "c_nofree>c_pigeon", "from": "c_nofree", "to": "c_pigeon", "kind": "direct", "hops": 1, "chain": [], "short": "same first moment", "why": "No-free-lunch and the pigeonhole bound use the same exact count of rows left, summed over all residue vectors. One bounds the average from above, the other from below."}, {"id": "c_transfer>l_isleast", "from": "c_transfer", "to": "l_isleast", "kind": "direct", "hops": 1, "chain": [], "short": "states", "why": "The second half concludes IsLeastSummand (p′ + 1) (p′ − p + 1)."}, {"id": "f_degree>f_desert", "from": "f_degree", "to": "f_desert", "kind": "direct", "hops": 1, "chain": [], "short": "calls the desert theorem", "why": "The J ≥ 1 form is the desert theorem with the extra degree conditions removed."}, {"id": "f_desert>f_notirr", "from": "f_desert", "to": "f_notirr", "kind": "direct", "hops": 1, "chain": [], "short": "parity for the extra degree", "why": "With N = c·V^p, N has zero derivative and a non-square leading coefficient, and every irreducible factor of Q′ (degree at most J) divides V and hence N. Those are exactly the corollary's hypotheses, so N − Q cannot be irreducible."}, {"id": "f_general>f_notirr", "from": "f_general", "to": "f_notirr", "kind": "direct", "hops": 1, "chain": [], "short": "same parity corollary", "why": "The smooth-V variant of the desert (desert_smooth, in this group) uses the same parity corollary for the rows that need it."}, {"id": "f_notirr>f_parity", "from": "f_notirr", "to": "f_parity", "kind": "indirect", "hops": 3, "chain": ["FunctionField.not_irreducible_sub_of_isSquare_card", "FunctionField.not_irreducible_sub", "FunctionField.even_card_factors", "FunctionField.parity_card_factors"], "short": "rests on", "why": "A parity of the factor count that is even for every irreducible Q rules out N − Q being irreducible (one factor)."}, {"id": "f_parity>f_discr_sub", "from": "f_parity", "to": "f_discr_sub", "kind": "direct", "hops": 1, "chain": [], "short": "applies", "why": "The discriminant identity gives the discriminant of N − Q in terms of Q alone, which is what Stickelberger–Swan needs."}, {"id": "f_parity>f_sw", "from": "f_parity", "to": "f_sw", "kind": "direct", "hops": 1, "chain": [], "short": "applies", "why": "Stickelberger–Swan turns the discriminant, up to a square, into the parity of the number of irreducible factors."}, {"id": "f_resultant>f_sw", "from": "f_resultant", "to": "f_sw", "kind": "direct", "hops": 1, "chain": [], "short": "parity from the resultant form", "why": "The resultant form of the discriminant feeds the same parity count: Stickelberger–Swan turns the discriminant, up to a square, into the parity of the number of irreducible factors, now for every N with zero derivative."}, {"id": "g_f26>g_sched", "from": "g_f26", "to": "g_sched", "kind": "direct", "hops": 1, "chain": [], "short": "uses the schedule", "why": "Same reduction for the 26-bit version."}, {"id": "g_f30>g_sched", "from": "g_f30", "to": "g_sched", "kind": "direct", "hops": 1, "chain": [], "short": "uses the schedule", "why": "Same reduction with radix 2^90, through the general-radix version of the schedule lemma."}, {"id": "g_f52>g_sched", "from": "g_f52", "to": "g_sched", "kind": "direct", "hops": 1, "chain": [], "short": "uses the schedule", "why": "The lane theorem reduces to 'the schedule's last value is 1 exactly when 2^(n−1) ≡ 1', which the schedule lemma proves for every odd n."}, {"id": "g_fermat28>g_sched", "from": "g_fermat28", "to": "g_sched", "kind": "indirect", "hops": 2, "chain": ["Gpu28.fermat28_correct", "Gpu28.fermat28_lane", "Fscan.Schedule.schedule_iffR"], "short": "uses the schedule", "why": "Uses the general-radix schedule with R = 2^672: no 'R mod n' is needed, because the start value is a power of two."}, {"id": "g_fermat28>g_step28", "from": "g_fermat28", "to": "g_step28", "kind": "indirect", "hops": 3, "chain": ["Gpu28.fermat28_correct", "Gpu28.fermat28_lane", "Gpu28.lane_inv", "Gpu28.step_spec"], "short": "repeats one step", "why": "A lane is t repetitions of one Montgomery step; the step theorem carries the invariant from one iteration to the next."}, {"id": "g_fermat28r>g_fermat28", "from": "g_fermat28r", "to": "g_fermat28", "kind": "indirect", "hops": 2, "chain": ["Gpu28.fermat28r_correct", "Gpu28.fermat28r_lane", "Gpu28.flag_iff"], "short": "shares the final check", "why": "The redundant-limb variant reuses the final-comparison lemma and keeps limbs below 2^29 in between, normalising once at the end."}, {"id": "g_step28>g_conv", "from": "g_step28", "to": "g_conv", "kind": "indirect", "hops": 5, "chain": ["Gpu28.step_spec", "Gpu28.pre_spec", "Gpu28.upper_inv", "Gpu28.colAcc_eq", "Gpu28.prodSum_sqTerms", "Gpu28.conv_self"], "short": "column sums", "why": "The step squares column by column; the column-sum identity is what shows this computes the true square."}, {"id": "l_cb073>c_cover_cap", "from": "l_cb073", "to": "c_cover_cap", "kind": "indirect", "hops": 4, "chain": ["eventually_exists_even_le_no_summand", "eventually_exists_even_le_of_mertensUpper", "eventually_exists_even_of_mertensUpper_nat", "Cap.exists_even_le_of_layers", "Cap.exists_even_le_of_cover"], "short": "built from the cap theorem", "why": "The asymptotic statement is the finite cap theorem applied with y about ln X, so that the primorial of y, the bound on N, stays below X."}, {"id": "l_cb073>l_mertensUpper", "from": "l_cb073", "to": "l_mertensUpper", "kind": "direct", "hops": 1, "chain": [], "short": "needs", "why": "The unconditional c = 0.73 comes from the elementary Mertens-type bound with κ = 1.367, because 0.73 \u003c 1/κ = 0.7314."}, {"id": "l_cb073>l_pnt", "from": "l_cb073", "to": "l_pnt", "kind": "indirect", "hops": 3, "chain": ["eventually_exists_even_le_no_summand", "eventually_exists_even_le_of_mertensUpper", "eventually_exists_even_of_mertensUpper_nat", "eventually_primeCounting_bounds"], "short": "counts primes", "why": "The pigeonhole layer (odd primes up to δy) and the mop-up layer (primes in (δy, y]) are counted with the prime number theorem in its two-sided form."}, {"id": "l_cb12>l_cb_sharp", "from": "l_cb12", "to": "l_cb_sharp", "kind": "indirect", "hops": 2, "chain": ["eventually_exists_even_le_no_summand_six_fifths", "eventually_exists_even_le_of_mertensThird_explicit", "eventually_exists_even_le_of_mertensThird"], "short": "explicit constants", "why": "The c = 1.2 theorem is the sharp theorem with Mertens supplied, with the constants γ and C₂ replaced by their proved crude bounds."}, {"id": "l_cb12>l_consts", "from": "l_cb12", "to": "l_consts", "kind": "indirect", "hops": 2, "chain": ["eventually_exists_even_le_no_summand_six_fifths", "eventually_exists_even_le_of_mertensThird_explicit", "exp_neg_eulerMascheroni_lt"], "short": "crude constants", "why": "The numbers C₂ ≤ 0.684 and e^(−γ) \u003c 0.6066 give 1.2 × 2 × 0.684 × 0.6066 \u003c 1, which is what the sharp theorem asks."}, {"id": "l_cb_sharp>c_cover_cap", "from": "l_cb_sharp", "to": "c_cover_cap", "kind": "indirect", "hops": 4, "chain": ["eventually_exists_even_le_of_mertensThird", "eventually_exists_even_le_of_mertensUpper", "eventually_exists_even_of_mertensUpper_nat", "Cap.exists_even_le_of_layers", "Cap.exists_even_le_of_cover"], "short": "built from the cap theorem", "why": "The asymptotic statement is the finite cap theorem applied with y about ln X, so that the primorial of y, the bound on N, stays below X."}, {"id": "l_cb_sharp>l_mertens3", "from": "l_cb_sharp", "to": "l_mertens3", "kind": "indirect", "hops": 2, "chain": ["eventually_exists_even_le_of_mul_lt_one", "mertensThird", "Mertens.mertens_third"], "short": "needs Mertens", "why": "The fraction of rows a random cover leaves is a product over odd primes of (r − 2)/(r − 1). Mertens' third theorem, with the twin-prime constant, evaluates it as 2·C₂·e^(−γ)/ln w, whose reciprocal is the constant 1.349."}, {"id": "l_cb_sharp>l_pnt", "from": "l_cb_sharp", "to": "l_pnt", "kind": "indirect", "hops": 3, "chain": ["eventually_exists_even_le_of_mertensThird", "eventually_exists_even_le_of_mertensUpper", "eventually_exists_even_of_mertensUpper_nat", "eventually_primeCounting_bounds"], "short": "counts primes", "why": "The pigeonhole layer and the mop-up layer are counted with the prime number theorem in its two-sided form."}, {"id": "l_cover_exists>l_cover", "from": "l_cover_exists", "to": "l_cover", "kind": "direct", "hops": 1, "chain": [], "short": "applies", "why": "Realises the cover with numbers chosen by Dirichlet's theorem, then uses the covering certificate to show their least summand is at least Q."}, {"id": "l_cover_exists>l_isleast", "from": "l_cover_exists", "to": "l_isleast", "kind": "direct", "hops": 1, "chain": [], "short": "states", "why": "Its conclusion is a statement about IsLeastSummand."}, {"id": "l_exists>l_isleast", "from": "l_exists", "to": "l_isleast", "kind": "direct", "hops": 1, "chain": [], "short": "states", "why": "Its conclusion is IsLeastSummand N s."}, {"id": "l_exists>l_primorial", "from": "l_exists", "to": "l_primorial", "kind": "direct", "hops": 1, "chain": [], "short": "applies", "why": "With N = s + t and t ≡ −s modulo the primorial of s − 1, N is a multiple of that primorial. The primorial-core lemma then shows no prime below s is a summand."}, {"id": "l_gammaid>l_mertensconst", "from": "l_gammaid", "to": "l_mertensconst", "kind": "indirect", "hops": 2, "chain": ["Mertens.limit_eq_eulerMascheroni", "Mertens.tendsto_abel", "Mertens.tendsto_B_sub_log_log"], "short": "rests on", "why": "To identify the limit, the proof first needs that it exists."}, {"id": "l_linnik>l_isleast", "from": "l_linnik", "to": "l_isleast", "kind": "direct", "hops": 1, "chain": [], "short": "states", "why": "Its conclusion is IsLeastSummand."}, {"id": "l_linnik>l_primorial", "from": "l_linnik", "to": "l_primorial", "kind": "direct", "hops": 1, "chain": [], "short": "applies", "why": "Linnik bounds the size of the prime t; the primorial-core lemma gives the least summand, as in the qualitative theorem."}, {"id": "l_mertens3>l_gammaid", "from": "l_mertens3", "to": "l_gammaid", "kind": "indirect", "hops": 2, "chain": ["Mertens.mertens_third", "Mertens.tendsto_log_log_add_sum", "Mertens.limit_eq_eulerMascheroni"], "short": "rests on", "why": "Mertens' third theorem is the exponential of the identified limit: ln ln w + Σ ln(1 − 1/p) tends to −γ."}, {"id": "l_mertensconst>l_mertens1", "from": "l_mertensconst", "to": "l_mertens1", "kind": "indirect", "hops": 2, "chain": ["Mertens.tendsto_B_sub_log_log", "Mertens.abs_A_sub_log_le", "Mertens.abs_sum_lam_sub_log_le"], "short": "rests on", "why": "The existence of the limit of B(b) − ln ln b follows from the bound in Mertens' first theorem."}, {"id": "l_unbounded>l_exists", "from": "l_unbounded", "to": "l_exists", "kind": "direct", "hops": 1, "chain": [], "short": "applies", "why": "Choose a prime above the bound B; the previous theorem gives an N whose least summand is that prime."}, {"id": "l_unbounded>l_isleast", "from": "l_unbounded", "to": "l_isleast", "kind": "direct", "hops": 1, "chain": [], "short": "states", "why": "Its conclusion is IsLeastSummand."}, {"id": "r_158209>l_isleast", "from": "r_158209", "to": "l_isleast", "kind": "direct", "hops": 1, "chain": [], "short": "states", "why": "The record is a statement about IsLeastSummand N 158209, the definition of the least Goldbach summand."}, {"id": "r_158209>x_block", "from": "r_158209", "to": "x_block", "kind": "indirect", "hops": 4, "chain": ["exists_lt_ten_pow_200_least_summand_158209", "Record200_g158209.isLeastSummand", "Record200_g158209.noSummand", "Record200_g158209.block3", "noSummandIn_of_desertBlockCheck"], "short": "20 block checks", "why": "The negative half of the record, that no smaller prime is a summand, is twenty block checks, each re-run by the kernel."}, {"id": "r_158209>x_ecpp_step", "from": "r_158209", "to": "x_ecpp_step", "kind": "indirect", "hops": 4, "chain": ["exists_lt_ten_pow_200_least_summand_158209", "Record200_g158209.isLeastSummand", "Record200_g158209.prime_complement", "Record200_g158209.prime_c0", "ECPP.prime_of_stepCheck"], "short": "27-step primality proof", "why": "That N − 158,209 is prime is proved by a chain of 27 elliptic-curve steps, each checked by the one-step soundness theorem."}, {"id": "r_158209>x_least", "from": "r_158209", "to": "x_least", "kind": "indirect", "hops": 2, "chain": ["exists_lt_ten_pow_200_least_summand_158209", "Record200_g158209.isLeastSummand", "isLeastSummand_of_noSummandIn"], "short": "closes with", "why": "The record's proof ends in the complete-certificate theorem: block checks for every prime below 158,209 plus primality of 158,209 and of N − 158,209."}, {"id": "r_cover15907>x_coveredin", "from": "r_cover15907", "to": "x_coveredin", "kind": "indirect", "hops": 3, "chain": ["Cover15907.complete_cover", "Cover15907.covered", "Cover15907.block1", "covered_of_desertBlockCheck_nil"], "short": "divisibility only", "why": "The pure cover is two block tests with an empty residual list, read as divisibility and turned into 'no summand' by the covered-range theorem."}, {"id": "r_earlier>l_isleast", "from": "r_earlier", "to": "l_isleast", "kind": "direct", "hops": 1, "chain": [], "short": "states", "why": "Each earlier record is a statement about IsLeastSummand."}, {"id": "r_earlier>x_block", "from": "r_earlier", "to": "x_block", "kind": "indirect", "hops": 4, "chain": ["exists_lt_ten_pow_200_least_summand_157837", "Record200_g157837.isLeastSummand", "Record200_g157837.noSummand", "Record200_g157837.block2", "noSummandIn_of_desertBlockCheck"], "short": "block checks", "why": "Same block-check method; the earlier records need 13 to 20 blocks."}, {"id": "r_earlier>x_ecpp_step", "from": "r_earlier", "to": "x_ecpp_step", "kind": "indirect", "hops": 4, "chain": ["exists_lt_ten_pow_200_least_summand_157837", "Record200_g157837.isLeastSummand", "Record200_g157837.prime_complement", "Record200_g157837.prime_c0", "ECPP.prime_of_stepCheck"], "short": "primality chains", "why": "Same elliptic-curve primality method for N − g, with chains of 18 to 32 steps."}, {"id": "r_earlier>x_least", "from": "r_earlier", "to": "x_least", "kind": "indirect", "hops": 2, "chain": ["exists_lt_ten_pow_200_least_summand_157837", "Record200_g157837.isLeastSummand", "isLeastSummand_of_noSummandIn"], "short": "closes with", "why": "Same proof shape as the standing record, with different data."}, {"id": "r_family>x_coveredin", "from": "r_family", "to": "x_coveredin", "kind": "indirect", "hops": 4, "chain": ["exists_progression_complete_cover_15907", "Cover15907.complete_cover_family", "Cover15907.covered", "Cover15907.block1", "covered_of_desertBlockCheck_nil"], "short": "shifts the cover", "why": "The progression result uses the same covered-range theorem after shifting the cover from N to N + t·M."}, {"id": "x_block>x_fermat", "from": "x_block", "to": "x_fermat", "kind": "direct", "hops": 1, "chain": [], "short": "failed test = composite", "why": "Every row that neither the cover nor a small prime removes is shown composite by a failed base-2 Fermat test, which this theorem turns into a proof."}, {"id": "x_ecpp_step>x_ecmul", "from": "x_ecpp_step", "to": "x_ecmul", "kind": "direct", "hops": 1, "chain": [], "short": "arithmetic is the group law", "why": "The step check multiplies points on the curve with plain natural-number arithmetic modulo N. This theorem says that arithmetic computes the real elliptic-curve group law modulo any prime factor of N."}, {"id": "x_ecpp_step>x_ecpp_group", "from": "x_ecpp_step", "to": "x_ecpp_group", "kind": "direct", "hops": 1, "chain": [], "short": "point-count bound", "why": "If N were composite, a point of order q on the curve modulo its smallest prime factor p would need q ≤ 2p + 1. The test forces q to be larger, a contradiction."}, {"id": "x_least>l_isleast", "from": "x_least", "to": "l_isleast", "kind": "direct", "hops": 1, "chain": [], "short": "concludes", "why": "The certificate's conclusion is IsLeastSummand N g."}, {"id": "r_family>r_cover15907", "from": "r_family", "to": "r_cover15907", "kind": "doc", "hops": 1, "chain": [], "short": "same cover, whole progression", "why": "The family theorem is the pure cover extended to every N + t·M, with M the product of the moduli: the Records file says 'the same for a whole arithmetic progression'.", "source": "Records.lean, docstring of exists_progression_complete_cover_15907"}, {"id": "x_block>l_cover", "from": "x_block", "to": "l_cover", "kind": "doc", "hops": 1, "chain": [], "short": "is the cover, as a check", "why": "The block check is the computational form of the covering idea: a row is dead when some covering modulus divides N − q. The abstract covering theorem is not invoked; the check re-derives it by division.", "source": "Desert.lean header: 'every q for which some modulus in coverMods divides N − q (the covering system)'"}, {"id": "g_fermat2>g_montsqr", "from": "g_fermat2", "to": "g_montsqr", "kind": "direct", "hops": 1, "chain": [], "short": "uses Montgomery squaring", "why": "The exponent loop is a chain of Montgomery squarings and doublings; its invariant is exactly the specification of mont_sqr (and dbl_mod).", "source": "Gpu/Fermat.lean line 120: IsMont.sqr applies montSqr_spec (method syntax, which the tool does not follow)"}, {"id": "g_f52>x_fermat", "from": "g_f52", "to": "x_fermat", "kind": "doc", "hops": 1, "chain": [], "short": "computes the same test", "why": "The kernel decides exactly the base-2 Fermat test whose failure the certificate checker turns into a proof of compositeness. The two theorems are independent; they meet at the predicate 2^(n−1) mod n = 1.", "source": "Fscan/Kernel52.lean and Desert.lean state the same predicate"}, {"id": "g_fermat2>x_fermat", "from": "g_fermat2", "to": "x_fermat", "kind": "doc", "hops": 1, "chain": [], "short": "computes the same test", "why": "Same: the GPU kernel's flag is the base-2 Fermat predicate.", "source": "Gpu/Fermat.lean and Desert.lean state the same predicate"}, {"id": "g_fermat28>x_fermat", "from": "g_fermat28", "to": "x_fermat", "kind": "doc", "hops": 1, "chain": [], "short": "computes the same test", "why": "Same: the 200-digit kernel's flag is the base-2 Fermat predicate, so a 'composite' verdict from the search is one the certificate checker would also accept.", "source": "Gpu28/Kernel.lean and Desert.lean state the same predicate"}, {"id": "e_records>e_fleet200", "from": "e_records", "to": "e_fleet200", "kind": "doc", "hops": 1, "chain": [], "short": "budget game", "why": "The board's budget-game entry is the fleet campaign's output.", "source": "RESEARCH_LOG.md record board; Records.lean docstrings"}, {"id": "e_records>e_height", "from": "e_records", "to": "e_height", "kind": "doc", "hops": 1, "chain": [], "short": "height game", "why": "The board's height entry: 10,000,141 at a 61,329-digit N.", "source": "RESEARCH_LOG.md record board"}, {"id": "e_records>e_threshold", "from": "e_records", "to": "e_threshold", "kind": "doc", "hops": 1, "chain": [], "short": "threshold game", "why": "The board's threshold entry: a 150-digit N with g = 104,527.", "source": "RESEARCH_LOG.md record board"}, {"id": "e_records>e_megagap", "from": "e_records", "to": "e_megagap", "kind": "doc", "hops": 1, "chain": [], "short": "megagap", "why": "The 2,692-digit record is the high-water mark for desert length against prime-gap records.", "source": "RESULTS.md prime-gap domination record"}, {"id": "e_records>e_verify", "from": "e_records", "to": "e_verify", "kind": "doc", "hops": 1, "chain": [], "short": "every record verified", "why": "Nothing counts as a record until it passes the verification legs.", "source": "proth/README.md verification stack"}, {"id": "e_fleet200>e_selective", "from": "e_fleet200", "to": "e_selective", "kind": "doc", "hops": 1, "chain": [], "short": "uses the 3% rule", "why": "The fleet tests only the emptiest members of each block.", "source": "brainstorm/README.md"}, {"id": "e_fleet200>e_gpu", "from": "e_fleet200", "to": "e_gpu", "kind": "doc", "hops": 1, "chain": [], "short": "runs on GPUs", "why": "The scanning is done by CUDA kernels on the fleet's cards.", "source": "brainstorm/README.md; gpu/fleet.py"}, {"id": "e_fleet200>e_cover_opt", "from": "e_fleet200", "to": "e_cover_opt", "kind": "doc", "hops": 1, "chain": [], "short": "covers from tempering", "why": "Each campaign runs on covers produced by the tempering sampler and its variants.", "source": "fscan/cover/README.md"}, {"id": "e_fleet200>m_density", "from": "e_fleet200", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "planned with the cost model", "why": "Expected successes per fleet-day come from E = |U|·boost/ln N.", "source": "brainstorm/portfolio_budget.txt"}, {"id": "e_height>m_bls", "from": "e_height", "to": "m_bls", "kind": "doc", "hops": 1, "chain": [], "short": "N − 1 certificate", "why": "Every height record is a complete cover plus a BLS-certified complement.", "source": "proth/README.md"}, {"id": "e_height>e_gpu", "from": "e_height", "to": "e_gpu", "kind": "doc", "hops": 1, "chain": [], "short": "GPU screening", "why": "The 5M and 10M records were screened on a Colab A100.", "source": "proth/README.md (GPU screening)"}, {"id": "e_height>e_verify", "from": "e_height", "to": "e_verify", "kind": "doc", "hops": 1, "chain": [], "short": "three legs", "why": "Each height record passed all three verification legs.", "source": "proth/README.md; merge_2026-11-21.md"}, {"id": "e_megagap>m_density", "from": "e_megagap", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "calibrates the model", "why": "Predicted 6.6 against measured 6.56: one of the model's checkpoints.", "source": "RESULTS.md"}, {"id": "e_megagap>m_classical", "from": "e_megagap", "to": "m_classical", "kind": "doc", "hops": 1, "chain": [], "short": "gap versus desert", "why": "The comparison with the largest prime gap rests on the transfer proposition: a prime gap gives a Goldbach desert, but not conversely.", "source": "thesis ch2 (Proposition prop:transfer)"}, {"id": "e_threshold>e_gpu", "from": "e_threshold", "to": "e_gpu", "kind": "doc", "hops": 1, "chain": [], "short": "throughput gave the jump", "why": "The 150-digit record came from the CUDA engine, about 430 times the CPU pipeline.", "source": "RESEARCH_LOG.md 2026-07-28"}, {"id": "e_threshold>e_fscan", "from": "e_threshold", "to": "e_fscan", "kind": "doc", "hops": 1, "chain": [], "short": "low-end scanners", "why": "The 20–63 digit records came from tscan and fscan.", "source": "RESULTS.md; fscan/README.md"}, {"id": "e_threshold>e_cover_opt", "from": "e_threshold", "to": "e_cover_opt", "kind": "doc", "hops": 1, "chain": [], "short": "cover for Q", "why": "Each threshold record is a cover of the primes below Q plus one lucky member.", "source": "RESULTS.md"}, {"id": "e_selective>m_selection", "from": "e_selective", "to": "m_selection", "kind": "doc", "hops": 1, "chain": [], "short": "the identity behind it", "why": "The selection identity says how much of the success mass the kept fraction holds.", "source": "fscan/cover/README.md (Which members to test)"}, {"id": "e_selective>m_density", "from": "e_selective", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "success per member", "why": "A member with k rows left succeeds with probability about (1 − p)^k.", "source": "tscan/README.md"}, {"id": "e_cover_opt>m_density", "from": "e_cover_opt", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "scored by E", "why": "Covers are ranked by E = |U|·boost/ln N.", "source": "cover.py docstring"}, {"id": "e_c15907>e_cover_opt", "from": "e_c15907", "to": "e_cover_opt", "kind": "doc", "hops": 1, "chain": [], "short": "same sampler", "why": "Complete covers come from the tempering sampler run on the 89 smallest odd primes.", "source": "sublinear/README.md"}, {"id": "e_verify>m_bls", "from": "e_verify", "to": "m_bls", "kind": "doc", "hops": 1, "chain": [], "short": "checks the N − 1 proof", "why": "Two of the three legs rebuild N and check the BLS certificate.", "source": "proth/README.md; bls/README.md"}, {"id": "m_ceiling>m_density", "from": "m_ceiling", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "same prime density", "why": "The ceiling uses the same Hardy–Littlewood prime density as the cost model, with no fitted constant.", "source": "ceiling_model.py docstring"}, {"id": "m_price>m_density", "from": "m_price", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "exponent of the cost", "why": "Each price is e^E times the cost of a member.", "source": "price_list.py"}, {"id": "m_price>e_cover_opt", "from": "m_price", "to": "e_cover_opt", "kind": "doc", "hops": 1, "chain": [], "short": "rows by target", "why": "The prices use the best row counts found for each target.", "source": "fscan/cover/README.md (table 88)"}, {"id": "m_portfolio>m_price", "from": "m_portfolio", "to": "m_price", "kind": "doc", "hops": 1, "chain": [], "short": "uses the prices", "why": "Expected records are computed from the price list.", "source": "brainstorm/README.md"}, {"id": "m_portfolio>m_ceiling", "from": "m_portfolio", "to": "m_ceiling", "kind": "doc", "hops": 1, "chain": [], "short": "yardstick", "why": "The 10% and 7.4% figures are fractions of the ceiling.", "source": "brainstorm/README.md"}, {"id": "m_portfolio>e_fleet200", "from": "m_portfolio", "to": "e_fleet200", "kind": "doc", "hops": 1, "chain": [], "short": "starting point", "why": "The projection starts from the fleet's record and its remaining compute.", "source": "portfolio_budget.txt"}, {"id": "m_budgets>m_density", "from": "m_budgets", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "the two terms of E", "why": "The two budgets are the two terms that set E: nats of modulus (ln r each) and nats of work.", "source": "brainstorm/README.md"}, {"id": "m_budgets>e_cover_opt", "from": "m_budgets", "to": "e_cover_opt", "kind": "doc", "hops": 1, "chain": [], "short": "oracle against covers", "why": "The oracle floor is compared with the covers in use (E = 39.2 for 88 moduli).", "source": "oracle_213070.txt"}, {"id": "m_budgets>c_budget", "from": "m_budgets", "to": "c_budget", "kind": "doc", "hops": 1, "chain": [], "short": "same accounting", "why": "Lean's budget law is the exact version of ‘a prime costs ln r of the modulus budget’: fixing one class costs a factor r, allowing k classes costs r/k.", "source": "Budget.lean header"}, {"id": "m_density>m_h1", "from": "m_density", "to": "m_h1", "kind": "doc", "hops": 1, "chain": [], "short": "rests on independence", "why": "The model multiplies the probabilities of the leftover rows; that product form is hypothesis H1.", "source": "wp9_closure_theorem.md §2"}, {"id": "m_density>c_kills", "from": "m_density", "to": "c_kills", "kind": "doc", "hops": 1, "chain": [], "short": "kills are residues", "why": "The cost model starts from the fact that a row is composite exactly when q is in N's class modulo some prime. Lean proves that fact.", "source": "Rows.lean header: the cost model of SOK_GOLDBACH_GAPS.md rests on these facts"}, {"id": "e_cover_opt>c_nofree", "from": "e_cover_opt", "to": "c_nofree", "kind": "doc", "hops": 1, "chain": [], "short": "the cover's gain is the deviation", "why": "Lean's first-moment law says averaged over residue vectors the modulus budget cancels out of the exponent: whatever a cover gains, it gains as the deviation of one vector from the average.", "source": "FirstMoment.lean header"}, {"id": "m_closure>m_h1", "from": "m_closure", "to": "m_h1", "kind": "doc", "hops": 1, "chain": [], "short": "assumes H1", "why": "The closure inequality is conditional on independence of the leftover rows.", "source": "wp9_closure_theorem.md §1"}, {"id": "m_closure>m_h2", "from": "m_closure", "to": "m_h2", "kind": "doc", "hops": 1, "chain": [], "short": "assumes H2", "why": "The certificate-free half is conditional on no compositeness test cheaper than one exponentiation.", "source": "wp9_closure_theorem.md §1"}, {"id": "m_closure>m_lemma2", "from": "m_closure", "to": "m_lemma2", "kind": "doc", "hops": 1, "chain": [], "short": "uses Lemma 2", "why": "Correlation between rows would have to run through shared divisors, which the lemma confines to primes below Q.", "source": "wp9_closure_theorem.md §3"}, {"id": "m_closure>m_entropy", "from": "m_closure", "to": "m_entropy", "kind": "doc", "hops": 1, "chain": [], "short": "uses Lemma 1", "why": "Each family of planted certificates is closed by the entropy accounting.", "source": "wp9_closure_theorem.md §3"}, {"id": "m_closure>m_falsify", "from": "m_closure", "to": "m_falsify", "kind": "doc", "hops": 1, "chain": [], "short": "empirical support", "why": "The sweep of 13,661 instances and the evolutionary search found no scheme that passes.", "source": "wp9_closure_theorem.md §8, §12"}, {"id": "m_lemma2>m_h1", "from": "m_lemma2", "to": "m_h1", "kind": "doc", "hops": 1, "chain": [], "short": "conditional half", "why": "Proposition 2b, that the rows' compositeness events then factor, needs H1.", "source": "wp9_closure_theorem.md §3 Lemma 2"}, {"id": "m_lemma2>c_two_rows", "from": "m_lemma2", "to": "c_two_rows", "kind": "doc", "hops": 1, "chain": [], "short": "same statement in Lean", "why": "Lean proves that a common divisor of two rows below Q is itself below Q. The research lemma and the Lean theorem say the same thing; neither cites the other.", "source": "content match: wp9_closure_theorem.md Lemma 2a and Rows.lean lt_of_dvd_two_rows"}, {"id": "m_lemma2>m_wp7", "from": "m_lemma2", "to": "m_wp7", "kind": "doc", "hops": 1, "chain": [], "short": "empirical leg", "why": "The probe of residual bias (P5) is the empirical support for the lemma's conditional half.", "source": "wp9_closure_theorem.md §7"}, {"id": "m_entropy>m_wp7", "from": "m_entropy", "to": "m_wp7", "kind": "doc", "hops": 1, "chain": [], "short": "built on the probes", "why": "Lemma 1 turns the five probes into case-by-case closures.", "source": "wp9_closure_theorem.md §3"}, {"id": "m_falsify>m_wp7", "from": "m_falsify", "to": "m_wp7", "kind": "doc", "hops": 1, "chain": [], "short": "calibrated on the probes", "why": "Tier 0 reproduced every probe's hand-derived number before the sweep began.", "source": "wp9_closure_theorem.md §6"}, {"id": "m_wp7>c_prime_moduli", "from": "m_wp7", "to": "c_prime_moduli", "kind": "doc", "hops": 1, "chain": [], "short": "probe P1, proved in Lean", "why": "Probe P1 (prime powers are dominated) is the statement that prime moduli suffice, which Lean proves.", "source": "Rows.lean header cites phd/wp7_probes.md P1"}, {"id": "m_wp7>c_poly", "from": "m_wp7", "to": "c_poly", "kind": "doc", "hops": 1, "chain": [], "short": "probe P2, proved in Lean", "why": "Probe P2 (polynomial identities kill at most O(√Q) rows) is proved exactly in Lean as the value-set ceiling.", "source": "Poly.lean header cites phd/wp7_probes.md P2"}, {"id": "m_rounding>e_cover_opt", "from": "m_rounding", "to": "e_cover_opt", "kind": "doc", "hops": 1, "chain": [], "short": "baseline is greedy", "why": "The 867-row benchmark is the greedy-plus-anneal cover that the attacks tried to beat.", "source": "wp9/door1/"}, {"id": "m_rounding>m_density", "from": "m_rounding", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "what a nat is worth", "why": "A row costs 0.024 nats at Q = 122,000, which turns row counts into compute.", "source": "wp9/door1/d10_diagnostics.md"}, {"id": "m_doors>m_closure", "from": "m_doors", "to": "m_closure", "kind": "doc", "hops": 1, "chain": [], "short": "door 3", "why": "Door 3, the paradigm, is the closure theorem.", "source": "wp8_beyond_covering.md §6"}, {"id": "m_doors>m_rounding", "from": "m_doors", "to": "m_rounding", "kind": "doc", "hops": 1, "chain": [], "short": "door 1", "why": "Door 1, the rounding gap, is the integrality gap of the cover LP.", "source": "wp8_beyond_covering.md §6"}, {"id": "m_doors>m_staircase", "from": "m_doors", "to": "m_staircase", "kind": "doc", "hops": 1, "chain": [], "short": "door 2", "why": "Door 2, compute, is the staircase plan.", "source": "wp8_beyond_covering.md §6"}, {"id": "m_staircase>m_price", "from": "m_staircase", "to": "m_price", "kind": "doc", "hops": 1, "chain": [], "short": "rung prices", "why": "Each rung's cost is read from the price ladder.", "source": "wp8_beyond_covering.md §0"}, {"id": "m_staircase>m_rounding", "from": "m_staircase", "to": "m_rounding", "kind": "doc", "hops": 1, "chain": [], "short": "door 1 gate", "why": "Staying in-house at the later rungs is gated on Door 1 delivering at least 2 nats.", "source": "thesis ch7 (Operation Staircase)"}, {"id": "m_staircase>e_selective", "from": "m_staircase", "to": "e_selective", "kind": "doc", "hops": 1, "chain": [], "short": "engine gains", "why": "Selective testing on the GPU is the first of the planned engine optimisations.", "source": "wp8_beyond_covering.md §2"}, {"id": "m_staircase>e_gpu", "from": "m_staircase", "to": "e_gpu", "kind": "doc", "hops": 1, "chain": [], "short": "fleet growth", "why": "The plan depends on GPU throughput and on adding cards.", "source": "wp8_beyond_covering.md §3"}, {"id": "m_toycrt>m_wp3", "from": "m_toycrt", "to": "m_wp3", "kind": "doc", "hops": 1, "chain": [], "short": "checks the barrier", "why": "The toy decoder tests the decoding barrier on a case small enough to run.", "source": "toy_crt/results.md"}, {"id": "m_wp10>m_h1", "from": "m_wp10", "to": "m_h1", "kind": "doc", "hops": 1, "chain": [], "short": "untouched by GRH", "why": "H1 is a k-tuple statement that GRH does not give.", "source": "wp10_grh_remark.md §1"}, {"id": "m_wp10>m_h2", "from": "m_wp10", "to": "m_h2", "kind": "doc", "hops": 1, "chain": [], "short": "untouched by GRH", "why": "Nothing in GRH speeds up compositeness testing below one exponentiation.", "source": "wp10_grh_remark.md §1"}, {"id": "m_wp10>m_bls", "from": "m_wp10", "to": "m_bls", "kind": "doc", "hops": 1, "chain": [], "short": "BLS beats Miller", "why": "Miller's test under GRH costs core-years where the BLS proof costs seconds.", "source": "wp12_prime_covering_grh_ledger.md §3"}, {"id": "m_thm2>m_wp10", "from": "m_thm2", "to": "m_wp10", "kind": "doc", "hops": 1, "chain": [], "short": "sieve floors", "why": "Theorem 2 uses WP10's analysis of the sieve level and positivity floors.", "source": "wp10_grh_remark.md §1"}, {"id": "m_thm2>m_thm1", "from": "m_thm2", "to": "m_thm1", "kind": "doc", "hops": 1, "chain": [], "short": "brackets with Theorem 1", "why": "Theorems 1 and 2 together bracket certified deserts between 1.349·ln N·ln ln N and (ln N)^(4+ε).", "source": "wp12_prime_covering_grh_ledger.md §2"}, {"id": "m_lower>m_classical", "from": "m_lower", "to": "m_classical", "kind": "doc", "hops": 1, "chain": [], "short": "needs cover realisation", "why": "The unconditional growth rate feeds the Erdős–Rankin covering through the realisation theorem.", "source": "thesis ch2 (Theorem thm:lower)"}, {"id": "m_thm1>m_lower", "from": "m_thm1", "to": "m_lower", "kind": "doc", "hops": 1, "chain": [], "short": "beats the thesis bound", "why": "Theorem 1 beats the thesis's growth bound by ln₃N/ln₄N.", "source": "wp12_prime_covering_grh_ledger.md §2"}, {"id": "m_bls>m_classical", "from": "m_bls", "to": "m_classical", "kind": "doc", "hops": 1, "chain": [], "short": "a complete cover", "why": "The construction starts from a complete covering certificate.", "source": "wp11_bls_game1.md §1"}, {"id": "m_proofcarrying>m_bls", "from": "m_proofcarrying", "to": "m_bls", "kind": "doc", "hops": 1, "chain": [], "short": "height-game version missing", "why": "The same idea for BLS-certified records needs Pocklington's criterion, which is not formalised.", "source": "wp12_prime_covering_grh_ledger.md §4"}, {"id": "m_thm1>l_cb_sharp", "from": "m_thm1", "to": "l_cb_sharp", "kind": "doc", "hops": 1, "chain": [], "short": "kernel-checked version", "why": "The Lean library proves the covering bound with every constant below 1.349 and no hypothesis.", "source": "CoverBound.lean; COVERBOUND_STATEMENTS.md"}, {"id": "m_thm1>c_layers", "from": "m_thm1", "to": "c_layers", "kind": "doc", "hops": 1, "chain": [], "short": "the layered skeleton", "why": "The finite layered-cover lemma is the kernel-checked skeleton of the research session's two lower bounds.", "source": "Layers.lean header"}, {"id": "m_thm1>c_smooth", "from": "m_thm1", "to": "c_smooth", "kind": "doc", "hops": 1, "chain": [], "short": "fixed layer, Erdős–Rankin", "why": "The structure of rows left by a fixed layer is step E4 of the Erdős–Rankin style improvement mentioned in Layers.lean. The research session says that improvement is only a remark, proved neither by it nor in Lean.", "source": "Layers.lean header and docstring of smooth_or_large_prime_factor"}, {"id": "m_thm1>l_counting", "from": "m_thm1", "to": "l_counting", "kind": "doc", "hops": 1, "chain": [], "short": "measured against", "why": "Theorem 1 beats the counting constant 1/2 (Shi); the Lean library records the counting bound, with constant 1/48, as the baseline.", "source": "Counting.lean; wp12 ledger"}, {"id": "m_classical>l_primorial", "from": "m_classical", "to": "l_primorial", "kind": "doc", "hops": 1, "chain": [], "short": "proved in Lean", "why": "The primorial-core lemma lem:primcore.", "source": "Basic.lean docstring: Paper Lemma lem:primcore"}, {"id": "m_classical>l_cover", "from": "m_classical", "to": "l_cover", "kind": "doc", "hops": 1, "chain": [], "short": "proved in Lean", "why": "The covering certificate prop:cover.", "source": "Covering.lean docstring: Paper Proposition prop:cover"}, {"id": "m_classical>l_cover_exists", "from": "m_classical", "to": "l_cover_exists", "kind": "doc", "hops": 1, "chain": [], "short": "proved in Lean", "why": "Every cover is realised, thm:coverdirichlet.", "source": "Covering.lean docstring: Paper Theorem thm:coverdirichlet"}, {"id": "m_classical>l_exists", "from": "m_classical", "to": "l_exists", "kind": "doc", "hops": 1, "chain": [], "short": "proved in Lean", "why": "Every odd prime is a least summand, thm:dirichlet.", "source": "Basic.lean docstring: Paper Theorem thm:dirichlet"}, {"id": "m_classical>l_linnik", "from": "m_classical", "to": "l_linnik", "kind": "doc", "hops": 1, "chain": [], "short": "proved in Lean (with Linnik)", "why": "The effective form of thm:dirichlet under Linnik's theorem.", "source": "Effective.lean docstring"}, {"id": "m_classical>c_transfer", "from": "m_classical", "to": "c_transfer", "kind": "doc", "hops": 1, "chain": [], "short": "proved in Lean", "why": "A prime gap hands over a Goldbach gap, one way only.", "source": "Transfer.lean (content match with the thesis proposition)"}, {"id": "m_proofcarrying>x_least", "from": "m_proofcarrying", "to": "x_least", "kind": "doc", "hops": 1, "chain": [], "short": "the certificate theorem", "why": "The decidable check plus a primality proof for N − g is the complete certificate theorem.", "source": "Desert.lean docstring of isLeastSummand_of_noSummandIn"}, {"id": "m_proofcarrying>r_158209", "from": "m_proofcarrying", "to": "r_158209", "kind": "doc", "hops": 1, "chain": [], "short": "delivered for the budget game", "why": "The standing record is the first record carried by such a proof.", "source": "Record200_g158209.lean header"}, {"id": "m_selection>c_hits", "from": "m_selection", "to": "c_hits", "kind": "doc", "hops": 1, "chain": [], "short": "hit mass is the expectation", "why": "Lean proves that the logged hit mass is exactly the expected number of successes.", "source": "Selection.lean header"}, {"id": "m_selection>c_selection", "from": "m_selection", "to": "c_selection", "kind": "doc", "hops": 1, "chain": [], "short": "tilt of a Gaussian", "why": "Lean proves the claim from the research session's feedback of 2026-11-22.", "source": "Tilt.lean header"}, {"id": "m_selection>c_tilt", "from": "m_selection", "to": "c_tilt", "kind": "doc", "hops": 1, "chain": [], "short": "what the best member is worth", "why": "Lean quantifies the enrichment of the best member among K.", "source": "Tilt.lean header"}, {"id": "m_selection>m_density", "from": "m_selection", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "success per member", "why": "The identity is stated for the model's success probability (1 − p)^R.", "source": "fscan/cover/README.md"}, {"id": "c_hits>m_h1", "from": "c_hits", "to": "m_h1", "kind": "doc", "hops": 1, "chain": [], "short": "assumes independence", "why": "The theorem is exact given that each row is prime independently with probability p. Lean says: the independence itself is the model and not a theorem; that is hypothesis H1.", "source": "Selection.lean header"}, {"id": "v_brainstorm>m_budgets", "from": "v_brainstorm", "to": "m_budgets", "kind": "doc", "hops": 1, "chain": [], "short": "uses the oracle floor", "why": "‘No idea is worth a nat’ rests on the two-budget argument.", "source": "brainstorm/README.md"}, {"id": "v_brainstorm>m_portfolio", "from": "v_brainstorm", "to": "m_portfolio", "kind": "doc", "hops": 1, "chain": [], "short": "compute levers", "why": "The compute levers are priced with the portfolio model.", "source": "brainstorm/README.md"}, {"id": "v_brainstorm>m_price", "from": "v_brainstorm", "to": "m_price", "kind": "doc", "hops": 1, "chain": [], "short": "price of each nat", "why": "Each idea is measured against the price list.", "source": "brainstorm/README.md"}, {"id": "v_brainstorm>c_brainstorm", "from": "v_brainstorm", "to": "c_brainstorm", "kind": "doc", "hops": 1, "chain": [], "short": "settled by theorem", "why": "Twenty-one of the ideas were settled by Lean theorems, including the third-mechanism bounds.", "source": "Brainstorm.lean header; verdicts_on_research_ideas.txt"}, {"id": "m_errata>m_wp3", "from": "m_errata", "to": "m_wp3", "kind": "doc", "hops": 1, "chain": [], "short": "retracted open window", "why": "WP3 version 1 claimed an open window for decoding.", "source": "wp3_small_representative_memo.md header"}, {"id": "m_errata>m_wp10", "from": "m_errata", "to": "m_wp10", "kind": "doc", "hops": 1, "chain": [], "short": "erratum", "why": "GRH's Linnik gain corrected from 2.5 to 1.2.", "source": "wp10_grh_remark.md erratum"}, {"id": "m_errata>m_thm2", "from": "m_errata", "to": "m_thm2", "kind": "doc", "hops": 1, "chain": [], "short": "caveat", "why": "Theorem 2 is asymptotic and vacuous at record parameters.", "source": "wp12 ledger §2 caveat"}, {"id": "m_errata>e_height", "from": "m_errata", "to": "e_height", "kind": "doc", "hops": 1, "chain": [], "short": "independent second certificate", "why": "The 1.2M record was relabelled after the two searches turned out to share a progression.", "source": "merge_2026-11-21.md"}, {"id": "m_errata>m_density", "from": "m_errata", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "calibration doubt", "why": "The claim that the model is within 0.1 nats sits uneasily with campaign 3's logs, 0.2–0.4 nats above.", "source": "RESEARCH_LOG.md; ledger doubts"}, {"id": "e_cap200>c_pigeon", "from": "e_cap200", "to": "c_pigeon", "kind": "doc", "hops": 1, "chain": [], "short": "first-moment law", "why": "The experiments start from the exact first-moment law, which Lean proves: the average rows left over all vectors.", "source": "phd/cap200/README.md (The exact statements they rely on are proved in Cap/)"}, {"id": "e_cap200>c_budget", "from": "e_cap200", "to": "c_budget", "kind": "doc", "hops": 1, "chain": [], "short": "members per vector", "why": "The number of members per vector below the cap comes from the budget law.", "source": "phd/cap200/README.md"}, {"id": "e_cap200>m_density", "from": "e_cap200", "to": "m_density", "kind": "doc", "hops": 1, "chain": [], "short": "scored by E", "why": "Covers are scored by E = −k·ln(1 − p) with p = 0.0239.", "source": "phd/cap200/README.md"}, {"id": "e_cap200>e_cover_opt", "from": "e_cap200", "to": "e_cover_opt", "kind": "doc", "hops": 1, "chain": [], "short": "cross-checked", "why": "Its best covers agree with the research session's sampler to a few rows (850 against 851 at Q = 122,000).", "source": "phd/cap200/README.md (Other targets)"}, { ition", "why": "Lean proves the cost bound and the condition ln P ≤ 2F − C for a useful merge.", "source": "sublinear/README.md point 3; Population.lean header"}, {"id": "s_score>c_blackbox", "from": "s_score", "to": "c_blackbox", "kind": "doc", "hops": 1, "chain": [], "short": "Lean: no oracle", "why": "A method that only asks questions finds a good member for at most the fraction m·g/K.", "source": "sublinear/README.md point 5; BlackBox.lean"}, {"id": "s_score>c_population", "from": "s_score", "to": "c_population", "kind": "doc", "hops": 1, "chain": [], "short": "Lean: population bound", "why": "No selection of tested members beats what the population holds.", "source": "sublinear/README.md point 5; Population.lean"}, {"id": "s_score>c_fewrows", "from": "s_score", "to": "c_fewrows", "kind": "doc", "hops": 1, "chain": [], "short": "Lean: few rows is rare", "why": "The Chernoff-form bound on the hit mass of the best members.", "source": "sublinear/README.md point 5; Population.lean"}, {"id": "s_score>e_selective", "from": "s_score", "to": "e_selective", "kind": "doc", "hops": 1, "chain": [], "short": "the 3% rule is the optimum", "why": "The present kept fraction is set by sieve cost against test cost.", "source": "sublinear/README.md point 5"}, {"id": "s_score>e_fscan", "from": "s_score", "to": "e_fscan", "kind": "doc", "hops": 1, "chain": [], "short": "what did not work", "why": "fscan's negative results are an early form of this barrier.", "source": "fscan/README.md (What did not work)"}, {"id": "s_lists>c_listgain", "from": "s_lists", "to": "c_listgain", "kind": "doc", "hops": 1, "chain": [], "short": "Lean: one prime buys few rows", "why": "The general one-prime bound.", "source": "sublinear/README.md; ListGain.lean"}, {"id": "s_lists>c_listgain_q", "from": "s_lists", "to": "c_listgain_q", "kind": "doc", "hops": 1, "chain": [], "short": "Lean: above Q no list pays", "why": "The case of primes above Q.", "source": "sublinear/README.md; ListGain.lean"}, {"id": "s   /* gestures */
