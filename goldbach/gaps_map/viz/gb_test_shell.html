⟩ := List.any_eq_true.mp hany\n    simp only [Bool.and_eq_true, decide_eq_true_eq, beq_iff_eq] at hdq\n    have hd2 := hsmall d hd\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "noSummandIn_of_desertBlockCheck  Desert", "note": {"level": "engine", "text": "This is the trust anchor. Search code, GPUs and heuristics can all be wrong; the record is still valid, because the kernel recomputes each block."}}, {"id": "x_least", "group": "chk", "title": "Complete certificate for g(N) = g", "gist": "If no prime below g is a summand of N, and g and N − g are both prime, then g is the least Goldbach summand of N.", "detail": "Glues the two halves of a record: the negative side (block checks for everything below g) and the positive side (primality of g and of N − g).", "chips": ["Desert.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "isLeastSummand_of_noSummandIn", true], ["File", "goldbach/lean/GoldbachGaps/Desert.lean", true]], "source": "/-- A complete certificate for `g(N) = g`: the negative side by block checks, the positive\nside by the primality of `g` and of the complement `N - g`. -/\ntheorem isLeastSummand_of_noSummandIn {N g : ℕ} (h : NoSummandIn N 0 g) (hg : g.Prime)\n    (hc : (N - g).Prime) : IsLeastSummand N g :=\n  ⟨⟨hg, hc⟩, fun p hp => not_lt.mp fun hlt => h p (Nat.zero_le p) hlt hp⟩", "sourceLabel": "Lean statement and proof (first lines)", "search": "isLeastSummand_of_noSummandIn  Desert"}, {"id": "x_coveredin", "group": "chk", "title": "A covered range has no summand", "gist": "If every q in a range has N − q divisible by a proper divisor (a covering modulus), then no q in the range is a Goldbach summand. A block test with an empty residual list certifies exactly this.", "detail": "Used for the pure cover (15,907) where no Fermat tests are needed at all. It is the divisibility-only half of the block check.", "chips": ["CompleteCover.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "CoveredIn.noSummandIn", true], ["File", "goldbach/lean/GoldbachGaps/CompleteCover.lean", true], ["Also covers", "covered_of_desertBlockCheck_nil", false]], "source": "/-- A covered range has no Goldbach summand: each `N - q` has the proper divisor `r`. -/\ntheorem CoveredIn.noSummandIn {N g a b : ℕ} {coverMods smallPrimes : List ℕ}\n    (hlists : desertListsCheck N g coverMods smallPrimes = true)\n    (h : CoveredIn N coverMods a b) (hb : b ≤ g) : NoSummandIn N a b := by\n  simp only [desertListsCheck, Bool.and_eq_true, decide_eq_true_eq, List.all_eq_true] at hlists\n  obtain ⟨-, hcover⟩ := hlists\n  rintro q ha hb' ⟨hqp, hNq⟩\n  obtain ⟨r, hr, hrq⟩ := h q ha hb' hqp\n  have hr2 := hcover r hr\n  rcases (Nat.dvd_prime hNq).mp hrq with h1 | h1 \u003c;> omega", "sourceLabel": "Lean statement and proof (first lines)", "search": "CoveredIn.noSummandIn covered_of_desertBlockCheck_nil CompleteCover"}, {"id": "x_ecpp_step", "group": "chk", "title": "Elliptic-curve primality: one step is sound", "gist": "If q is prime and a point on an elliptic curve modulo N behaves as the certificate says, then N is prime. A chain of 27 steps proves that the 200-digit N − 158,209 is prime.", "detail": "A kernel-checkable Atkin–Morain/Goldwasser–Kilian criterion in the format PARI/GP prints. It avoids Hasse's theorem by using the trivial point count: at most 2p + 1 points on the curve modulo p, and requiring 4N \u003c (q − 1)². Modular inverses are recomputed by untrusted code but re-checked.", "chips": ["ECPP.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "ECPP.prime_of_stepCheck", true], ["File", "goldbach/lean/GoldbachGaps/ECPP.lean", true]], "source": "theorem prime_of_stepCheck {N a x y s q : ℕ} (hq : q.Prime) (h : stepCheck N a x y s q = true) :\n    N.Prime := by\n  open WeierstrassCurve.Affine in\n  simp only [stepCheck, Bool.and_eq_true, decide_eq_true_eq] at h\n  obtain ⟨⟨⟨⟨hN1, hs⟩, hbound⟩, hy2⟩, hrest⟩ := h\n  cases hR : ecMul N a (x, y) fuel s with\n  | none => simp [hR] at hrest\n  | some R =>\n  simp only [hR] at hrest\n  cases hZ : ecMul N a R fuel (q - 1) with\n  | none => simp [hZ] at hrest\n  | some Z =>\n  simp only [hZ, Bool.and_eq_true, decide_eq_true_eq] at hrest\n  obtain ⟨hZx, hZy⟩ := hrest\n  by_contra hNp\n  have hN0 : 0 \u003c N := by omega\n  have hp : N.minFac.Prime := Nat.minFac_prime (by omega)\n  have hpN : N.minFac ∣ N := Nat.minFac_dvd N\n  have hp2 : N.minFac ^ 2 ≤ N := Nat.minFac_sq_le_self hN0 hNp\n  generalize N.minFac = p at hp hpN hp2\n  have : Fact p.Prime := ⟨hp⟩\n  -- the curve through `(x, y)` modulo `p`\n  obtain ⟨b, hb⟩ : ∃ b : ZMod p, b = (y : ZMod p) ^ 2 - (x : ZMod p) ^ 3 - (a : ZMod p) * x :=\n    ⟨_, rfl⟩\n  have\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "ECPP.prime_of_stepCheck  ECPP", "note": {"level": "engine", "text": "Without this the record would need a primality claim taken on trust. It is why the 158,209 statement is a theorem."}}, {"id": "x_ecpp_group", "group": "chk", "title": "Elliptic-curve points: finite, at most 2p + 1", "gist": "The elliptic curve modulo a prime p has finitely many points, at most 2p + 1: at most two points above each x, plus the point at infinity.", "detail": "The weakest point count that still makes the primality argument work. It replaces Hasse's bound, which is not needed.", "chips": ["ECPP.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "ECPP.point_finite_and_card", true], ["File", "goldbach/lean/GoldbachGaps/ECPP.lean", true]], "source": "/-- The trivial point count: at most two points above each `x`, plus the point at infinity. -/\nlemma point_finite_and_card (a b : ZMod p) :\n    Finite (curve p a b).Point ∧ Nat.card (curve p a b).Point ≤ 2 * p + 1 := by\n  classical\n  let S : Finset (ZMod p × ZMod p) :=\n    Finset.univ.filter fun xy => xy.2 ^ 2 = xy.1 ^ 3 + a * xy.1 + b\n  have hS : S.card ≤ 2 * p := by\n    have hsub : S ⊆ Finset.univ.biUnion fun x : ZMod p =>\n        ((Polynomial.nthRoots 2 (x ^ 3 + a * x + b)).toFinset).image fun y => (x, y) := by\n      intro xy hxy\n      rw [Finset.mem_filter] at hxy\n      refine Finset.mem_biUnion.mpr ⟨xy.1, Finset.mem_univ _, Finset.mem_image.mpr ⟨xy.2, ?_, rfl⟩⟩\n      rw [Multiset.mem_toFinset, Polynomial.mem_nthRoots (by norm_num)]\n      exact hxy.2\n    calc S.card\n        ≤ (Finset.univ.biUnion fun x : ZMod p =>\n            ((Polynomial.nthRoots 2 (x ^ 3 + a * x + b)).toFinset).image fun y => (x, y)).card :=\n          Finset.card_le_card hsub\n      _ ≤ ∑ x : ZMod p,\n            (\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "ECPP.point_finite_and_card  ECPP"}, {"id": "x_ecmul", "group": "chk", "title": "The arithmetic the certificate runs is the group law", "gist": "Adding, doubling and multiplying points with natural-number arithmetic mod N is shown to agree with Mathlib's elliptic-curve group law modulo any prime factor of N.", "detail": "This ties the fast integer computation the kernel performs to the abstract group in which the primality argument lives.", "chips": ["ECPP.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "ECPP.ecMul_rep", true], ["File", "goldbach/lean/GoldbachGaps/ECPP.lean", true], ["Also covers", "ECPP.ecAdd_rep, ECPP.ecDbl_rep", false]], "source": "lemma ecMul_rep {a : ℕ} {b : ZMod p} (hpN : p ∣ N) (hN : 0 \u003c N) {P : ℕ × ℕ}\n    {T : (curve p a b).Point} (hP : Rep (curve p a b) P T) :\n    ∀ (f k : ℕ) (S : ℕ × ℕ), 1 ≤ k → ecMul N a P f k = some S →\n      Rep (curve p a b) S (k • T) := by\n  intro f\n  induction f with\n  | zero =>\n    intro k S _ h\n    simp [ecMul] at h\n  | succ f ih =>\n    intro k S hk h\n    rw [ecMul] at h\n    split_ifs at h with hk1 hodd\n    · obtain rfl := (Option.some.inj h).symm\n      obtain rfl : k = 1 := by omega\n      rwa [one_nsmul]\n    · cases hQ : ecMul N a P f (k / 2) with\n      | none => simp [hQ] at h\n      | some Q =>\n        simp only [hQ] at h\n        have hQrep := ih (k / 2) Q (by omega) hQ\n        cases hD : ecDbl N a Q with\n        | none => simp [hD] at h\n        | some D =>\n          simp only [hD] at h\n          have hSrep := ecAdd_rep hpN hN h (ecDbl_rep hpN hN hD hQrep) hP\n          have hsmul : k • T = (k / 2) • T + (k / 2) • T + T := by\n            conv_lhs => rw [show k = k / 2 + k / 2 + 1\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "ECPP.ecMul_rep ECPP.ecAdd_rep ECPP.ecDbl_rep ECPP"}, {"id": "r_158209", "group": "rec", "title": "Record: g(N) = 158,209 for a 200-digit N", "gist": "A 200-digit number N whose least Goldbach summand is 158,209: N minus every smaller prime is composite, and N − 158,209 is prime. The standing record.", "detail": "Found on 2026-11-23 at 12:48 UTC, the first record built on 89 covering moduli (every odd prime from 3 to 463). The Lean file carries N, the cover, the trial divisors, 20 block checks and a 27-step elliptic-curve primality certificate for N − 158,209. The Lean kernel re-evaluates all of it; the data are not trusted.", "chips": ["Records.lean", "Record200_g158209.lean"], "f": {"status": "lean", "impact": "record"}, "meta": [["Lean name", "exists_lt_ten_pow_200_least_summand_158209", true], ["File", "goldbach/lean/GoldbachGaps/Records.lean", true]], "source": "/-- Budget game, the standing record of 2026-11-23 12:48 UTC, the first on 89 covering\nmoduli (a near-miss of a `Q = 170000` design, vector `q170000_m89_p2c00019_v545`,\n`k = 10814286`): there is an `N` below `10^200` whose least Goldbach summand is `158209`. -/\ntheorem exists_lt_ten_pow_200_least_summand_158209 :\n    ∃ N \u003c 10 ^ 200, IsLeastSummand N 158209 :=\n  ⟨Record200_g158209.N, Record200_g158209.N_lt, Record200_g158209.isLeastSummand⟩", "sourceLabel": "Lean statement and proof (first lines)", "search": "exists_lt_ten_pow_200_least_summand_158209  Records", "note": {"level": "record", "text": "This is the number the project is trying to beat. The stretch target of 213,070 is 10% of the research team's modelled ceiling of about 2.13 million."}}, {"id": "r_earlier", "group": "rec", "title": "Earlier records: 104,527 up to 157,837", "gist": "The ladder before today's record, each kernel-checked the same way: 104,527 (150 digits), then 119,419, 125,269 and 133,981 (199 digits), then 146,191 and 157,837 (200 digits).", "detail": "All but the first sit under a cap of 10^199 or 10^200. The covers use 68 moduli (the 150-digit record), 88 moduli (everything from 119,419 to 157,837) and 89 moduli (158,209). Each file holds 13 to 20 block checks and a primality chain of 18 to 32 steps. Three 23-digit records (10,729; 10,771; 11,701) exist as small test cases of the same pipeline.", "chips": ["Records.lean", "6 record files"], "f": {"status": "lean", "impact": "record"}, "meta": [["Lean name", "exists_lt_ten_pow_200_least_summand_157837", true], ["File", "goldbach/lean/GoldbachGaps/Records.lean", true], ["Also covers", "exists_lt_ten_pow_200_least_summand_146191, exists_lt_ten_pow_199_least_summand_eq, exists_lt_ten_pow_199_least_summand_125269, exists_lt_ten_pow_199_least_summand_133981, exists_lt_ten_pow_150_least_summand_gt", false]], "source": "/-- Budget game, record of 2026-11-23 02:08 UTC (campaign at `Q = 150000`, variant\n`pt_q150k_t528`, `k = 4224399187`): there is an `N` below `10^200` whose least Goldbach\nsummand is `157837`. -/\ntheorem exists_lt_ten_pow_200_least_summand_157837 :\n    ∃ N \u003c 10 ^ 200, IsLeastSummand N 157837 :=\n  ⟨Record200_g157837.N, Record200_g157837.N_lt, Record200_g157837.isLeastSummand⟩", "sourceLabel": "Lean statement and proof (first lines)", "search": "exists_lt_ten_pow_200_least_summand_157837 exists_lt_ten_pow_200_least_summand_146191 exists_lt_ten_pow_199_least_summand_eq exists_lt_ten_pow_199_least_summand_125269 exists_lt_ten_pow_199_least_summand_133981 exists_lt_ten_pow_150_least_summand_gt Records", "note": {"level": "record", "text": "Shows the pace: seven records between 2026-11-22 and 2026-11-23. Each reused the same certificate checkers; only the data changed."}}, {"id": "r_cover15907", "group": "rec", "title": "Pure cover: no prime below 15,907 is a summand", "gist": "A 193-digit even N such that for every prime q below 15,907 the number N − q has a divisor between 2 and 463. No primality or compositeness test is needed, only divisibility.", "detail": "This is what a cover alone certifies, with no luck involved. It uses the 89 odd primes up to 463. The same N also appears as a number below 10^200. The record 158,209 reaches about ten times further by using a cover that leaves some rows alive, then searching millions of candidates for one where every leftover row happens to be composite.", "chips": ["Cover15907.lean", "Records.lean"], "f": {"status": "lean", "impact": "record"}, "meta": [["Lean name", "Cover15907.complete_cover", true], ["File", "goldbach/lean/GoldbachGaps/Cover15907.lean", true], ["Also covers", "exists_lt_ten_pow_200_complete_cover_15907", false]], "source": "/-- **The complete cover.** `N` is even, has 193 digits, and for every prime `q \u003c 15907` the\nnumber `N - q` has a divisor `r` with `2 ≤ r ≤ 463` (so it is composite: `r \u003c N - q`). -/\ntheorem complete_cover :\n    N \u003c 10 ^ 193 ∧ Even N ∧\n      (∀ q \u003c 15907, q.Prime → ∃ r, 2 ≤ r ∧ r ≤ 463 ∧ r \u003c N - q ∧ r ∣ N - q) ∧\n      ∀ q \u003c 15907, ¬ IsSummand N q := by\n  have hl := lists\n  simp only [desertListsCheck, Bool.and_eq_true, decide_eq_true_eq, List.all_eq_true] at hl\n  refine ⟨N_lt, N_even, fun q hq hqp => ?_, fun q hq => noSummand q (Nat.zero_le q) hq⟩\n  obtain ⟨r, hr, hrq⟩ := covered q (Nat.zero_le q) hq hqp\n  have h2 := hl.2 r hr\n  have hQ : Q = 15907 := rfl\n  exact ⟨r, h2.1, coverMods_le r hr, by omega, hrq⟩", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cover15907.complete_cover exists_lt_ten_pow_200_complete_cover_15907 Cover15907", "note": {"level": "record", "text": "Shows where the real difficulty is. A complete cover stops near 16 thousand; the rest of the record comes from searching and being lucky, which is what the capped-game cost laws measure."}}, {"id": "r_family", "group": "rec", "title": "A family of 21,378,978 covered numbers", "gist": "The same cover works for a whole arithmetic progression N + t·M: 21,378,978 even numbers below 10^200, each with every prime q \u003c 15,907 killed by divisibility.", "detail": "This is the search space of the capped game: the 89 covering moduli multiply to about 10^192, so below 10^200 there are only about 2×10^7 even candidates for one choice of residues. Each candidate then has to survive its leftover rows by luck.", "chips": ["Cover15907.lean", "Records.lean"], "f": {"status": "lean", "impact": "record"}, "meta": [["Lean name", "exists_progression_complete_cover_15907", true], ["File", "goldbach/lean/GoldbachGaps/Records.lean", true]], "source": "/-- The same for a whole arithmetic progression: `21378978` numbers `N + t M` below `10^200`,\nall even, all with every `N + t M - q` (`q \u003c 15907` prime) divisible by some `r ≤ 463`. -/\ntheorem exists_progression_complete_cover_15907 :\n    ∃ N M : ℕ, 0 \u003c M ∧ ∀ t \u003c 21378978, N + t * M \u003c 10 ^ 200 ∧ Even (N + t * M) ∧\n      (∀ q \u003c 15907, q.Prime →\n        ∃ r, 2 ≤ r ∧ r ≤ 463 ∧ r \u003c N + t * M - q ∧ r ∣ N + t * M - q) ∧\n      ∀ q \u003c 15907, ¬ IsSummand (N + t * M) q := by\n  refine ⟨Cover15907.N, Cover15907.M, ?_, fun t ht => ?_⟩\n  · rw [Cover15907.M_eq]\n    norm_num\n  · obtain ⟨h1, h2, h3⟩ := Cover15907.complete_cover_family t\n    exact ⟨Cover15907.family_lt t ht, h1, h2, h3⟩\n/-! The bounds `15787` and `15877` of the two earlier covers, under the names they were\nannounced with. They are consequences of the cover to `15907` (the witness is that cover's\n`N`, not the earlier ones). -/", "sourceLabel": "Lean statement and proof (first lines)", "search": "exists_progression_complete_cover_15907  Records", "note": {"level": "record", "text": "Makes the budget concrete: one cover gives about 21 million candidates, so the search has to run over many covers. Adding the next two primes (467, 479) would shrink each family to about 95 numbers."}}, {"id": "f_sw", "group": "ff", "title": "Stickelberger–Swan theorem over any finite field", "gist": "For a squarefree polynomial over a finite field of odd characteristic, whether its number of irreducible factors is even or odd is decided by whether its discriminant is a square.", "detail": "The Lean statement is for every finite field (Swan's form of Stickelberger's theorem); the parity reading above is the odd-characteristic case used here. It is the foundation of the 'parity desert' below.", "chips": ["FunctionField/Stickelberger.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "FunctionField.stickelbergerSwan", true], ["File", "goldbach/lean/GoldbachGaps/FunctionField/Stickelberger.lean", true], ["Also covers", "FunctionField.discr_mul", false]], "source": "/-- Stickelberger's theorem in Swan's form holds for every finite field. -/\ntheorem stickelbergerSwan (F : Type*) [Field F] [Fintype F] [DecidableEq F] :\n    StickelbergerSwan F := by\n  intro hF g\n  refine induction_on_coprime (P := fun g : F[X] => Squarefree g →\n    quadraticChar F (discr g) = (-1) ^ (g.natDegree + Multiset.card (normalizedFactors g)))\n    g ?_ ?_ ?_ ?_\n  · intro h\n    exact absurd h not_squarefree_zero\n  · intro x hx _\n    obtain ⟨c, hc, rfl⟩ := Polynomial.isUnit_iff.mp hx\n    rw [discr_C, natDegree_C, normalizedFactors_of_isUnit hx, Multiset.card_zero, map_one]\n    simp\n  · intro p i hp hsq\n    rcases i with _ | _ | i\n    · rw [pow_zero, ← C_1, discr_C, natDegree_C, map_one, C_1, normalizedFactors_one,\n        Multiset.card_zero]\n      simp\n    · rw [zero_add, pow_one, normalizedFactors_irreducible hp.irreducible,\n        Multiset.card_singleton]\n      exact quadraticChar_discr_of_irreducible hF hp.irreducible\n    · exfalso\n      have h := hsq p ⟨p ^ i, by ring⟩\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "FunctionField.stickelbergerSwan FunctionField.discr_mul Stickelberger"}, {"id": "f_discr_sub", "group": "ff", "title": "Discriminant of N − Q when N has zero derivative", "gist": "If N′ = 0 and Q is monic of smaller degree, with every irreducible factor of Q′ dividing N, then disc(N − Q) = ± λ^(n−d−1)·d^(n−d)·disc(Q).", "detail": "In characteristic p a polynomial N = c·V^p has zero derivative, so the discriminant of N − Q depends only on Q. The algebraic fact behind the function-field desert.", "chips": ["FunctionField/ParityDesert.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "FunctionField.discr_sub", true], ["File", "goldbach/lean/GoldbachGaps/FunctionField/ParityDesert.lean", true]], "source": "/-- **The discriminant identity.** Over any field: if `N' = 0`, `Q` is monic of degree `d`\nwith `d ≠ 0` in the field and `d \u003c n = deg N`, and every irreducible factor of `Q'` divides\n`N`, then `discr (N - Q) = ± λ^(n-d-1) d^(n-d) discr Q` with the sign below. -/\ntheorem discr_sub {N Q : F[X]} (hQ : Q.Monic) (hN : derivative N = 0)\n    (hd : (Q.natDegree : F) ≠ 0) (hlt : Q.natDegree \u003c N.natDegree)\n    (hrad : ∀ π : F[X], Irreducible π → π ∣ derivative Q → π ∣ N) :\n    discr (N - Q) =\n      (-1) ^ (N.natDegree * (N.natDegree - 1) / 2 + N.natDegree * Q.natDegree\n          + (Q.natDegree - 1) + Q.natDegree * (Q.natDegree - 1) / 2)\n        * N.leadingCoeff ^ (N.natDegree - Q.natDegree - 1)\n        * (Q.natDegree : F) ^ (N.natDegree - Q.natDegree) * discr Q :=\n  discr_sub_aux rfl rfl rfl hQ hN hd hlt hrad", "sourceLabel": "Lean statement and proof (first lines)", "search": "FunctionField.discr_sub  ParityDesert"}, {"id": "f_parity", "group": "ff", "title": "Parity theorem for N − Q", "gist": "Under those hypotheses with Q irreducible, N − Q is squarefree, and the parity of its number of irreducible factors is fixed by the degrees and by quadratic characters of −1, of N's leading coefficient and of deg Q.", "detail": "Combines the discriminant identity with Stickelberger–Swan.", "chips": ["FunctionField/ParityDesert.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "FunctionField.parity_card_factors", true], ["File", "goldbach/lean/GoldbachGaps/FunctionField/ParityDesert.lean", true]], "source": "theorem parity_card_factors (hF : ringChar F ≠ 2) {N Q : F[X]}\n    (hQ : Q.Monic) (hQi : Irreducible Q) (hN : derivative N = 0)\n    (hd : (Q.natDegree : F) ≠ 0) (hlt : Q.natDegree \u003c N.natDegree)\n    (hrad : ∀ π : F[X], Irreducible π → π ∣ derivative Q → π ∣ N) :\n    Squarefree (N - Q) ∧\n      (-1 : ℤ) ^ (N.natDegree + Multiset.card (normalizedFactors (N - Q))) =\n        quadraticChar F (-1) ^ (N.natDegree * (N.natDegree - 1) / 2 + N.natDegree * Q.natDegree\n            + (Q.natDegree - 1) + Q.natDegree * (Q.natDegree - 1) / 2)\n          * quadraticChar F N.leadingCoeff ^ (N.natDegree - Q.natDegree - 1)\n          * quadraticChar F (Q.natDegree : F) ^ (N.natDegree - Q.natDegree)\n          * (-1) ^ (Q.natDegree + 1) := by\n  have hsq := squarefree_sub hQi hN (derivative_ne_zero_of_monic hQ hd) hrad\n  refine ⟨hsq, ?_⟩\n  have h1 := stickelbergerSwan F hF (N - Q) hsq\n  have h2 := stickelbergerSwan F hF Q hQi.squarefree\n  rw [normalizedFactors_irreducible hQi, Multiset.card_singleton] at h2\n  r\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "FunctionField.parity_card_factors  ParityDesert"}, {"id": "f_notirr", "group": "ff", "title": "Corollary: N − Q is reducible", "gist": "Over a finite field of odd characteristic with a square number of elements, if N's leading coefficient is not a square, then N − Q is not irreducible.", "detail": "Parity makes the factor count even, so it cannot be one.", "chips": ["FunctionField/ParityDesert.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "FunctionField.not_irreducible_sub_of_isSquare_card", true], ["File", "goldbach/lean/GoldbachGaps/FunctionField/ParityDesert.lean", true]], "source": "/-- **Corollary.** Over a finite field of odd characteristic with a square number of elements:\nif the leading coefficient of `N` is not a square, `N - Q` is not irreducible. -/\ntheorem not_irreducible_sub_of_isSquare_card (hF : ringChar F ≠ 2)\n    (hq : IsSquare (Fintype.card F)) {N Q : F[X]}\n    (hQ : Q.Monic) (hQi : Irreducible Q) (hN : derivative N = 0)\n    (hd : (Q.natDegree : F) ≠ 0) (hlt : Q.natDegree \u003c N.natDegree)\n    (hrad : ∀ π : F[X], Irreducible π → π ∣ derivative Q → π ∣ N)\n    (hlam : ¬IsSquare N.leadingCoeff) :\n    ¬Irreducible (N - Q) :=\n  not_irreducible_sub hF hQ hQi hN hd hlt hrad\n    (by simpa using isSquare_intCast_of_isSquare_card hF hq (-1))\n    (by simpa using isSquare_intCast_of_isSquare_card hF hq (Q.natDegree : ℤ)) hlam", "sourceLabel": "Lean statement and proof (first lines)", "search": "FunctionField.not_irreducible_sub_of_isSquare_card  ParityDesert"}, {"id": "f_desert", "group": "ff", "title": "The function-field desert", "gist": "Take N = c·V^p with c a non-square and V divisible by every irreducible polynomial of degree at most J. Then N − Q is reducible for every irreducible Q of degree at most J + 1: one degree more than divisibility alone gives.", "detail": "The setting is a finite field of odd characteristic p with a square number of elements. Degrees up to J are covered by divisibility, as in the integer cover. The extra degree J + 1 is covered by parity alone, with no divisor exhibited (allowed when p does not divide it). This is the function-field counterpart of the primorial core, with a parity bonus.", "chips": ["FunctionField/ParityDesert.lean"], "f": {"status": "lean", "impact": "steer"}, "meta": [["Lean name", "FunctionField.desert", true], ["File", "goldbach/lean/GoldbachGaps/FunctionField/ParityDesert.lean", true]], "source": "/-- **The desert.** Over a finite field of odd characteristic `p` with a square number of\nelements, let `V` be monic and divisible by every irreducible polynomial of degree at most `J`\n(for instance their product), `c` a non-square, and `N = c · V^p`. Then `N - Q` is not\nirreducible for every monic irreducible `Q` of degree at most `J + 1` and less than `deg N`,\nthe degree `J + 1` being allowed when `p` does not divide it. For `deg Q ≤ J` the factor is\n`Q` itself; for `deg Q = J + 1` no factor is exhibited. -/\ntheorem desert (hF : ringChar F ≠ 2)\n    (hq : IsSquare (Fintype.card F)) {V : F[X]} {J : ℕ} {c : F} (hVm : V.Monic)\n    (hV : ∀ π : F[X], Irreducible π → π.natDegree ≤ J → π ∣ V) (hc : ¬IsSquare c)\n    {Q : F[X]} (hQ : Q.Monic) (hQi : Irreducible Q) (hQJ : Q.natDegree ≤ J + 1)\n    (hdeg : Q.natDegree ≤ J ∨ (Q.natDegree : F) ≠ 0)\n    (hlt : Q.natDegree \u003c (C c * V ^ ringChar F).natDegree) :\n    ¬Irreducible (C c * V ^ ringChar F - Q) := by\n  have : CharP F (ringChar F) := ringChar\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "FunctionField.desert  ParityDesert", "note": {"level": "steer", "text": "Shows a desert that comes from a parity obstruction rather than from covering. Whether an integer analogue exists is the question the research programme's sublinear-search work probed."}}, {"id": "f_general", "group": "ff", "title": "The desert for every row of degree J + 1", "gist": "For Q of degree d ≤ J + 1, N − Q is not irreducible if d ≤ J, or if a sign condition holds. The condition holds for every d not divisible by p and for about half of the rows of degree divisible by p.", "detail": "Removes the degree restriction of the first desert theorem. The same file also holds discr_sub_general, the discriminant identity without the condition d ≠ 0.", "chips": ["FunctionField/ParityDesert.lean"], "f": {"status": "lean", "impact": "steer"}, "meta": [["Lean name", "FunctionField.desert_general", true], ["File", "goldbach/lean/GoldbachGaps/FunctionField/ParityDesert.lean", true], ["Also covers", "FunctionField.desert_smooth", false]], "source": "/-- **The desert, every row.** `N = c · V^p` as in `desert`. For a monic irreducible `Q` of\ndegree `d ≤ J + 1` (and `d \u003c deg N`), `N - Q` is not irreducible if `d ≤ J`, or if\n`(-1)^(d + 1 + e) χ(ℓ)^(n - d) = 1` where `e`, `ℓ` are the degree and the leading coefficient of\n`Q'` and `n = deg N`. The second condition holds for every `d` not divisible by `p` and for\nabout half of the rows of a degree divisible by `p`. -/\ntheorem desert_general (hF : ringChar F ≠ 2)\n    (hq : IsSquare (Fintype.card F)) {V : F[X]} {J : ℕ} {c : F} (hVm : V.Monic)\n    (hV : ∀ π : F[X], Irreducible π → π.natDegree ≤ J → π ∣ V) (hc : ¬IsSquare c)\n    {Q : F[X]} (hQ : Q.Monic) (hQi : Irreducible Q) (hQJ : Q.natDegree ≤ J + 1)\n    (hlt : Q.natDegree \u003c (C c * V ^ ringChar F).natDegree)\n    (hsign : Q.natDegree ≤ J ∨\n      (-1 : ℤ) ^ (Q.natDegree + 1 + (derivative Q).natDegree)\n        * quadraticChar F (derivative Q).leadingCoeff\n          ^ ((C c * V ^ ringChar F).natDegree - Q.natDegree) = 1) :\n    ¬Irreducible (C\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "FunctionField.desert_general FunctionField.desert_smooth ParityDesert"}, {"id": "f_resultant", "group": "ff", "title": "Discriminant of N − Q as a resultant", "gist": "For any N with N′ = 0 and Q′ ≠ 0, disc(N − Q) = ± λ^(n−2−e)·Res(Q′, N − Q), where e = deg Q′. The discriminant, of degree 2n − 2 in the coefficients, is a resultant with a polynomial of lower degree.", "detail": "The latest Lean addition on the Lean branch (2026-11-23, 14:55 UTC). It removes the hypothesis that the roots of Q′ divide N, so the parity of N − Q is controlled for every N with zero derivative.", "chips": ["FunctionField/ParityDesert.lean", "newest"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "FunctionField.discr_sub_eq_resultant", true], ["File", "goldbach/lean/GoldbachGaps/FunctionField/ParityDesert.lean", true], ["Also covers", "FunctionField.parity_card_factors_resultant, FunctionField.parity_card_factors_congr", false]], "source": "/-- **The discriminant of `N - Q` for `N' = 0`, in general.** Over any field, with no condition\non the roots of `Q'`: if `N' = 0`, `Q' ≠ 0` and `deg Q \u003c n = deg N`, then with `λ` the leading\ncoefficient of `N` and `e = deg Q'`,\n`discr (N - Q) = (-1)^(n(n-1)/2 + n + ne) · λ^(n-2-e) · Res(Q', N - Q)`.\nSo the discriminant, a quantity of degree `2n - 2` in the coefficients, is a resultant with the\nderivative of the row, a polynomial of degree below `deg Q`. -/\ntheorem discr_sub_eq_resultant {N Q : F[X]} (hN : derivative N = 0) (hQ' : derivative Q ≠ 0)\n    (hlt : Q.natDegree \u003c N.natDegree) :\n    discr (N - Q) =\n      (-1) ^ (N.natDegree * (N.natDegree - 1) / 2 + N.natDegree\n          + N.natDegree * (derivative Q).natDegree)\n        * N.leadingCoeff ^ (N.natDegree - 2 - (derivative Q).natDegree)\n        * resultant (derivative Q) (N - Q) (derivative Q).natDegree N.natDegree :=\n  discr_sub_eq_resultant_aux rfl rfl rfl hN hQ' hlt", "sourceLabel": "Lean statement and proof (first lines)", "search": "FunctionField.discr_sub_eq_resultant FunctionField.parity_card_factors_resultant FunctionField.parity_card_factors_congr ParityDesert"}, {"id": "f_degree", "group": "ff", "title": "The desert, for J ≥ 1, in clean form", "gist": "Over a finite field of odd characteristic p with a square number of elements, N = c·V^p has no irreducible value N − Q for any irreducible Q of degree at most J + 1 (degree J + 1 allowed when p does not divide it).", "detail": "The final form: no degree conditions other than deg Q ≤ J + 1.", "chips": ["FunctionField/DesertDegree.lean"], "f": {"status": "lean", "impact": "steer"}, "meta": [["Lean name", "FunctionField.desert_of_one_le", true], ["File", "goldbach/lean/GoldbachGaps/FunctionField/DesertDegree.lean", true]], "source": "/-- **The desert, for `J ≥ 1`, with no condition on degrees other than `deg Q ≤ J + 1`.** Over a\nfinite field of odd characteristic `p` with a square number of elements, let `V` be monic and\ndivisible by every irreducible polynomial of degree at most `J` (for instance their product),\n`c` a non-square, and `N = c · V^p`. Then `N - Q` is not irreducible for every monic irreducible\n`Q` of degree at most `J + 1`, the degree `J + 1` being allowed when `p` does not divide it. -/\ntheorem desert_of_one_le (hF : ringChar F ≠ 2) (hq : IsSquare (Fintype.card F)) {V : F[X]}\n    {J : ℕ} {c : F} (hJ : 1 ≤ J) (hVm : V.Monic)\n    (hV : ∀ π : F[X], Irreducible π → π.natDegree ≤ J → π ∣ V) (hc : ¬IsSquare c)\n    {Q : F[X]} (hQ : Q.Monic) (hQi : Irreducible Q) (hQJ : Q.natDegree ≤ J + 1)\n    (hdeg : Q.natDegree ≤ J ∨ (Q.natDegree : F) ≠ 0) :\n    ¬Irreducible (C c * V ^ ringChar F - Q) := by\n  have hc0 : c ≠ 0 := fun h => hc (h ▸ IsSquare.zero)\n  exact desert hF hq hVm hV hc hQ hQi hQJ hdeg\n    (lt_of_le_\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "FunctionField.desert_of_one_le  DesertDegree"}, {"id": "g_f52", "group": "gpu", "title": "52-bit SIMD kernel: each lane is a Fermat test", "gist": "One lane of the AVX-512 kernel, run on a number below about 100 bits held in two 52-bit limbs, reports 1 exactly when 2^(n−1) ≡ 1 (mod n).", "detail": "Models the macro F52_STEP of fscan/fermat52.h line for line, including the absence of 64-bit overflow. Used by the low-end (threshold-game) scanner, not the 200-digit search.", "chips": ["Fscan/Kernel52.lean", "AVX-512 IFMA"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Fscan.F52.lane_correct", true], ["File", "goldbach/lean/GoldbachGaps/Fscan/Kernel52.lean", true]], "source": "/-- **One lane of the kernel is a base-2 Fermat test.** Let `n = n0 + n1·2^52 > 1` with\n`n0, n1 \u003c 2^52`, `16n ≤ 2^104` and `n0·ni ≡ -1 (mod 2^52)`, and let `t` be such that\n`c = ⌈(n + 103)/2^t⌉ ≤ 104`. Start from `y = startVal n (104 - c)` split into two limbs,\nrun `t` steps of `F52_STEP` fed with the bits of `B`, and apply the two final\nsubtractions. The result is `1` if and only if `2^(n-1) mod n = 1`. -/\ntheorem lane_correct {n n0 n1 ni t : ℕ} (hnd : n = n0 + n1 * W) (hn0 : n0 \u003c W) (hn1 : n1 \u003c W)\n    (hn : 16 * n ≤ 2 ^ 104) (hinv : (n0 * ni + 1) % W = 0) (hn2 : 1 \u003c n)\n    (hc : cOf n t ≤ 104) :\n    finalReduce (val (iter n0 n1 ni (beta n t) t\n        (startVal n (104 - cOf n t) % W, startVal n (104 - cOf n t) / W))) n = 1 ↔\n      2 ^ (n - 1) % n = 1 := by\n  obtain ⟨hy4, hymod⟩ := startVal_spec (n := n) (e := 104 - cOf n t) (by omega)\n  generalize startVal n (104 - cOf n t) = y at hy4 hymod ⊢\n  -- the start lane\n  have hval0 : val (y % W, y / W) = y := by\n    unfold val\n    simp only\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Fscan.F52.lane_correct  Kernel52", "note": {"level": "engine", "text": "Protects the scanner's verdicts. A bug here would drop good candidates silently; it could not forge a record, which the Lean kernel re-checks."}}, {"id": "g_f26", "group": "gpu", "title": "26-bit AVX2 kernel is a Fermat test", "gist": "The same claim for the 4-limb, 26-bit version that runs on CPUs without 52-bit multiply-add.", "detail": "Models FM_STEP of fscan/fermat26.h.", "chips": ["Fscan/Kernel26.lean", "AVX2"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Fscan.F26.lane_correct", true], ["File", "goldbach/lean/GoldbachGaps/Fscan/Kernel26.lean", true]], "source": "/-- **One lane of the 26-bit kernel is a base-2 Fermat test.** Let\n`n = n0 + n1·2^26 + n2·2^52 + n3·2^78 > 1` with all `n_j \u003c 2^26`, `16n ≤ 2^104` and\n`n0·ni ≡ -1 (mod 2^26)`, and let `t` be such that `c = ⌈(n + 103)/2^t⌉ ≤ 104`. Start from\n`y = startVal n (104 - c)` split into four limbs, run `t` steps of `FM_STEP` fed with the\nbits of `B`, and apply the two final subtractions. The result is `1` if and only if\n`2^(n-1) mod n = 1`. -/\ntheorem lane_correct {n n0 n1 n2 n3 ni t : ℕ} (hnd : n = n0 + n1 * W + n2 * W2 + n3 * W3)\n    (hn0 : n0 \u003c W) (hn1 : n1 \u003c W) (hn2 : n2 \u003c W) (hn3 : n3 \u003c W) (hn : 16 * n ≤ 2 ^ 104)\n    (hinv : (n0 * ni + 1) % W = 0) (hn' : 1 \u003c n) (hc : cOf n t ≤ 104) :\n    finalReduce (val (iter n0 n1 n2 n3 ni (beta n t) t\n        (limbs (startVal n (104 - cOf n t))))) n = 1 ↔ 2 ^ (n - 1) % n = 1 := by\n  obtain ⟨hy4, hymod⟩ := startVal_spec (n := n) (e := 104 - cOf n t) (by omega)\n  generalize startVal n (104 - cOf n t) = y at hy4 hymod ⊢\n  obtain ⟨ha, hval0⟩ := limbs_spec (\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Fscan.F26.lane_correct  Kernel26"}, {"id": "g_f30", "group": "gpu", "title": "30-bit AVX2 kernel is a Fermat test", "gist": "The same claim for the 3-limb, 30-bit version, for numbers below about 2^86.", "detail": "Models FM3_STEP, written on the branch ccr-b8c25887-i6tn9f. It reuses the schedule lemmas with a different Montgomery radix (2^90).", "chips": ["Fscan/Kernel30.lean", "AVX2"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Fscan.F30.lane_correct", true], ["File", "goldbach/lean/GoldbachGaps/Fscan/Kernel30.lean", true]], "source": "/-- **One lane of the 3-limb kernel is a base-2 Fermat test.** Let\n`n = n0 + n1·2^30 + n2·2^60 > 1` with `n0, n1 \u003c 2^30`, `n2 \u003c 2^26`, `16n ≤ 2^90` and\n`n0·ni ≡ -1 (mod 2^30)`, and let `t` be such that `c = ⌈(n + 89)/2^t⌉ ≤ 90`. Start from\n`y = startVal n (90 - c)` split into three limbs, run `t` steps of `FM3_STEP` fed with the\nbits of `B`, and apply the two final subtractions. The result is `1` if and only if\n`2^(n-1) mod n = 1`. -/\ntheorem lane_correct {n n0 n1 n2 ni t : ℕ} (hnd : n = n0 + n1 * B + n2 * B2) (hn0 : n0 \u003c B)\n    (hn1 : n1 \u003c B) (hn2 : n2 \u003c 2 ^ 26) (hn : 16 * n ≤ 2 ^ 90)\n    (hinv : (n0 * ni + 1) % B = 0) (hn' : 1 \u003c n) (hc : cOfR 90 n t ≤ 90) :\n    finalReduce (val (iter n0 n1 n2 ni (betaR 90 n t) t\n        (limbs (startVal n (90 - cOfR 90 n t))))) n = 1 ↔ 2 ^ (n - 1) % n = 1 := by\n  obtain ⟨hy4, hymod⟩ := startVal_spec (n := n) (e := 90 - cOfR 90 n t) (by omega)\n  generalize startVal n (90 - cOfR 90 n t) = y at hy4 hymod ⊢\n  obtain ⟨ha, hval0⟩ := limbs_spec (y := y) (by\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Fscan.F30.lane_correct  Kernel30"}, {"id": "g_sched", "group": "gpu", "title": "The exponent schedule never forms n − 1", "gist": "The kernels test 2^(n−1) ≡ 1 without ever building the exponent n − 1: they start from a power of two and double at the right steps. This proves the final value is 1 exactly when the Fermat test passes.", "detail": "Proved for a general Montgomery radix R = 2^Rb, so one lemma serves the 104-bit, 90-bit and 672-bit kernels.", "chips": ["Fscan/Schedule.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Fscan.Schedule.schedule_iff", true], ["File", "goldbach/lean/GoldbachGaps/Fscan/Schedule.lean", true], ["Also covers", "Fscan.Schedule.schedule_iffR", false]], "source": "/-- The test the code makes: `y t ≡ 1` exactly when `2^(n-1) ≡ 1 (mod n)`. -/\ntheorem schedule_iff {n t : ℕ} (hodd : n % 2 = 1) (hc : cOf n t ≤ 104) (y : ℕ → ℕ)\n    (h0 : y 0 ≡ 2 ^ (104 - cOf n t) [MOD n])\n    (hstep : ∀ i \u003c t, 2 ^ 104 * y (i + 1) ≡ 2 ^ beta n t (i + 1) * y i ^ 2 [MOD n]) :\n    y t ≡ 1 [MOD n] ↔ 2 ^ (n - 1) ≡ 1 [MOD n] :=\n  schedule_iffR (by norm_num) hodd hc y h0 hstep", "sourceLabel": "Lean statement and proof (first lines)", "search": "Fscan.Schedule.schedule_iff Fscan.Schedule.schedule_iffR Schedule"}, {"id": "g_class", "group": "gpu", "title": "Division-free residues are exact", "gist": "For 0 \u003c s \u003c 2^16 and x \u003c 2^16, the code's trick (multiply by ⌊65536/s⌋, subtract, one conditional fix-up) returns exactly x mod s.", "detail": "The residue step of the scanner's exact stage, which decides which leftover rows each small prime kills.", "chips": ["Fscan/ClassStage.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "Fscan.ClassStage.classOf_eq", true], ["File", "goldbach/lean/GoldbachGaps/Fscan/ClassStage.lean", true]], "source": "/-- **The class computation is exact.** For `0 \u003c s \u003c 2^16` and `x \u003c 2^16`:\n`q · s ≤ x`, the first remainder `x - q · s` is below `2s`, and the value the code stores is\n`x mod s`. -/\ntheorem classOf_eq {x s : ℕ} (hs : 0 \u003c s) (hs' : s \u003c 2 ^ 16) (hx : x \u003c 2 ^ 16) :\n    mulhi16 x (65536 / s) * s ≤ x ∧ x - mulhi16 x (65536 / s) * s \u003c 2 * s ∧\n      classOf x s = x % s := by\n  obtain ⟨hA, hB⟩ := quotient_bounds hs hx\n  unfold classOf\n  simp only\n  generalize mulhi16 x (65536 / s) = q at hA hB ⊢\n  have hmul : mullo16 q s = q * s := Nat.mod_eq_of_lt (by omega)\n  rw [hmul]\n  have hB' : x \u003c q * s + 2 * s := by\n    have : (q + 2) * s = q * s + 2 * s := by ring\n    omega\n  generalize hP : q * s = P at hA hB' ⊢\n  refine ⟨hA, by omega, ?_⟩\n  -- the first remainder\n  have hr : sub16 x P = x - P := by\n    unfold sub16\n    omega\n  rw [hr]\n  have hmod : x % s = (x - P) % s := by\n    conv_lhs => rw [show x = x - P + q * s by omega]\n    exact Nat.add_mul_mod_self_right _ _ _\n  rw [hmod]\n  by_cases hlt : x\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Fscan.ClassStage.classOf_eq  ClassStage"}, {"id": "g_montsqr", "group": "gpu", "title": "GPU Montgomery squaring is correct", "gist": "The CuPy routine mont_sqr, on 32-bit limbs, returns a value below n whose product with 2^(32L) is x² mod n.", "detail": "A coarsely-integrated operand-scanning Montgomery multiplication; the proof tracks the running value through the limb loop.", "chips": ["Gpu/MontSqr.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Gpu.montSqr_spec", true], ["File", "goldbach/lean/GoldbachGaps/Gpu/MontSqr.lean", true]], "source": "/-- **`mont_sqr` is a Montgomery squaring.** For limb arrays `x`, `n` of the same positive\nlength `L` with `x \u003c n` and `n[0] · ninv ≡ -1 (mod 2^32)`: the result is a limb array of\nlength `L`, below `n`, and `2^(32 L) · result ≡ x² (mod n)`. -/\ntheorem montSqr_spec {x n : List ℕ} {ninv : ℕ} (hx : Limbs x) (hn : Limbs n)\n    (hxl : x.length = n.length) (hL : 0 \u003c n.length)\n    (hinv : (n.headD 0 * ninv + 1) % B = 0) (hxn : val x \u003c val n) :\n    Limbs (montSqr x n ninv) ∧ (montSqr x n ninv).length = n.length ∧\n      val (montSqr x n ninv) \u003c val n ∧\n      (B ^ n.length * val (montSqr x n ninv)) % val n = (val x * val x) % val n := by\n  obtain ⟨r1, r2, r3, M, r4⟩ := sqrFold_spec hx hn hxl hL hinv hxn x\n    (List.replicate n.length 0, 0) hx (Limbs_replicate_zero _) (by simp)\n    (by simp only [val_replicate_zero]; omega)\n  simp only [val_replicate_zero, mul_zero, add_zero, zero_add] at r4\n  rw [hxl] at r4\n  have hT : val (sqrLoop x n ninv).1 + B ^ (sqrLoop x n ninv).1.length * (sqrLoop x n nin\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Gpu.montSqr_spec  MontSqr"}, {"id": "g_fermat2", "group": "gpu", "title": "32-bit GPU kernel is a Fermat test", "gist": "One thread of the first GPU kernel (candidate n = cq + k·M on 32-bit limbs) reports 1 exactly when 2^(n−1) ≡ 1 (mod n).", "detail": "Models the CuPy kernel of phd/campaign3_gpu/gpu_fermat.py including carry chains, the Newton inverse and the bit loop. Not modelled: memory, thread indexing and __clz.", "chips": ["Gpu/Fermat.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Gpu.fermat2_correct", true], ["File", "goldbach/lean/GoldbachGaps/Gpu/Fermat.lean", true]], "source": "/-- **One thread of the GPU kernel is a base-2 Fermat test.** Let `cq` and `M` be arrays of\n`L ≥ 1` limbs below `2^32`, `k \u003c 2^32`, and suppose `n = cq + k·M` is odd, greater than 1 and\nbelow `2^(32 L)`. Then the flag written by `fermat2` is `1` if and only if\n`2^(n-1) mod n = 1`. -/\ntheorem fermat2_correct {cq Mv : List ℕ} {k : ℕ} (hcq : Limbs cq) (hM : Limbs Mv)\n    (hlen : Mv.length = cq.length) (hL : 0 \u003c cq.length) (hk : k \u003c B)\n    (hfit : val cq + k * val Mv \u003c B ^ cq.length) (hodd : (val cq + k * val Mv) % 2 = 1)\n    (hgt : 1 \u003c val cq + k * val Mv) :\n    fermat2 cq Mv k = true ↔ 2 ^ (val cq + k * val Mv - 1) % (val cq + k * val Mv) = 1 := by\n  -- the limbs of n\n  obtain ⟨r1, r2, r3, r4⟩ := row_spec hk Mv cq 0 hM hcq hlen (by norm_num)\n  have hnl : (row k Mv cq 0).1.length = cq.length := r2.trans hlen\n  have hnv : val (row k Mv cq 0).1 = val cq + k * val Mv := by\n    have hlt := val_lt r1\n    rw [hnl] at hlt\n    rw [hlen, add_zero] at r4\n    have hc : (row k Mv cq 0).2 = 0 := by\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Gpu.fermat2_correct  Fermat"}, {"id": "g_conv", "group": "gpu", "title": "Column sums of a squaring", "gist": "Pure algebra: the k-th column of x·x is twice the products with i \u003c k − i, plus the square of the middle limb when k is even.", "detail": "Used to prove that the 28-bit kernel's column-by-column squaring computes the right number.", "chips": ["Gpu28/Conv.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "Gpu28.conv_self", true], ["File", "goldbach/lean/GoldbachGaps/Gpu28/Conv.lean", true]], "source": "/-- **A squaring collects its column**: twice the products with `i \u003c k - i`, plus the square\nof the middle limb when `k` is even. -/\ntheorem conv_self (x : ℕ → ℕ) (L k : ℕ) :\n    conv x x L k =\n      (∑ i ∈ range (k + 1), if i \u003c k - i ∧ k - i \u003c L then 2 * x i * x (k - i) else 0) +\n        (if k % 2 = 0 ∧ k / 2 \u003c L then x (k / 2) * x (k / 2) else 0) := by\n  set g : ℕ → ℕ := fun i => if i \u003c L ∧ k - i \u003c L then x i * x (k - i) else 0 with hg\n  have hsym : ∀ i ∈ range (k + 1), g (k - i) = g i := by\n    intro i hi\n    have hik : i ≤ k := by\n      have := Finset.mem_range.mp hi\n      omega\n    have e : k - (k - i) = i := by omega\n    simp only [hg, e]\n    by_cases h1 : i \u003c L \u003c;> by_cases h2 : k - i \u003c L \u003c;> simp [h1, h2, mul_comm]\n  -- the three parts\n  have hsplit : ∀ i, g i = (if i \u003c k - i then g i else 0) + (if i = k - i then g i else 0) +\n      (if k - i \u003c i then g i else 0) := by\n    intro i\n    split_ifs \u003c;> first | (exfalso; omega) | simp\n  have h3 : (∑ i ∈ range (k + 1), if k - i \u003c i t\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Gpu28.conv_self  Conv"}, {"id": "g_step28", "group": "gpu", "title": "One step of the 28-bit kernel", "gist": "One Montgomery step of fermat28 (24 limbs of 28 bits, squaring by columns, then multiply by 2^b) keeps limbs below 2^28, satisfies R·Y = 2^b(X² + μN), and Y \u003c 4N.", "detail": "The proof follows the code generator's lists of products per column, so the variants with two or four accumulators are covered as well. No accumulator overflows.", "chips": ["Gpu28/Step.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Gpu28.step_spec", true], ["File", "goldbach/lean/GoldbachGaps/Gpu28/Step.lean", true]], "source": "/-- **One step of `fermat28`, plain limbs.** Under the hypotheses of `pre_spec` and `b ≤ 1`,\nthe limbs written by `fm28_step` (carry chain of `× 2^b`) are below `2^28`, their value `Y`\nsatisfies `R · Y = 2^b (X² + μ N)` for some `μ \u003c R`, and `Y \u003c 4N`. -/\ntheorem step_spec {x n : ℕ → ℕ} {np b L : ℕ} (hL1 : 1 ≤ L) (hL : L ≤ 24) (hx : ∀ i, x i \u003c 2 * B)\n    (hn : ∀ i, n i \u003c B) (hinv : (n 0 * np + 1) % B = 0) (hX : V B L x \u003c 4 * V B L n)\n    (hN : 16 * V B L n \u003c B ^ L) (hb : b ≤ 1) :\n    (∀ i, stepF x n np b L i \u003c B) ∧\n      (∃ μ, μ \u003c B ^ L ∧\n        B ^ L * V B L (stepF x n np b L) = 2 ^ b * (V B L x * V B L x + μ * V B L n)) ∧\n      V B L (stepF x n np b L) \u003c 4 * V B L n := by\n  obtain ⟨hpre_lt, ⟨μ, hμ, hY⟩, hYlt⟩ := pre_spec hL1 hL hx hn hinv hX hN\n  obtain ⟨hcy, hch⟩ := chain_spec hpre_lt hb L\n  have hstep : stepF x n np b L = chainLimb (preLimbs x n np L) b := rfl\n  rw [hstep]\n  have hVlt := V_lt (Bs := B) (f := chainLimb (preLimbs x n np L) b) L fun i _ => by\n    unfold chainLimb\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Gpu28.step_spec  Step"}, {"id": "g_fermat28", "group": "gpu", "title": "200-digit GPU kernel is a Fermat test", "gist": "One lane of fermat28, for an odd n of 642 to 668 bits in 24 limbs of 28 bits, reports 1 exactly when 2^(n−1) ≡ 1 (mod n).", "detail": "This is the kernel the fleet runs for the 200-digit search. It assumes the set-up values are correct and that the PTX multiply-add instructions are exact; scripts/gpu28_check compares the model against CPU arithmetic. The same is proved for the redundant-limb version (fermat28r_correct) that the fleet has run since 2026-11-22. The final comparison is flag_iff.", "chips": ["Gpu28/Kernel.lean", "CUDA"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Gpu28.fermat28_correct", true], ["File", "goldbach/lean/GoldbachGaps/Gpu28/Kernel.lean", true], ["Also covers", "Gpu28.flag_iff", false]], "source": "/-- **`fermat28` as run** (24 limbs, `R = 2^672`): for an odd `n` with limbs below `2^28`,\n`t = bits(n) - 6` between 633 and 662 (the kernel accepts bit lengths 642 to 668),\n`np = fm28_inv_neg28(lo)` where `lo` is the low 32-bit word of `n` (so `lo mod 2^28 = n[0]`),\nstart value `2^(672 - c)` and the schedule's bits, the lane reports `1` exactly when\n`2^(n-1) ≡ 1 (mod n)`. -/\ntheorem fermat28_correct {n : ℕ → ℕ} {t lo : ℕ} {b : ℕ → ℕ} (hn : ∀ i, n i \u003c B)\n    (hodd : V B 24 n % 2 = 1) (ht : 633 ≤ t) (ht' : t ≤ 662) (hlo : 2 ^ (t + 5) ≤ V B 24 n)\n    (hhi : V B 24 n \u003c 2 ^ (t + 6)) (hword : lo % B = n 0)\n    (hbits : ∀ s \u003c t, b s = betaR 672 (V B 24 n) t (s + 1)) :\n    flag (lane (startLimbs (672 - cOfR 672 (V B 24 n) t)) n (invNeg28 lo) b 24 t) n 24 = true ↔\n      2 ^ (V B 24 n - 1) ≡ 1 [MOD V B 24 n] := by\n  have h672 : (672 : ℕ) ≤ 2 ^ t :=\n    le_trans (by norm_num : (672 : ℕ) ≤ 2 ^ 10) (Nat.pow_le_pow_right (by norm_num) (by omega))\n  obtain ⟨hc33, hc65⟩ := c_bounds28 (Rb := 672) (by\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Gpu28.fermat28_correct Gpu28.flag_iff Kernel", "note": {"level": "engine", "text": "The only theorem that covers the code actually used to find 200-digit records. The records themselves do not depend on it."}}, {"id": "g_fermat28r", "group": "gpu", "title": "Redundant-limb 200-digit kernel is a Fermat test", "gist": "The same statement for the faster variant that keeps limbs below 2^29 and normalises with one carry chain at the end.", "detail": "Covers fermat28_step_s1r.cuh, _r.cuh and _s1rw.cuh, the kernels in use since 2026-11-22.", "chips": ["Gpu28/Kernel.lean", "CUDA"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Gpu28.fermat28r_correct", true], ["File", "goldbach/lean/GoldbachGaps/Gpu28/Kernel.lean", true]], "source": "/-- **The redundant `fermat28` as run** (the kernel with `fermat28_step_s1r.cuh`, `_r.cuh` or\n`_s1rw.cuh`): same statement as `fermat28_correct`. -/\ntheorem fermat28r_correct {n : ℕ → ℕ} {t lo : ℕ} {b : ℕ → ℕ} (hn : ∀ i, n i \u003c B)\n    (hodd : V B 24 n % 2 = 1) (ht : 633 ≤ t) (ht' : t ≤ 662) (hlo : 2 ^ (t + 5) ≤ V B 24 n)\n    (hhi : V B 24 n \u003c 2 ^ (t + 6)) (hword : lo % B = n 0)\n    (hbits : ∀ s \u003c t, b s = betaR 672 (V B 24 n) t (s + 1)) :\n    flag (normLimbs (laneR (startLimbs (672 - cOfR 672 (V B 24 n) t)) n (invNeg28 lo) b 24 t))\n        n 24 = true ↔\n      2 ^ (V B 24 n - 1) ≡ 1 [MOD V B 24 n] := by\n  have h672 : (672 : ℕ) ≤ 2 ^ t :=\n    le_trans (by norm_num : (672 : ℕ) ≤ 2 ^ 10) (Nat.pow_le_pow_right (by norm_num) (by omega))\n  obtain ⟨hc33, hc65⟩ := c_bounds28 (Rb := 672) (by norm_num) h672 hlo hhi\n  have hn0 : n 0 % 2 = 1 := by rw [← V_mod_two n 23]; exact hodd\n  have hlo2 : lo % 2 = 1 := by omega\n  have hinv : (n 0 * invNeg28 lo + 1) % B = 0 := by\n    have h1 := invNeg28_spec hl\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Gpu28.fermat28r_correct  Kernel"}, {"id": "e_records", "group": "eng", "title": "Record board: three games", "gist": "The project plays three games: the height game (largest g, N unbounded), the threshold game T(Q) (smallest N with g above Q) and the budget game R(X) (largest g with N below X). Your question is the budget game.", "detail": "Board at the research branch's last update (2026-11-21): height 10,000,141 at a 61,329-digit N; threshold, a 150-digit N with g = 104,527; budget 119,419. The GPU fleet raised the budget record to 158,209 by 2026-11-23. Exhaustive search shows g(N) ≤ 9,781 for every even N up to 4×10^18, so every constructive record is far beyond it. A record must say which bound it meets: R(10^199) and R(10^200) are different games. The research branch named 158,209 only after review (commit 02564fb); the fleet's hits file still showed 157,837 then.", "chips": ["Games 1–3"], "f": {"status": "comp", "impact": "record"}, "meta": [["Definition", "goldbach/thesis/ch1_introduction.tex (Definition of the games)", false], ["Board", "goldbach/phd/RESEARCH_LOG.md (record board 2026-11-21)", false], ["Exhaustive range", "goldbach/record_holders.txt", false]], "search": "height threshold budget game board", "note": {"level": "record", "text": "Everything on this map is in service of one number: the largest g(N) for N below 10^200."}}, {"id": "e_fleet200", "group": "eng", "title": "The 200-digit fleet campaign (budget game)", "gist": "GPUs scan arithmetic progressions N₀ + t·M built on a cover of 88–89 odd primes. The budget record rose 119,419 → 125,269 → 133,981 → 146,191 → 157,837 → 158,209 between 2026-11-22 and 2026-11-23.", "detail": "At 02:40 UTC on 2026-11-23 about 10 fleet-days of compute were left, at 29 million effective full-weight members per second. The fleet reports near-misses: the first probable-prime row of a tested member is g(N), so a design aimed at 170,000 produced the 158,209 record. The records live on the fleet's branch; the Lean library re-certifies them.", "chips": ["Game 3", "GPU fleet"], "f": {"status": "comp", "impact": "record"}, "meta": [["Status and prices", "goldbach/fscan/cover/brainstorm/README.md (The remaining budget)", false], ["Portfolio", "goldbach/fscan/cover/brainstorm/portfolio_budget.txt", false]], "search": "fleet 158209 157837 146191 133981 near-miss", "note": {"level": "record", "text": "This is the engine that produced the record. The Lean file only certifies its output."}}, {"id": "e_height", "group": "eng", "title": "Height game: 1.2 million to 10 million, no ECPP", "gist": "Letting the Chinese remainder theorem make N − g carry its own one-exponentiation primality proof, together with complete covers, took the height record from 1,157,341 to 10,000,141 in two days.", "detail": "Records: 1,200,109 (11,263 digits, certified twice for two different N), 2,000,269 (15,595 digits), 5,000,251 (33,938 digits) and 10,000,141 (61,329 digits, a 9,095-class cover, about two hours on a Colab A100). The next rung, g above 16,045,848, would beat the largest known prime gap; it is costed at about 13 days on 4 cores and was not done.", "chips": ["Game 1", "2026-11-21"], "f": {"status": "comp", "impact": "record"}, "meta": [["Records", "goldbach/proth/README.md", false], ["Log", "goldbach/phd/RESEARCH_LOG.md (Campaign G)", false]], "search": "height 10000141 5000251 2000269 1200109", "note": {"level": "record", "text": "A different game from yours (N unbounded), but it shows what removing the certification wall bought."}}, {"id": "e_megagap", "group": "eng", "title": "The 2,692-digit megagap: g = 1,134,871", "gist": "A 2,692-digit N whose least Goldbach summand 1,134,871 exceeds the largest certified prime gap (1,113,106), while the prime gap around N is only 8,970.", "detail": "Of the 88,239 primes below g, one is excluded by parity, 85,476 by a cover divisor, 895 by trial division and 1,867 by failed Fermat tests; N − g has a 253-step ECPP certificate. Found on 2026-07-21 with a search exponent of 6.56.", "chips": ["2026-07-21"], "f": {"status": "comp", "impact": "record"}, "meta": [["Record", "goldbach/records/megagap_2692digit_g1134871/", false], ["Write-up", "goldbach/RESULTS.md (Prime-gap domination record)", false]], "search": "megagap 1134871 prime gap", "note": {"level": "record", "text": "Shows a Goldbach desert need not be a prime gap: it only has to make the sparse set N − q composite."}}, {"id": "e_threshold", "group": "eng", "title": "Threshold game: from 186 down to 150 digits, and the low end", "gist": "The smallest known N with g above 100,000 fell from 186 digits to 179 to 150 (g = 104,527, found by a GPU engine). At the low end, a 23-digit N (3.06×10^22) has g above 10,000, found by the fscan scanner.", "detail": "The 150-digit jump came from throughput, not new mathematics: the CUDA engine was about 430 times the 4-core pipeline, and ln 430 = 6.1 nats matches the gap in the cost exponent. Five 23-digit numbers with g above 10,000 appeared where 0.78 were expected, an unexplained 0.13% event.", "chips": ["Game 2"], "f": {"status": "comp", "impact": "record"}, "meta": [["Records", "goldbach/RESULTS.md", false], ["Low end", "goldbach/fscan/README.md (Production runs)", false]], "search": "threshold 104527 150 digits 23 digit"}, {"id": "e_selective", "group": "eng", "title": "Selective testing: test only the emptiest members (the 3% rule)", "gist": "After sieving, count the rows each candidate still has alive and run the expensive Fermat tests only on the few percent with the fewest. This gives roughly a 3× net speed-up.", "detail": "A candidate with k rows left succeeds with probability about (1 − p)^k, so a small fraction holds a large share of the successes: the fleet's 3% rule holds 15.6%, worth 2.0 nats. Sieving deeper (to 10^8 on the newest cards) adds about 28% more expected successes per second.", "chips": ["tscan", "fleet"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Scanner", "goldbach/tscan/README.md", false], ["Rule", "goldbach/fscan/cover/README.md (Which members to test)", false]], "search": "selective skip-frac 3% rule sieve depth", "note": {"level": "steer", "text": "The cheapest measured speed-up in the programme, and a constant factor: it does not change the exponent."}}, {"id": "e_gpu", "group": "eng", "title": "GPU Fermat engines", "gist": "CUDA code sieves a block of candidates and runs a Montgomery base-2 Fermat test on each surviving row, around 20 million tests per second on a modern card. A separate engine screens the 60,000-digit candidates of the height game.", "detail": "Validated bit for bit against Python and gmpy2; every GPU hit is re-proved on a CPU, so a GPU error can waste time but not forge a record. Throughput history: 2.5M tests per second on a T4, 8.5M on an A100, 22.9M on an RTX PRO 6000 with 28-bit limbs.", "chips": ["CUDA", "Colab fleet"], "f": {"status": "comp", "impact": "engine"}, "meta": [["200-digit engine", "goldbach/gpu/engine150.py, fleet.py", false], ["Height-game engine", "goldbach/proth/gpu_screen.py", false], ["28-bit kernel", "goldbach/fermat661/cuda/", false]], "search": "gpu cuda montgomery fermat kernel", "note": {"level": "engine", "text": "The Lean library proves three of these kernels compute exactly the Fermat test."}}, {"id": "e_fscan", "group": "eng", "title": "fscan and tscan: CPU scanners for the low end", "gist": "tscan sieves blocks of candidates and tests those with few rows left. fscan scores 64 candidates per vector instruction and Fermat-tests the best 0.3%, 24 at a time (AVX-512), about 4.5 times tscan per core-second.", "detail": "The gain is a constant factor. Searching over more than 13 fixed primes, or sharing the sieve between neighbouring numbers, did not help. The 52-, 26- and 30-bit kernels and the residue step are the ones Lean proves correct.", "chips": ["AVX-512", "AVX2"], "f": {"status": "comp", "impact": "engine"}, "meta": [["Scanner", "goldbach/fscan/README.md", false], ["Kernel note", "goldbach/fscan/FERMAT26_STEP.md", false]], "search": "fscan tscan avx ifma scanner", "note": {"level": "engine", "text": "Used for the threshold game at 20–60 digits; not part of the 200-digit record apart from the 'score first' idea."}}, {"id": "e_cover_opt", "group": "eng", "title": "Cover design: greedy, annealing, parallel tempering", "gist": "Choosing a residue class for each modulus is a set-cover-like design problem. For 200 digits, a parallel-tempering sampler on the 89 odd primes 3..463 finds covers leaving 1,248 rows at Q = 170,000 and 1,609 rows at the 10% target 213,070.", "detail": "Greedy gives 867 rows at Q = 122,000; tempering finds 851, and the Lean session's independent sampler 850. One more modulus buys about 14 rows for 5.3 digits of modulus; one extra row costs 2.4% of success probability per member. There is no closed formula for the optimum and no proof of a floor: every claim of optimality is empirical. Evolved (AlphaEvolve) cover optimisers were not competitive.", "chips": ["cover.py", "ptcover.c"], "f": {"status": "comp", "impact": "engine"}, "meta": [["Method and tables", "goldbach/fscan/cover/README.md", false], ["Greedy and annealing", "goldbach/cover.py, anneal.py", false]], "search": "cover tempering greedy anneal 89 moduli 1609 rows", "note": {"level": "engine", "text": "Going from 88 to 89 moduli gave 1.27 times the success rate: one of the few places where mathematics, not compute, moved the record."}}, {"id": "e_cap200", "group": "eng", "title": "The Lean session's cover experiments: 850 rows at Q = 122,000", "gist": "The Lean session wrote its own replica-exchange sampler over residue vectors and counted vectors by rows left. At Q = 122,000 on the campaign's 88 moduli it found a cover leaving 850 rows (the campaign's greedy cover: 867), plus bulk lists of near-best vectors for the fleet.", "detail": "Random vectors leave 1,376.9 rows on average (standard deviation 20.2); the greedy cover is 25 deviations below. There are e^436 vectors in all, e^43 with at most 867 rows, and the count reaches one near 850. The best cover costs about 0.21 nats per 1,000 in Q. Beyond the design target a further prime stays alive with probability 0.12, so surviving past the design value by luck is nearly as cheap as designing for it. Adding 443, 449 and 457 would give 831 rows but leave only about 60 members per vector.", "chips": ["Lean branch", "tempering"], "f": {"status": "comp", "impact": "engine"}, "meta": [["Code and data", "goldbach/phd/cap200/ (tempering.py, dos.py, neighbours.py, mkspecs.py)", false], ["Branch", "ccr-36ca7b46-8twf14", false]], "search": "cap200 tempering density of states 850 rows neighbours pool lean session", "note": {"level": "engine", "text": "Its agreement with the research session's own sampler (851) is the evidence that the plateau near 850 is the optimum for 88 moduli."}}, {"id": "e_c15907", "group": "eng", "title": "Complete covers: 15,907 on 89 primes, 16,747 on 92", "gist": "Cover every prime below Q with no leftover row, so no luck is needed. On the 89 odd primes up to 463 the best found reaches 15,907 (1,853 primes below it); on 91 and 92 primes, 16,381 and 16,747.", "detail": "At 15,950 and 16,000 the best covers on these primes leave one row, so where complete covers stop is unknown. The last prime beyond the Chinese-remainder line is bought by enumeration, as the line's sharpness predicts.", "chips": ["sublinear/"], "f": {"status": "comp", "impact": "engine"}, "meta": [["Covers", "goldbach/sublinear/complete_cover_15907.txt, complete_cover_16381_91primes.txt, complete_cover_16747_92primes.txt", false], ["Write-up", "goldbach/sublinear/README.md (At 200 digits, without luck)", false]], "search": "complete cover 15907 16747 92 primes", "note": {"level": "engine", "text": "0.7% of the ceiling, against 7.4% found by search: what can be constructed is far behind what search finds."}}, {"id": "e_verify", "group": "eng", "title": "Verification: three independent legs", "gist": "Every height record passes three separately written checkers (a standard-library Python verifier, a second one that rebuilds N by product-tree CRT, and PARI's own N − 1 certificate plus a brute-force scan). A mutation test rejects all 11 corrupted copies.", "detail": "Older records carry a PARI elliptic-curve certificate re-checked by an independent checker plus a witness for every prime below g. A fail-open flaw was found on 2026-11-22 (gp carried on after an error); no committed log is affected and the packaging script now stops on error.", "chips": ["verify.py", "PARI"], "f": {"status": "comp", "impact": "engine"}, "meta": [["Stack", "goldbach/proth/README.md (verification stack)", false], ["Cross-reviews", "goldbach/phd/crossreview_*.md", false]], "search": "verify verification pari ecpp tamper", "note": {"level": "engine", "text": "No record rests on the scanner that found it. The Lean library adds a machine-checked fourth leg for the budget-game records."}}, {"id": "m_density", "group": "res", "title": "Cost model: E = |U| · boost / ln N", "gist": "A candidate in a progression succeeds when every one of the |U| rows the cover misses is composite. Each is prime with probability about boost/ln N, so about e^E candidates are needed per success, with E = |U|·boost/ln N and boost = 2·∏ r/(r − 1).", "detail": "Checked against measurements to about 0.1 nats: toy 62 digits 13.52 predicted against 13.57 measured, the 197-digit record 18.2 against 18.2, the 2,692-digit record 6.6 against 6.56. Campaign 3's logged value ran 0.2–0.4 nats above theory, which its log flagged as ‘watching’. The model rests on independence of the rows (hypothesis H1), which is an assumption, not a theorem.", "chips": ["nats", "rests on H1"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Definition", "goldbach/cover.py docstring", false], ["Calibration", "goldbach/phd/RESEARCH_LOG.md (close-out O2)", false], ["Thesis", "goldbach/thesis/ch3_engineering.tex (failure exponent)", false]], "search": "failure exponent E boost nats model", "note": {"level": "steer", "text": "Every price in the programme comes from this one formula. Its unit is the nat: a factor of e in the number of candidates."}}, {"id": "m_ceiling", "group": "res", "title": "Heuristic ceiling: about 2.13 million at 200 digits", "gist": "The Hardy–Littlewood prime-tuple heuristic, with no fitted constant, predicts the largest g(N) to expect below N: 9,570 at 19 digits, 465,350 at 100 digits, 2,130,704 at 200 digits.", "detail": "Checked on 600 million random even N near 10^18, agreeing within 0.5%. The campaign's yardsticks come from it: 7.41% is 157,837, and the 10% target is 213,070. An earlier fitted constant (C ≈ 1.4) was replaced by the computed one, which lowered every closeness figure; the ratio to ln²N · ln ln N grows from 1.40 to 1.64.", "chips": ["2,130,704"], "f": {"status": "heur", "impact": "steer"}, "meta": [["Model", "goldbach/ceiling_model.py", false], ["Write-up", "goldbach/RESULTS.md (The 100% line, computed instead of fitted)", false]], "search": "ceiling hardy littlewood 2130704 10% 213070", "note": {"level": "steer", "text": "The 10% target is 10% of a model, not of a theorem. The standing record 158,209 is 7.43% of it."}}, {"id": "m_price", "group": "res", "title": "Price list: what raising the target costs", "gist": "At 200 digits one expected success costs 0.8 card-days (0.2 fleet-days) at a design target of 150,000, 7.7 card-days at 160,000, 436 at 180,000, 26,627 at 200,000, and 400,099 card-days (about 1,100 card-years) at 213,070.", "detail": "A success lands about 4,100 above the design target, and every +10,000 in g costs a factor of 8 to 9. For a fixed fraction of the ceiling the exponent grows with the number of digits: 20% needs E near 80.", "chips": ["fleet-days"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Prices", "goldbach/fscan/cover/brainstorm/price_list.txt", false], ["Rung ladder", "goldbach/phd/wp8_beyond_covering.md §0", false]], "search": "price list cost rung ladder card-days", "note": {"level": "steer", "text": "Why ‘a bit more’ is expensive: the cost is exponential in g."}}, {"id": "m_portfolio", "group": "res", "title": "What the remaining budget buys", "gist": "From a record of 157,837 with about 10 fleet-days left, the expected final record is about 169,000–172,500 (7.9–8.1% of the ceiling). Aiming straight at 213,070 would need about 50,749 fleet-days, some 5,600 times the remaining budget.", "detail": "The best design for a limited budget aims below the target: a cover built for 172,500 beats one built for 213,070 by eight points. A week of the fleet is worth about 167,000, a month 174,000, a year 186,000 (model extrapolations).", "chips": ["10% target"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Model", "goldbach/fscan/cover/brainstorm/portfolio_budget.txt, reach_target.txt", false], ["Summary", "goldbach/fscan/cover/brainstorm/README.md (The remaining budget)", false]], "search": "portfolio remaining budget fleet-days expected record", "note": {"level": "steer", "text": "The honest answer to ‘can we reach 10%’: not by search alone with the compute in hand. The standing record 158,209 sits below the expected final value, so more near-misses are likely."}}, {"id": "m_budgets", "group": "res", "title": "Two budgets: nats of modulus and nats of work", "gist": "A prime used to build N costs ln r of the 460.5 nats available below 10^200, whether it fixes one class or many. Information beyond that can only be collected by enumerating candidates and counting rows: one nat of work per nat of information.", "detail": "The campaign's allocation of moduli is optimal to about 0.2 nats. Allowing k classes instead of one gains only 1–2.8 nats at 100–150 digits, and the classic cover is the unique design that is free to enumerate. An oracle ignoring the size limit would reach E = 25.75 with 200 moduli, against 39.2 for the 88 in use.", "chips": ["460.5 nats"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Oracle floor", "goldbach/fscan/cover/brainstorm/oracle_213070.txt", false], ["Frontier", "goldbach/FRONTIER.md (Results 1–3)", false]], "search": "budget oracle set-valued realizable enumerability", "note": {"level": "steer", "text": "Sizes the prize beyond the modulus budget at about 10 nats. That is where the sublinear search question comes from."}}, {"id": "m_h1", "group": "res", "title": "H1: the leftover rows are independent", "gist": "Given all the divisibility information, the primality of distinct leftover rows is independent, with Mertens-adjusted probabilities (a Hardy–Littlewood style local model).", "detail": "Not implied by GRH: it is a k-tuple statement. Support: the cost model matches measurements to about 0.1 nats over 1.2×10^9 candidates. But campaign 3 ran 0.2–0.4 nats above theory, and a first-moment match does not obviously constrain the joint probability that all rows are composite.", "chips": ["hypothesis"], "f": {"status": "heur", "impact": "steer"}, "meta": [["Statement", "goldbach/phd/wp9/wp9_closure_theorem.md §2–§3, §7", false]], "search": "H1 independence hardy-littlewood hypothesis", "note": {"level": "steer", "text": "Every cost forecast and the closure theorem assume it."}}, {"id": "m_h2", "group": "res", "title": "H2: no compositeness test cheaper than one exponentiation", "gist": "Does a randomized algorithm exist that decides compositeness of a random rough 660-bit number in time below one modular exponentiation? The closure theorem assumes not.", "detail": "No lower bound is known in any realistic model. A detector with cost c and recall r would speed up the Fermat-first pipeline by 1/(c + (1 − r)): c = 0.1 and r = 0.9 would give 5×. More than 95% of engine time is base-2 Fermat tests, about 17 per candidate.", "chips": ["open problem"], "f": {"status": "open", "impact": "steer"}, "meta": [["Note", "goldbach/phd/wp9/h2_open_problem.md", false]], "search": "H2 compositeness detector modexp open problem", "note": {"level": "steer", "text": "The one identified escape from the cost floor of the search. The sublinear programme's rung 5 is its integer counterpart."}}, {"id": "m_closure", "group": "res", "title": "Divisor-Paradigm Closure Theorem", "gist": "No construction whose compositeness certificates are planted divisor identities (congruences, polynomial values, exponential families, multivariate forms, norm forms, cyclotomic values, compositions) beats the covering frontier, assuming H1 and H2.", "detail": "A draft-rigour theorem on a grammar of seven schema families the authors chose. Zero passes among 13,661 hand-enumerated instances and 41 machine-evolved candidates; the best was 53 times too expensive. Mechanisms outside the grammar are not excluded. The thesis itself says ‘at the level of rigour of a well-supported research programme’.", "chips": ["WP9", "conditional on H1, H2"], "f": {"status": "paper", "impact": "bound"}, "meta": [["Theorem", "goldbach/phd/wp9/wp9_closure_theorem.md", false], ["Thesis", "goldbach/thesis/ch6_closure.tex", false]], "search": "closure theorem divisor paradigm door 3 schema", "note": {"level": "bound", "text": "Why the programme concludes that the only levers left are the rounding gap (0–2.6 nats of mathematics) and compute."}}, {"id": "m_lemma2", "group": "res", "title": "Lemma: a shared divisor divides q₁ − q₂", "gist": "If d divides both N − q₁ and N − q₂ for two primes below Q, then d divides q₁ − q₂, so d is itself below Q.", "detail": "All dependence between rows therefore runs through primes below Q, which the cover fixes and the sieve harvests. This is a deterministic fact (Proposition 2a); the conditional half (2b) needs H1.", "chips": ["Lemma 2"], "f": {"status": "paper", "impact": "bound"}, "meta": [["Proof", "goldbach/phd/wp9/wp9_closure_theorem.md §3 Lemma 2", false], ["First statement", "goldbach/phd/wp8_beyond_covering.md §6", false]], "search": "lemma shared divisor subtraction q1 q2", "note": {"level": "bound", "text": "Proved on paper by the research session and, with the same content, in Lean as lt_of_dvd_two_rows. Neither document cites the other."}}, {"id": "m_entropy", "group": "res", "title": "Planted certificates cost at least covering's marginal price", "gist": "Whatever the family, certifying one more row N − q composite costs at least what a covering congruence would. Congruence classes cost ln d, polynomial identities certify at most √Q rows, exponential families run out of supply, multivariate forms cluster only up to 13 rows.", "detail": "Closure family by family: polynomial values of degree 2 or more, at most 349 rows at Q = 122,000; exponential families, 1,048 rows would cost 1,151 nats against a budget of 460; multivariate forms with fewer variables than degree, at most 13 rows against about 18,000 needed; window-dense families, isolation and orbit arguments; compositions, empty at 10^200. Several are first-moment arguments at draft rigour.", "chips": ["Lemma 1", "WP9"], "f": {"status": "paper", "impact": "bound"}, "meta": [["Proofs", "goldbach/phd/wp9/wp9_closure_theorem.md §3, §8–§13", false]], "search": "entropy accounting expfamily polyimage multipoly cluster isolation", "note": {"level": "bound", "text": "The quantitative core of why the ‘third mechanism’ does not exist inside the grammar."}}, {"id": "m_falsify", "group": "res", "title": "Falsification engine: 13,661 instances, zero passes", "gist": "An engine that scores any proposed certificate scheme against covering's price was calibrated on hand numbers, swept over 13,661 schema instances, then attacked by an evolutionary search driven by a language model. No scheme passed.", "detail": "The first evolved candidates exploited a hole in the referee: offsets were billed only against the 867 leftover primes, so 10,416 offsets cost 22,900 nats against a budget of 460, a 50-fold overdraft. After the fix the best fitness is 53 times too expensive. The lesson recorded: adversarial search is most useful as referee hardening.", "chips": ["AlphaEvolve"], "f": {"status": "comp", "impact": "bound"}, "meta": [["Engine", "goldbach/phd/wp9/engine/", false], ["Incident", "goldbach/phd/wp9/wp9_closure_theorem.md §12", false]], "search": "falsification engine referee alphaevolve overdraft", "note": {"level": "bound", "text": "Shows the closure benchmark was hardened by an adversary before it was trusted."}}, {"id": "m_wp7", "group": "res", "title": "Five probes of non-covering mechanisms all end", "gist": "Prime-power moduli kill nothing new. Polynomial identities N = mᵏ − c kill at most O(√Q) rows. Exponent families and norm forms reduce to covering. Any leftover bias in the leftover rows is worth at most 0.1 nats.", "detail": "Predeclared gates; all five terminated. The research states three conditions any real mechanism must meet: certify far more than √Q rows, cost o(ln r) design entropy per row, and stay invisible in bulk statistics. Covering manages about 4,400 offsets per nat at r = 3, falling to 0.4 at r ≈ 1,200.", "chips": ["WP7"], "f": {"status": "comp", "impact": "bound"}, "meta": [["Probes", "goldbach/phd/wp7_probes.md", false]], "search": "wp7 probes prime power polynomial identity norm form bias", "note": {"level": "bound", "text": "Lean proves the exact statements behind probes P1 and P2 (prime moduli suffice; the value-set ceiling)."}}, {"id": "m_rounding", "group": "res", "title": "Door 1: the rounding gap", "gist": "The set-cover LP says the cover is 100% fractionally feasible, so it certifies nothing: the whole cost exponent is an integrality gap. At Q = 122,000 a random assignment leaves about 1,377 primes uncovered, greedy 867, and an annealed first-moment threshold suggests 758.", "detail": "In July, forty-one exact windows, belief-propagation decimation (874) and an exact half-cover block found nothing below 867, so 867 was judged at or near the optimum and the prize shrank from about 2.6 nats to 0–2.6. Later, parallel tempering found 850–851 rows at the same Q on the same moduli (0.4 nats better), and its density of states reaches one vector near 850: part of the prize has been collected and the rest looks small. All of this is evidence, not a global certificate.", "chips": ["Door 1", "867"], "f": {"status": "comp", "impact": "steer"}, "meta": [["Analysis", "goldbach/phd/wp8_beyond_covering.md §0, §6", false], ["Attacks", "goldbach/phd/wp9/door1/", false]], "search": "rounding gap LP integrality greedy 867 758 door 1", "note": {"level": "steer", "text": "The place where mathematics bought nats: about 0.4 of them so far. Each nat is a factor of about 2.7 in compute."}}, {"id": "m_doors", "group": "res", "title": "Three doors: mathematics, compute, paradigm", "gist": "Every route to a higher record passes through one of three doors: the rounding gap (mathematics), the ticket rate (compute), or a new compositeness mechanism (the paradigm). Door 3 is closed on the grammar, Door 1 looks near-exhausted, Door 2 is the reliable one.", "detail": "Divisor information is fully harvested by the sieve; correlation between rows implies a common divisor; certificates are either planted (paying ln r per row) or extracted (factoring-equivalent). Records are logarithmic in compute: each factor of 10 buys 2.3 nats.", "chips": ["WP8"], "f": {"status": "heur", "impact": "steer"}, "meta": [["Memo", "goldbach/phd/wp8_beyond_covering.md §6", false], ["Thesis", "goldbach/thesis/ch7_outlook.tex", false]], "search": "three doors rounding compute paradigm", "note": {"level": "steer", "text": "The programme-level plan: compute, plus a small chance from mathematics."}}, {"id": "m_staircase", "group": "res", "title": "Operation Staircase: a compute ladder to 200,000", "gist": "A costed ladder of certified rungs (140k, 150k, 165k, 175k, then 200k) under 10^200. The last e^5.5 would be closed by a few hundred volunteer GPUs for a quarter, an ASIC/FPGA rack, or about 4 nats of rounding mathematics plus a 10× fleet.", "detail": "Also priced: volunteer compute on the scale of Folding@home (about 2×10^5 times the fleet) would reach 200,000 in about two days; a Grover search is not competitive unless one oracle call takes seconds. The fleet's actual records (146,191, 157,837, 158,209) followed the early rungs.", "chips": ["WP8"], "f": {"status": "heur", "impact": "steer"}, "meta": [["Plan", "goldbach/phd/wp8_beyond_covering.md §1–§4", false], ["Thesis", "goldbach/thesis/ch7_outlook.tex (Operation Staircase)", false]], "search": "staircase 200000 volunteer asic grover quantum", "note": {"level": "steer", "text": "The plan the fleet then followed in practice: seven records in two days."}}, {"id": "m_wp3", "group": "res", "title": "Decoding barrier: sub-100 digits is brute force or nothing", "gist": "Below 100 digits the conventional cover needs E = 44.1 (about 9×10^5 GPU-years). Oversized covers would make it easy, but finding their small representative is a modular subset-sum at density 1.026, and CRT list-decoding is blocked by the Johnson radius.", "detail": "A first version claimed an ‘open window’ for decoding; it compared bounds at different parameters, was retracted, and was replaced by a coupled barrier. Costed rungs: 140 digits needs 1.6×10^12 candidates (0.10 A100-years), 130 digits 3.6×10^13, 120 digits 1.2×10^15.", "chips": ["WP3", "retraction"], "f": {"status": "heur", "impact": "bound"}, "meta": [["Memo", "goldbach/phd/wp3_small_representative_memo.md", false], ["Thesis", "goldbach/thesis/ch5_*.tex", false]], "search": "wp3 decoding barrier sub-100 subset-sum johnson", "note": {"level": "bound", "text": "Not about the 200-digit budget game, but the origin of the decoding-barrier theory that the Lean library later formalised for the search problem."}}, {"id": "m_toycrt", "group": "res", "title": "Toy CRT decoder: LLL stops at the Johnson radius", "gist": "A lattice decoder (61 positions, B = 10^12) recovers a planted
