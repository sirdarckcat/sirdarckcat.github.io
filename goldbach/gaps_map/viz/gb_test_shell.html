oted), lead merge 85aef81 (ccr-2ce9e63a-hn0fuw), thesis 85203b6. All of it moves quickly.", "\u003cb>Lean boxes are exact\u003c/b>: the statements were read from the source. I did not run Lean; &lsquo;kernel-checked&rsquo; rests on the library's own notes plus a text search that finds no \u003ccode>sorry\u003c/code>, \u003ccode>native_decide\u003c/code> or added axiom.", "\u003cb>Research boxes summarise documents\u003c/b>, and many are drafts, models or conjectures. Each box says which. Costs and exponents such as the 2.13M ceiling are model outputs, not theorems.", "The reference tool reads text, not types. It misses uses through method syntax and instances, so some links are added by hand (marked) and some may still be missing."], "statsHTML": "124 results (72 from the Lean library, 52 from research documents) and 223 links.", "footHTML": "Built on 2026-11-23 from read-only checkouts. Lean paths are in \u003ccode>goldbach/lean/\u003c/code> on \u003ccode>ccr-36ca7b46-8twf14\u003c/code>; research paths under \u003ccode>goldbach/\u003c/code> on \u003ccode>ccr-d4a17dd0-7uu03r\u003c/code>; thesis paths on \u003ccode>claude/phd-research-delegation-rualo0\u003c/code>; the record files were merged on \u003ccode>ccr-2ce9e63a-hn0fuw\u003c/code>. Lean links come from a reference scan of the library source (comments ignored); research links come from the documents' own cross-references, summarised by reading agents and spot-checked. Source for the map: \u003ccode>goldbach/gaps_map/\u003c/code> on \u003ccode>ccr-cdb2641a-5zg8un\u003c/code>.", "noDeps": "Relies on nothing else on this map.", "noUsers": "Nothing else on this map relies on this.", "noteHeading": "What it means for the record (my reading)", "noteLevels": {"record": {"label": "A record result", "slot": 1}, "engine": {"label": "Engine of the records", "slot": 3}, "bound": {"label": "Bounds what is possible", "slot": 5}, "steer": {"label": "Steers the search", "slot": 2}, "aside": {"label": "Aside", "slot": 10}}, "sourceLabel": "Quoted source", "edgeKinds": {"direct": {"label": "Named in the proof", "legend": "named in the proof text", "how": "The proof text of the first result names the second. Found by a tool that reads the Lean source, or by hand where a source note says so."}, "indirect": {"label": "Chain of references", "legend": "chain of references", "how": "No direct mention, but the proof of the first result reaches the second through the declarations listed here."}, "doc": {"label": "Stated in a document", "legend": "stated in a document", "how": "A document or docstring states the link; no proof text references it. The source is quoted below."}}}, "groups": [{"id": "rec", "slot": 1, "label": "Records", "blurb": "The achieved results, each a Lean theorem: the standing record 158,209, the earlier ladder, and the pure cover that needs no luck."}, {"id": "chk", "slot": 6, "label": "Checkers", "blurb": "Kernel-checked certificate machinery: failed Fermat tests, block checks, the least-summand certificate, and elliptic-curve primality."}, {"id": "cov", "slot": 3, "label": "Covering principle", "blurb": "The idea behind every record: choose residues of N so that each N − q is divisible by a small prime."}, {"id": "bnd", "slot": 5, "label": "Asymptotic bounds", "blurb": "How large g(N) must be for some N as N grows, with the analytic inputs (Mertens, prime number theorem) that prove it."}, {"id": "law", "slot": 2, "label": "Counting laws", "blurb": "Exact laws for the capped game 'largest g(N) for N below a cap': rows, budget, first moment, layered covers."}, {"id": "lim", "slot": 7, "label": "Search limits", "blurb": "Proven ceilings on cleverness: what selection, lattices, merging and lists can and cannot gain over plain search."}, {"id": "ff", "slot": 4, "label": "Function-field model", "blurb": "A toy version of the problem over polynomials, where parity gives deserts and the whole argument can be proved."}, {"id": "gpu", "slot": 8, "label": "Search-code proofs", "blurb": "Lean proofs that the fast Fermat-test kernels (CPU vector code and GPU code) compute exactly the test they claim."}, {"id": "res", "slot": 9, "label": "Research: models and results", "blurb": "The research session's cost model, theorems, closure argument, negative results and verdicts, from documents rather than Lean."}, {"id": "eng", "slot": 10, "label": "Research: searches and records", "blurb": "Cover constructions, campaigns, engines and the record chronology that the models were calibrated on."}], "lenses": [{"id": "role", "label": "Role"}, {"id": "status", "label": "Evidence", "field": "status", "values": [{"v": "lean", "label": "Kernel-checked in Lean", "slot": 6}, {"v": "leanhyp", "label": "Checked, with a stated hypothesis", "slot": 2}, {"v": "paper", "label": "Written proof (draft rigor)", "slot": 3}, {"v": "comp", "label": "Computed or measured", "slot": 4}, {"v": "heur", "label": "Heuristic or conjecture", "slot": 7}, {"v": "open", "label": "Open, retracted or planned", "slot": 10}]}, {"id": "impact", "label": "Impact", "field": "impact", "values": [{"v": "record", "label": "Is a record result", "slot": 1}, {"v": "engine", "label": "Engine of the records", "slot": 3}, {"v": "bound", "label": "Bounds what is possible", "slot": 5}, {"v": "steer", "label": "Steers the search", "slot": 2}, {"v": "aside", "label": "Aside", "slot": 10}]}], "nodes": [{"id": "l_isleast", "group": "cov", "title": "Definition: least Goldbach summand g(N)", "gist": "p is a Goldbach summand of N if both p and N − p are prime. g(N) is the least such p. Every record in the project is a statement about how large g(N) can be.", "detail": "In the library: IsSummand N p and IsLeastSummand N s. Everything else on the map is about proving, bounding or certifying statements of this form.", "chips": ["Basic.lean", "definition"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "IsLeastSummand", true], ["File", "goldbach/lean/GoldbachGaps/Basic.lean", true]], "source": "/-- `s` is the least Goldbach summand of `N`, the paper's `g(N) = s`. -/\ndef IsLeastSummand (N s : ℕ) : Prop := IsSummand N s ∧ ∀ p, IsSummand N p → s ≤ p", "sourceLabel": "Lean statement and proof (first lines)", "search": "IsLeastSummand  Basic"}, {"id": "l_primorial", "group": "cov", "title": "Primorial core: multiples of 2·3·5···P are deserts", "gist": "If N is a multiple of the product of all primes up to P (and N > 2P), then no prime up to P is a Goldbach summand of N.", "detail": "Each small prime p divides N and itself, so it divides N − p, making N − p composite. This is the simplest possible cover: every prime covers only itself. It forces N to be astronomically large (about e^P), which is why cleverer covers matter.", "chips": ["Basic.lean", "paper: lem:primcore"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "not_isSummand_of_primorial_dvd", true], ["File", "goldbach/lean/GoldbachGaps/Basic.lean", true]], "source": "/-- Paper Lemma `lem:primcore` (primorial core): if the primorial of `P` divides `N`\nand `N > 2P`, then no prime `≤ P` is a Goldbach summand of `N`. -/\ntheorem not_isSummand_of_primorial_dvd {N P p : ℕ} (hN : primorial P ∣ N) (hbig : 2 * P \u003c N)\n    (hpP : p ≤ P) : ¬ IsSummand N p := by\n  rintro ⟨hp, hq⟩\n  have hpN : p ∣ N := (hp.dvd_primorial_iff.mpr hpP).trans hN\n  have hdiv : p ∣ N - p := Nat.dvd_sub hpN dvd_rfl\n  have heq : p = N - p := (Nat.prime_dvd_prime_iff_eq hp hq).mp hdiv\n  have := hq.two_le\n  omega", "sourceLabel": "Lean statement and proof (first lines)", "search": "not_isSummand_of_primorial_dvd  Basic", "note": {"level": "engine", "text": "The idea the whole project starts from. The covering trick keeps the effect and shrinks N."}}, {"id": "l_exists", "group": "bnd", "title": "Every odd prime is a least summand", "gist": "For every odd prime s there are arbitrarily large even N with g(N) = s.", "detail": "Dirichlet's theorem gives a prime t ≡ −s modulo the primorial of s − 1, and N = s + t works. Sharp form of paper Theorem thm:dirichlet.", "chips": ["Basic.lean", "paper: thm:dirichlet"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "exists_isLeastSummand", true], ["File", "goldbach/lean/GoldbachGaps/Basic.lean", true]], "source": "/-- Paper Theorem `thm:dirichlet`, in its sharp form: every odd prime `s` is the least\nGoldbach summand of arbitrarily large even numbers. The proof is the paper's:\nDirichlet's theorem gives a prime `t ≡ -s` modulo the primorial of `s - 1`,\nand `N = s + t` works. -/\ntheorem exists_isLeastSummand {s : ℕ} (hs : s.Prime) (hs2 : s ≠ 2) (n : ℕ) :\n    ∃ N > n, Even N ∧ IsLeastSummand N s := by\n  have hs3 : 3 ≤ s := by\n    have := hs.two_le\n    omega\n  set M := primorial (s - 1) with hM\n  have hM0 : M ≠ 0 := primorial_ne_zero _\n  have : NeZero M := ⟨hM0⟩\n  have hcop : s.Coprime M := by\n    rw [hs.coprime_iff_not_dvd, hM, hs.dvd_primorial_iff]\n    omega\n  have hunit : IsUnit (-(s : ZMod M)) := ((ZMod.isUnit_iff_coprime s M).mpr hcop).neg\n  obtain ⟨t, htbig, ht, htmod⟩ := Nat.forall_exists_prime_gt_and_eq_mod hunit (n + s)\n  have hMN : M ∣ s + t := by\n    rw [← ZMod.natCast_eq_zero_iff]\n    push_cast\n    rw [htmod]\n    ring\n  have h2M : 2 ∣ M := by\n    rw [hM, Nat.prime_two.dvd_primorial_iff]\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "exists_isLeastSummand  Basic", "note": {"level": "aside", "text": "Qualitative: shows what values occur but says nothing about how large N must be."}}, {"id": "l_unbounded", "group": "bnd", "title": "g(N) is unbounded", "gist": "For every bound B there is an even N, with a Goldbach partition, all of whose Goldbach summands exceed B.", "detail": "A one-line consequence of the previous theorem.", "chips": ["Basic.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "least_summand_unbounded", true], ["File", "goldbach/lean/GoldbachGaps/Basic.lean", true]], "source": "/-- The least Goldbach summand is unbounded: for every bound `B` there is an even `N`\nthat has a Goldbach partition, all of whose Goldbach summands exceed `B`. -/\ntheorem least_summand_unbounded (B : ℕ) :\n    ∃ N s, Even N ∧ IsLeastSummand N s ∧ B \u003c s := by\n  obtain ⟨s, hsB, hs⟩ := Nat.exists_infinite_primes (B + 3)\n  obtain ⟨N, -, hNeven, hN⟩ := exists_isLeastSummand hs (by omega) 0\n  exact ⟨N, s, hNeven, hN, by omega⟩", "sourceLabel": "Lean statement and proof (first lines)", "search": "least_summand_unbounded  Basic"}, {"id": "l_linnik", "group": "bnd", "title": "Effective size of N, assuming Linnik", "gist": "Assuming Linnik's theorem on the least prime in a progression, every odd prime s is the least summand of some even N ≤ C·(primorial(s−1))^L + s, which gives g(N) ≥ c·log N for these N.", "detail": "The hypothesis is stated as a named assumption (LinnikStatement). The bound c·log N is far weaker than the covering bound below.", "chips": ["Effective.lean", "conditional on Linnik"], "f": {"status": "leanhyp", "impact": "bound"}, "meta": [["Lean name", "exists_isLeastSummand_le_of_linnik", true], ["File", "goldbach/lean/GoldbachGaps/Effective.lean", true], ["Also covers", "exists_isLeastSummand_le_four_pow_of_linnik", false]], "source": "/-- **Effective form of paper Theorem `thm:dirichlet`.** Under Linnik's theorem, with its\nconstants `C`, `L`: every odd prime `s` is the least Goldbach summand of an even\n`N ≤ C · (primorial (s - 1))^L + s`. -/\ntheorem exists_isLeastSummand_le_of_linnik (h : LinnikStatement) :\n    ∃ C L : ℝ, 0 \u003c C ∧ 0 \u003c L ∧ ∀ s : ℕ, s.Prime → s ≠ 2 →\n      ∃ N : ℕ, Even N ∧ IsLeastSummand N s ∧\n        (N : ℝ) ≤ C * (primorial (s - 1) : ℝ) ^ L + s := by\n  obtain ⟨C, L, hC, hL, hlin⟩ := h\n  refine ⟨C, L, hC, hL, fun s hs hs2 => ?_⟩\n  have hs3 : 3 ≤ s := by\n    have := hs.two_le\n    omega\n  set M := primorial (s - 1) with hM\n  have hMpos : 0 \u003c M := primorial_pos _\n  have h2M : 2 ∣ M := by\n    rw [hM, Nat.prime_two.dvd_primorial_iff]\n    omega\n  have hcop : s.Coprime M := by\n    rw [hs.coprime_iff_not_dvd, hM, hs.dvd_primorial_iff]\n    omega\n  have hM2 : 2 ≤ M := Nat.le_of_dvd hMpos h2M\n  -- the class of `-s` modulo `M`, as a positive number coprime to `M`\n  have h1 : Nat.Coprime (M - 1) M := by\n    have\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "exists_isLeastSummand_le_of_linnik exists_isLeastSummand_le_four_pow_of_linnik Effective", "note": {"level": "bound", "text": "A baseline only. The covering bound beats it by a factor of log log N."}}, {"id": "l_cover", "group": "cov", "title": "Covering certificate", "gist": "If every odd prime q below Q lies in a residue class a mod some modulus r, and N is in all these classes, then each N − q is divisible by that r. So no prime below Q is a Goldbach summand of N.", "detail": "The central trick of the project. Choosing the classes (the cover) is a design problem; finding N is then a Chinese-remainder step. The moduli need not even be prime for this direction.", "chips": ["Covering.lean", "paper: prop:cover"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "not_isSummand_of_cover", true], ["File", "goldbach/lean/GoldbachGaps/Covering.lean", true]], "source": "theorem not_isSummand_of_cover {R : Finset ℕ} {a : ℕ → ℕ} {N Q : ℕ}\n    (hR : ∀ r ∈ R, 2 ≤ r)\n    (hcover : ∀ q, q.Prime → q ≠ 2 → q \u003c Q → ∃ r ∈ R, q ≡ a r [MOD r])\n    (hN : ∀ r ∈ R, N ≡ a r [MOD r]) (heven : Even N)\n    (hbig : ∀ r ∈ R, Q + r \u003c N) (hbig2 : Q + 2 \u003c N)\n    {q : ℕ} (hqQ : q \u003c Q) : ¬ IsSummand N q := by\n  rintro ⟨hq, hNq⟩\n  by_cases hq2 : q = 2\n  · subst hq2\n    have h2 : 2 ∣ N - 2 := Nat.dvd_sub (even_iff_two_dvd.mp heven) dvd_rfl\n    have := (Nat.prime_dvd_prime_iff_eq Nat.prime_two hNq).mp h2\n    omega\n  · obtain ⟨r, hr, hqr⟩ := hcover q hq hq2 hqQ\n    have hle : q ≤ N := by\n      have := hbig r hr\n      omega\n    have hdvd : r ∣ N - q := (Nat.modEq_iff_dvd' hle).mp (hqr.trans (hN r hr).symm)\n    rcases (Nat.dvd_prime hNq).mp hdvd with h1 | h1\n    · have := hR r hr\n      omega\n    · have := hbig r hr\n      omega", "sourceLabel": "Lean statement and proof (first lines)", "search": "not_isSummand_of_cover  Covering", "note": {"level": "engine", "text": "Every record on the map is this theorem plus work to choose a good cover and extend it by luck."}}, {"id": "l_cover_exists", "group": "cov", "title": "Every cover is realised by some N", "gist": "For any cover by classes modulo distinct odd primes there are arbitrarily large even N in all the classes that do have a Goldbach partition, and their least summand is at least Q.", "detail": "Uses Dirichlet's theorem twice. It proves existence only; it gives no bound on the size of N. That missing bound is exactly what the capped game adds.", "chips": ["Covering.lean", "paper: thm:coverdirichlet"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "exists_isLeastSummand_of_cover", true], ["File", "goldbach/lean/GoldbachGaps/Covering.lean", true]], "source": "/-- Paper Theorem `thm:coverdirichlet` (unconditional realisation). Any covering of the\nodd primes below `Q` by classes modulo distinct odd primes is realised by arbitrarily\nlarge even numbers `N` that have a Goldbach partition; for each of them the least\nGoldbach summand `g` exists and satisfies `Q ≤ g`. The proof applies Dirichlet's theorem\ntwice, as in the paper. -/\ntheorem exists_isLeastSummand_of_cover {R : Finset ℕ} {a : ℕ → ℕ} {Q : ℕ}\n    (hR : ∀ r ∈ R, r.Prime ∧ r ≠ 2)\n    (hcover : ∀ q, q.Prime → q ≠ 2 → q \u003c Q → ∃ r ∈ R, q ≡ a r [MOD r]) (n : ℕ) :\n    ∃ N > n, Even N ∧ (∀ r ∈ R, N ≡ a r [MOD r]) ∧ ∃ g, IsLeastSummand N g ∧ Q ≤ g := by\n  classical\n  have hr3 : ∀ r ∈ R, 3 ≤ r := fun r hr => by\n    have h1 := (hR r hr).1.two_le\n    have h2 := (hR r hr).2\n    omega\n  set M := ∏ r ∈ R, r with hM\n  have hM0 : M ≠ 0 := Finset.prod_ne_zero_iff.mpr fun r hr => by\n    have := hr3 r hr\n    omega\n  have hrM : ∀ r ∈ R, r ∣ M := fun r hr => Finset.dvd_prod_of_mem (fun r => r) hr\n  have hpp\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "exists_isLeastSummand_of_cover  Covering"}, {"id": "l_counting", "group": "bnd", "title": "Counting bound: some N has no small summand", "gist": "For large X there is an even N between X and 2X with no Goldbach summand below ln X · ln ln X / 48. Proved by pigeonhole on prime pairs.", "detail": "The constant 48 is far from optimal; counting cannot exceed 1/2. The finite form is: if π(z)·π(X) \u003c ⌊X/2⌋ − 1 then some even N ≤ X has no summand ≤ z.", "chips": ["Counting.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "eventually_exists_even_forall_not_isSummand", true], ["File", "goldbach/lean/GoldbachGaps/Counting.lean", true], ["Also covers", "exists_even_le_forall_not_isSummand", false]], "source": "/-- Rate form of the counting bound: for all sufficiently large `X` there is an even `n`\nwith `X \u003c n ≤ 2X` none of whose Goldbach summands is `≤ log X · log log X / 48`.\n(The constant is far from optimal; the counting argument gives `1/2 + o(1)` for `n ≤ X`.) -/\ntheorem eventually_exists_even_forall_not_isSummand :\n    ∀ᶠ X : ℕ in atTop, ∃ n, X \u003c n ∧ n ≤ 2 * X ∧ Even n ∧\n      ∀ p : ℕ, (p : ℝ) ≤ Real.log X * Real.log (Real.log X) / 48 → ¬ IsSummand n p := by\n  have hC : Real.log 4 + 1 ≤ 12 / 5 := by\n    have h4 : Real.log 4 = 2 * Real.log 2 := by\n      rw [show (4 : ℝ) = 2 ^ 2 by norm_num, Real.log_pow]\n      norm_num\n    have := Real.log_two_lt_d9\n    linarith\n  have hcheb := Chebyshev.eventually_primeCounting_le (ε := 1) one_pos\n  have hL : Tendsto (fun X : ℕ => Real.log X) atTop atTop :=\n    Real.tendsto_log_atTop.comp tendsto_natCast_atTop_atTop\n  have hz : Tendsto (fun X : ℕ => Real.log X * Real.log (Real.log X) / 48) atTop atTop :=\n    (hL.atTop_mul_atTop₀ (Real.tendsto_log_atTop\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "eventually_exists_even_forall_not_isSummand exists_even_le_forall_not_isSummand Counting", "note": {"level": "bound", "text": "The baseline that covering improves: 1/48 and at most 1/2 by counting, against 1.349 by covering."}}, {"id": "l_mertens1", "group": "bnd", "title": "Mertens' first theorem", "gist": "For all N ≥ 1, |Σ Λ(n)/n − ln N| ≤ 6, the sum over n ≤ N of the von Mangoldt function over n.", "detail": "The base of the Mertens chain in this library.", "chips": ["Mertens.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "Mertens.abs_sum_lam_sub_log_le", true], ["File", "goldbach/lean/GoldbachGaps/Mertens.lean", true]], "source": "/-- **Mertens' first theorem** at the integers: `|∑_{n ≤ N} Λ(n)/n - ln N| ≤ 6`. -/\ntheorem abs_sum_lam_sub_log_le (N : ℕ) (hN : 1 ≤ N) :\n    |∑ n ∈ Ioc 0 N, Λ n / n - Real.log N| ≤ 6 := by\n  have hNpos : (0 : ℝ) \u003c N := by exact_mod_cast hN\n  have key : ∑ n ∈ Ioc 0 N, Λ n * ((N / n : ℕ) : ℝ) = ∑ n ∈ Ioc 0 N, Real.log n := by\n    rw [← ArithmeticFunction.sum_Ioc_mul_zeta_eq_sum, ArithmeticFunction.vonMangoldt_mul_zeta]\n    simp [ArithmeticFunction.log_apply]\n  have hup : ∑ n ∈ Ioc 0 N, Λ n * ((N / n : ℕ) : ℝ) ≤ N * ∑ n ∈ Ioc 0 N, Λ n / n := by\n    rw [Finset.mul_sum]\n    refine Finset.sum_le_sum fun n hn => ?_\n    calc Λ n * ((N / n : ℕ) : ℝ) ≤ Λ n * ((N : ℝ) / n) :=\n          mul_le_mul_of_nonneg_left Nat.cast_div_le ArithmeticFunction.vonMangoldt_nonneg\n      _ = N * (Λ n / n) := by ring\n  have hlow : N * ∑ n ∈ Ioc 0 N, Λ n / n - ∑ n ∈ Ioc 0 N, Λ n\n      ≤ ∑ n ∈ Ioc 0 N, Λ n * ((N / n : ℕ) : ℝ) := by\n    rw [Finset.mul_sum, ← Finset.sum_sub_distrib]\n    refine Finset.sum_le_sum fun n\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Mertens.abs_sum_lam_sub_log_le  Mertens"}, {"id": "l_mertensconst", "group": "bnd", "title": "Mertens' constant exists", "gist": "The quantity B(b) − ln ln b has a limit as b grows, where B is the prime-power version of Σ 1/p.", "detail": "Second link of the chain: from the first theorem to a limit.", "chips": ["Mertens.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "Mertens.tendsto_B_sub_log_log", true], ["File", "goldbach/lean/GoldbachGaps/Mertens.lean", true]], "source": "theorem tendsto_B_sub_log_log :\n    Tendsto (fun b : ℝ => B b - Real.log (Real.log b)) atTop (𝓝 limitB) := by\n  have h1 : Tendsto (fun b : ℝ => (A b - Real.log b) / Real.log b) atTop (𝓝 0) := by\n    refine squeeze_zero_norm' ?_\n      ((tendsto_const_nhds (x := (7 : ℝ))).div_atTop Real.tendsto_log_atTop)\n    filter_upwards [eventually_ge_atTop 2] with b hb\n    have hl : 0 \u003c Real.log b := Real.log_pos (by linarith)\n    rw [norm_div, Real.norm_eq_abs, Real.norm_eq_abs, abs_of_pos hl]\n    exact div_le_div_of_nonneg_right (abs_A_sub_log_le (by linarith)) hl.le\n  have h2 : Tendsto (fun b : ℝ => ∫ t in (2 : ℝ)..b, rho t) atTop\n      (𝓝 (∫ t in Set.Ioi 2, rho t)) :=\n    intervalIntegral_tendsto_integral_Ioi 2 integrableOn_rho tendsto_id\n  have h3 := ((tendsto_const_nhds (x := 1 - Real.log (Real.log 2))).add h1).add h2\n  rw [add_zero] at h3\n  refine h3.congr' ?_\n  filter_upwards [eventually_ge_atTop 2] with b hb\n  rw [B_eq hb]", "sourceLabel": "Lean statement and proof (first lines)", "search": "Mertens.tendsto_B_sub_log_log  Mertens"}, {"id": "l_gammaid", "group": "bnd", "title": "The limit is Euler's constant γ", "gist": "The limit of B(t) − ln ln t equals Euler's constant, identified through ln ζ(s) = (s − 1)·∫ B(t) t^(−s) dt.", "detail": "Third link: relates the prime sums to the zeta function.", "chips": ["Mertens.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "Mertens.limit_eq_eulerMascheroni", true], ["File", "goldbach/lean/GoldbachGaps/Mertens.lean", true]], "source": "/-- The limit of `B(t) - ln ln t` is Euler's constant. -/\ntheorem limit_eq_eulerMascheroni : limitB = Real.eulerMascheroniConstant := by\n  have hH : ∀ s : ℝ, 1 \u003c s →\n      (s - 1) * ∫ t in Set.Ioi 1, (B t - Real.log (Real.log t)) * t ^ (-s)\n        = Real.log (riemannZeta (s : ℂ)).re + Real.log (s - 1) + Real.eulerMascheroniConstant := by\n    intro s hs\n    have hJ := Real.eulerMascheroniConstant_eq_neg_integral_log_log hs\n    have hI := log_zeta_eq_integral hs\n    have e : ∫ t in Set.Ioi 1, (B t - Real.log (Real.log t)) * t ^ (-s)\n        = (∫ t in Set.Ioi 1, B t * t ^ (-s))\n          - ∫ t in Set.Ioi 1, Real.log (Real.log t) * t ^ (-s) := by\n      rw [← integral_sub (integrableOn_B_mul_rpow hs) (Real.integrableOn_log_log_mul_rpow hs)]\n      refine integral_congr_ae (Eventually.of_forall fun t => ?_)\n      simp only\n      ring\n    rw [e, mul_sub, ← hI]\n    linarith\n  have h2 : Tendsto (fun s : ℝ => Real.log (riemannZeta (s : ℂ)).re + Real.log (s - 1)\n      + Real.eulerMascheroniConsta\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Mertens.limit_eq_eulerMascheroni  Mertens"}, {"id": "l_mertens3", "group": "bnd", "title": "Mertens' third theorem", "gist": "ln w · ∏ over primes p ≤ w of (1 − 1/p) tends to e^(−γ).", "detail": "Proved from Mathlib in Mertens.lean (the library's own note says it is not in Mathlib). It is the one analytic fact that gives the sharp constant e^γ/(2C₂) in the covering bound.", "chips": ["Mertens.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Mertens.mertens_third", true], ["File", "goldbach/lean/GoldbachGaps/Mertens.lean", true]], "source": "/-- **Mertens' third theorem**: `ln w · ∏_{p ≤ w} (1 - 1/p) → e^{-γ}`. -/\ntheorem mertens_third :\n    Tendsto (fun w : ℕ => Real.log w * ∏ p ∈ Nat.primesLE w, (1 - (p : ℝ)⁻¹)) atTop\n      (𝓝 (Real.exp (-Real.eulerMascheroniConstant))) := by\n  have h := (Real.continuous_exp.tendsto _).comp tendsto_log_log_add_sum\n  refine h.congr' ?_\n  filter_upwards [eventually_ge_atTop 3] with w hw\n  have hw3 : (3 : ℝ) ≤ w := by exact_mod_cast hw\n  have hlw : 0 \u003c Real.log w := Real.log_pos (by linarith)\n  simp only [Function.comp_apply]\n  rw [Real.exp_add, Real.exp_log hlw, Real.exp_sum]\n  congr 1\n  refine Finset.prod_congr rfl fun p hp => ?_\n  have hpp := (Nat.mem_primesLE.mp hp).2\n  have hp2 : (2 : ℝ) ≤ p := by exact_mod_cast hpp.two_le\n  have hx : (p : ℝ)⁻¹ ≤ 1 / 2 := by\n    rw [inv_eq_one_div]\n    exact one_div_le_one_div_of_le (by norm_num) hp2\n  exact Real.exp_log (by linarith)", "sourceLabel": "Lean statement and proof (first lines)", "search": "Mertens.mertens_third  Mertens", "note": {"level": "bound", "text": "Where the constant 1.349 comes from. Pure asymptotics: it does not help choose a cover for 10^200."}}, {"id": "l_pnt", "group": "bnd", "title": "Prime number theorem as two inequalities", "gist": "For every δ > 0 and large x, (1 − δ)·x/ln x ≤ π(x) ≤ (1 + δ)·x/ln x.", "detail": "Stated in the form the covering bound needs. No hypothesis in the Lean statement.", "chips": ["CoverBound.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "eventually_primeCounting_bounds", true], ["File", "goldbach/lean/GoldbachGaps/CoverBound.lean", true]], "source": "/-- The prime number theorem as two inequalities: for every `δ > 0` and all large `x`,\n`(1 - δ) x / ln x ≤ π(x) ≤ (1 + δ) x / ln x`. -/\ntheorem eventually_primeCounting_bounds {δ : ℝ} (hδ : 0 \u003c δ) :\n    ∀ᶠ x : ℝ in atTop, (1 - δ) * (x / Real.log x) ≤ (Nat.primeCounting ⌊x⌋₊ : ℝ) ∧\n      (Nat.primeCounting ⌊x⌋₊ : ℝ) ≤ (1 + δ) * (x / Real.log x) := by\n  have hne : ∀ᶠ x : ℝ in atTop, x / Real.log x ≠ 0 := by\n    filter_upwards [eventually_gt_atTop 1] with x hx\n    exact div_ne_zero (by linarith) (Real.log_pos hx).ne'\n  have h := (Asymptotics.isEquivalent_iff_tendsto_one hne).mp Nat.isEquivalent_primeCounting\n  have h1 := h.eventually (eventually_gt_nhds (show (1 - δ : ℝ) \u003c 1 by linarith))\n  have h2 := h.eventually (eventually_lt_nhds (show (1 : ℝ) \u003c 1 + δ by linarith))\n  filter_upwards [h1, h2, eventually_gt_atTop 1] with x hx1 hx2 hx\n  have hpos : 0 \u003c x / Real.log x := div_pos (by linarith) (Real.log_pos hx)\n  simp only [Pi.div_apply] at hx1 hx2\n  constructor\n  · have := (lt_div_iff₀ hpo\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "eventually_primeCounting_bounds  CoverBound"}, {"id": "l_consts", "group": "bnd", "title": "Explicit constants: C₂ and e^−γ", "gist": "The twin-prime constant satisfies C₂ ≤ 1575/2304 (about 0.684), and e^(−γ) \u003c 0.6066 (true value 0.5615).", "detail": "Crude but proved numerical bounds, enough to turn the sharp theorem into an explicit constant (1.2).", "chips": ["CoverBound.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "twinPrimeConstant_le", true], ["File", "goldbach/lean/GoldbachGaps/CoverBound.lean", true], ["Also covers", "exp_neg_eulerMascheroni_lt", false]], "source": "/-- `C₂ ≤ (3/4)(15/16)(35/36)`: the infimum is at most the partial product over `3, 5, 7`. -/\ntheorem twinPrimeConstant_le : twinPrimeConstant ≤ 1575 / 2304 := by\n  have h1 : twinPrimeConstant ≤ twinPartial 7 :=\n    ciInf_le ⟨0, fun _ ⟨w, hw⟩ => hw ▸ twinPartial_nonneg w⟩ 7\n  have hsub : ({3, 5, 7} : Finset ℕ) ⊆ oddPrimesLE 7 := by\n    intro r hr\n    simp only [Finset.mem_insert, Finset.mem_singleton] at hr\n    rw [mem_oddPrimesLE]\n    rcases hr with rfl | rfl | rfl\n    · exact ⟨by omega, by norm_num, by norm_num⟩\n    · exact ⟨by omega, by norm_num, by norm_num⟩\n    · exact ⟨by omega, by norm_num, by norm_num⟩\n  have h2 : twinPartial 7 ≤ ∏ r ∈ ({3, 5, 7} : Finset ℕ), (1 - 1 / ((r : ℝ) - 1) ^ 2) :=\n    Finset.prod_le_prod_of_subset_of_le_one₀ hsub\n      (fun r hr => (twinPartial_factor (three_le_of_mem_oddPrimesLE hr)).1)\n      (fun _ hr _ => (twinPartial_factor (three_le_of_mem_oddPrimesLE hr)).2)\n  refine h1.trans (h2.trans (le_of_eq ?_))\n  rw [Finset.prod_insert (by decide), Finset.p\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "twinPrimeConstant_le exp_neg_eulerMascheroni_lt CoverBound"}, {"id": "l_mertensUpper", "group": "bnd", "title": "Elementary Mertens-type upper bound (κ = 1.367)", "gist": "The product over odd primes r ≤ w of (r − 2)/(r − 1) is at most about 1.367 / ln w, proved without Mertens' third theorem.", "detail": "Enough for an unconditional covering bound with constant 0.73.", "chips": ["CoverBound.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "mertensUpper_elementary", true], ["File", "goldbach/lean/GoldbachGaps/CoverBound.lean", true]], "source": "/-- The elementary instance of `MertensUpper`, with `κ = 1575/1152 = 1.367`. -/\ntheorem mertensUpper_elementary : MertensUpper (1575 / 1152) := by\n  intro ε hε\n  filter_upwards [eventually_ge_atTop 7] with w hw\n  have hw7 : (7 : ℝ) ≤ w := by exact_mod_cast hw\n  have hlog : 0 \u003c Real.log (w : ℝ) := Real.log_pos (by linarith)\n  have hle : Real.log (w : ℝ) ≤ Real.log ((w : ℝ) + 1) :=\n    Real.log_le_log (by linarith) (by linarith)\n  calc oddPrimeProd w ≤ 1575 / 1152 / Real.log (w + 1) := oddPrimeProd_le hw\n    _ ≤ 1575 / 1152 / Real.log w := div_le_div_of_nonneg_left (by norm_num) hlog hle\n    _ ≤ (1575 / 1152 + ε) / Real.log w := by\n        apply div_le_div_of_nonneg_right _ hlog.le\n        linarith", "sourceLabel": "Lean statement and proof (first lines)", "search": "mertensUpper_elementary  CoverBound"}, {"id": "l_cb073", "group": "bnd", "title": "Covering bound, unconditional: c = 0.73", "gist": "For all large X there is an even N ≤ X such that N − q is composite for every prime q \u003c 0.73·ln X·ln ln X.", "detail": "Uses only the elementary Mertens-type bound. The constant 1152/1575 = 0.7314… is rounded down. Covering beats counting here: counting gives at best 1/2.", "chips": ["CoverBound.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "eventually_exists_even_le_no_summand", true], ["File", "goldbach/lean/GoldbachGaps/CoverBound.lean", true]], "source": "/-- **Unconditional.** For all large `X` there is an even `N ≤ X` (above the threshold) such\nthat `N - q` is composite for every prime `q \u003c 0.73 · ln X · ln ln X`. The constant is\n`1152/1575 = 0.7314…` rounded down; counting pairs of primes gives `1/2` and no more. -/\ntheorem eventually_exists_even_le_no_summand :\n    ∀ᶠ X : ℕ in atTop, ∃ N : ℕ, 0.73 * Real.log X * Real.log (Real.log X) \u003c N ∧ N ≤ X ∧ Even N ∧\n      ∀ q : ℕ, (q : ℝ) \u003c 0.73 * Real.log X * Real.log (Real.log X) → ¬ IsSummand N q :=\n  eventually_exists_even_le_of_mertensUpper (by norm_num) mertensUpper_elementary (by norm_num)", "sourceLabel": "Lean statement and proof (first lines)", "search": "eventually_exists_even_le_no_summand  CoverBound"}, {"id": "l_cb12", "group": "bnd", "title": "Covering bound with explicit constant c = 1.2", "gist": "For all large X there is an even N ≤ X such that N − q is composite for every prime q \u003c 1.2·ln X·ln ln X.", "detail": "Uses the crude numerical bounds on γ and C₂ plus Mertens' third theorem. The limit of the method is 1.349.", "chips": ["CoverBound.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "eventually_exists_even_le_no_summand_six_fifths", true], ["File", "goldbach/lean/GoldbachGaps/CoverBound.lean", true]], "source": "/-- **An explicit constant, with no hypothesis.** For all large `X` there is an even `N ≤ X`\nsuch that `N - q` is composite for every prime `q \u003c 1.2 · ln X · ln ln X`. (The crude bounds\n`γ > 1/2` and `C₂ ≤ 0.684` are used; the limit of the method is `1.349`.) -/\ntheorem eventually_exists_even_le_no_summand_six_fifths :\n    ∀ᶠ X : ℕ in atTop, ∃ N : ℕ, 1.2 * Real.log X * Real.log (Real.log X) \u003c N ∧ N ≤ X ∧ Even N ∧\n      ∀ q : ℕ, (q : ℝ) \u003c 1.2 * Real.log X * Real.log (Real.log X) → ¬ IsSummand N q :=\n  eventually_exists_even_le_of_mertensThird_explicit mertensThird", "sourceLabel": "Lean statement and proof (first lines)", "search": "eventually_exists_even_le_no_summand_six_fifths  CoverBound"}, {"id": "l_cb_sharp", "group": "bnd", "title": "Covering bound, sharp: c \u003c e^γ/(2C₂) = 1.349…", "gist": "For every c below e^γ/(2·C₂) = 1.349… and all large X there is an even N ≤ X such that N − q is composite for every prime q \u003c c·ln X·ln ln X. No hypothesis.", "detail": "Rests on the layered covering lemma, the prime number theorem and Mertens' third theorem. Also proved in the version that assumes Mertens as a hypothesis, as first written. At X = 10^200 the formula gives about 3,800, which is only for scale: 'large X' is not explicit in the theorem.", "chips": ["CoverBound.lean", "Mertens-based"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "eventually_exists_even_le_of_mul_lt_one", true], ["File", "goldbach/lean/GoldbachGaps/CoverBound.lean", true], ["Also covers", "eventually_exists_even_le_of_mertensThird", false]], "source": "/-- **The covering bound with the sharp constant, with no hypothesis.** If\n`c · 2 C₂ e^{-γ} \u003c 1`, that is `c \u003c e^γ / (2 C₂) = 1.349…` (`C₂` the twin-prime constant, `γ`\nEuler's constant), then for all large `X` there is an even `N ≤ X` such that `N - q` is\ncomposite for every prime `q \u003c c · ln X · ln ln X`. -/\ntheorem eventually_exists_even_le_of_mul_lt_one {c : ℝ}\n    (hc : c * (2 * twinPrimeConstant * Real.exp (-Real.eulerMascheroniConstant)) \u003c 1) :\n    ∀ᶠ X : ℕ in atTop, ∃ N : ℕ, c * Real.log X * Real.log (Real.log X) \u003c N ∧ N ≤ X ∧ Even N ∧\n      ∀ q : ℕ, (q : ℝ) \u003c c * Real.log X * Real.log (Real.log X) → ¬ IsSummand N q :=\n  eventually_exists_even_le_of_mertensThird mertensThird hc", "sourceLabel": "Lean statement and proof (first lines)", "search": "eventually_exists_even_le_of_mul_lt_one eventually_exists_even_le_of_mertensThird CoverBound", "note": {"level": "bound", "text": "The record 158,209 is about 40 times larger than what this asymptotic formula would suggest at 10^200. Theory is a floor, not a guide; the records come from the capped-game design."}}, {"id": "c_prime_moduli", "group": "cov", "title": "Prime moduli suffice", "gist": "A cover built from composite moduli, prime powers or overlapping classes can always be replaced by one using prime moduli that kills at least the same rows.", "detail": "Justifies restricting attention to prime moduli, as the records do (the odd primes 3 to 463): composite or prime-power moduli cannot do better.", "chips": ["Cap/Rows.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Cap.prime_moduli_suffice", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Rows.lean", true]], "source": "/-- **Prime moduli suffice.** Given any family of congruence conditions `x ≡ a i (mod m i)`\nwith moduli `m i ≥ 2` (composite, prime powers, with common factors: anything), there are\nprimes `r i ∣ m i` such that every `N` in all the classes modulo the `m i` is in all the\nclasses modulo the `r i`, and every row killed through `m i` is killed through `r i`. -/\ntheorem prime_moduli_suffice {ι : Type*} (m a : ι → ℕ) (hm : ∀ i, 2 ≤ m i) :\n    ∃ r : ι → ℕ, (∀ i, (r i).Prime ∧ r i ∣ m i) ∧\n      (∀ N, (∀ i, N ≡ a i [MOD m i]) → ∀ i, N ≡ a i [MOD r i]) ∧\n      ∀ q i, q ≡ a i [MOD m i] → q ≡ a i [MOD r i] := by\n  refine ⟨fun i => (m i).minFac, fun i => ⟨Nat.minFac_prime ?_, Nat.minFac_dvd _⟩, ?_, ?_⟩\n  · have := hm i\n    omega\n  · intro N hN i\n    exact (hN i).of_dvd (Nat.minFac_dvd _)\n  · intro q i h\n    exact h.of_dvd (Nat.minFac_dvd _)", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.prime_moduli_suffice  Rows"}, {"id": "c_kills", "group": "cov", "title": "Kills are residues", "gist": "For q + 2 ≤ N, the number N − q is composite exactly when q ≡ N modulo some prime r whose square is at most N − q.", "detail": "The exact bookkeeping of the game: a row N − q is killed by the prime r precisely when q lies in N's residue class modulo r. All the counting laws below are built on it.", "chips": ["Cap/Rows.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Cap.not_prime_sub_iff", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Rows.lean", true], ["Also covers", "Cap.dvd_sub_iff", false]], "source": "/-- **Kills are residues.** For `q + 2 ≤ N`, the row `N - q` is composite exactly when\n`q ≡ N` modulo some prime `r` with `r² ≤ N - q`. -/\ntheorem not_prime_sub_iff {N q : ℕ} (h : q + 2 ≤ N) :\n    ¬ (N - q).Prime ↔ ∃ r, r.Prime ∧ r * r ≤ N - q ∧ q ≡ N [MOD r] := by\n  have hle : q ≤ N := by omega\n  constructor\n  · intro hnp\n    refine ⟨(N - q).minFac, Nat.minFac_prime (by omega), ?_, ?_⟩\n    · have := Nat.minFac_sq_le_self (by omega : 0 \u003c N - q) hnp\n      rwa [sq] at this\n    · exact (dvd_sub_iff hle).mp (Nat.minFac_dvd _)\n  · rintro ⟨r, hr, hsq, hmod⟩ hp\n    have hdvd : r ∣ N - q := (dvd_sub_iff hle).mpr hmod\n    have hreq : r = N - q := (Nat.prime_dvd_prime_iff_eq hr hp).mp hdvd\n    have h2 := hr.two_le\n    rw [← hreq] at hsq\n    have : r * 2 ≤ r * r := Nat.mul_le_mul_left r h2\n    omega", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.not_prime_sub_iff Cap.dvd_sub_iff Rows"}, {"id": "c_two_rows", "group": "law", "title": "Two rows share only small divisors", "gist": "A common divisor of two different rows N − q and N − q′ (both below the row bound Q) is itself below Q. So any number r ≥ Q divides at most one row.", "detail": "A large modulus can therefore kill at most one row. This is the root of the 'above Q no list pays' limit further down. The same file also records that a prime at or above Q divides at most one row (row_unique_of_le).", "chips": ["Cap/Rows.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.lt_of_dvd_two_rows", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Rows.lean", true], ["Also covers", "Cap.row_unique_of_le", false]], "source": "/-- **Two rows share only small divisors**: a common divisor of two different rows below `Q`\nis itself below `Q`. -/\ntheorem lt_of_dvd_two_rows {N q q' r Q : ℕ} (hq' : q' ≤ N) (hlt : q \u003c q') (hQ : q' \u003c Q)\n    (h : r ∣ N - q) (h' : r ∣ N - q') : r \u003c Q := by\n  have hd := dvd_sub_rows hq' hlt h h'\n  have := Nat.le_of_dvd (by omega) hd\n  omega", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.lt_of_dvd_two_rows Cap.row_unique_of_le Rows"}, {"id": "c_budget", "group": "law", "title": "Budget law: the cap limits how many designs fit", "gist": "For pairwise coprime moduli with allowed-residue sets A_r, the number of N below X that meet every allowed set is at most (∏|A_r|)·(X/∏r + 1).", "detail": "The exact accounting of the cap. N lives in a progression modulo the product of the moduli, so each extra modulus shrinks the room. With the 89 odd primes up to 463 the product is about 10^192, which leaves about 2×10^7 even numbers below 10^200 per choice of residues. Adding 467 and 479 would leave about 95.", "chips": ["Cap/Budget.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.card_residues_in_le", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Budget.lean", true]], "source": "/-- **The budget law with choice sets.** Let `S` be pairwise coprime positive moduli and let\n`A r` be the set of residues allowed modulo `r`. The number of `N \u003c X` whose residue modulo\nevery `r ∈ S` is allowed is at most `(∏ |A r|) · (X / ∏ r + 1)`. -/\ntheorem card_residues_in_le (S : Finset ℕ) (A : ℕ → Finset ℕ) (X : ℕ)\n    (hpos : ∀ r ∈ S, 0 \u003c r) (hcop : (S : Set ℕ).Pairwise Nat.Coprime) :\n    #{N ∈ range X | ∀ r ∈ S, N % r ∈ A r} ≤ (∏ r ∈ S, #(A r)) * (X / (∏ r ∈ S, r) + 1) := by\n  classical\n  set M := ∏ r ∈ S, r with hM\n  have hM0 : 0 \u003c M := Finset.prod_pos hpos\n  rw [← Finset.card_pi, ← Finset.card_range (X / M + 1), ← Finset.card_product]\n  refine Finset.card_le_card_of_injOn (fun N => (fun r _ => N % r, N / M)) ?_ ?_\n  · intro N hN\n    rw [Finset.mem_coe, Finset.mem_filter, Finset.mem_range] at hN\n    rw [Finset.mem_coe, Finset.mem_product, Finset.mem_pi, Finset.mem_range]\n    exact ⟨fun r hr => hN.2 r hr, Nat.lt_succ_of_le (Nat.div_le_div_right hN.1.le)⟩\n  · intro N _ N' _ heq\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.card_residues_in_le  Budget", "note": {"level": "bound", "text": "Shows the trade-off behind using moduli up to 463: more moduli kill more rows but leave fewer candidates to search."}}, {"id": "c_pigeon", "group": "law", "title": "First moment: an average design exists", "gist": "Summed over all non-zero residue vectors, the number of rows left alive is exactly |P|·∏(r − 2). So some vector leaves at most |P|·∏(r − 2)/∏(r − 1) rows.", "detail": "The existence engine for covers: pigeonhole on an exact identity. The exact sum is sum_card_rowsLeft; the averaged bound is exists_rowsLeft_le.", "chips": ["Cap/FirstMoment.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Cap.exists_rowsLeft_le", true], ["File", "goldbach/lean/GoldbachGaps/Cap/FirstMoment.lean", true], ["Also covers", "Cap.sum_card_rowsLeft", false]], "source": "/-- **Pigeonhole for covers.** Some nonzero residue vector leaves at most the average number\nof rows: `rows left · ∏ (r - 1) ≤ |P| · ∏ (r - 2)`. -/\ntheorem exists_rowsLeft_le (S P : Finset ℕ) (hS : ∀ r ∈ S, 2 ≤ r)\n    (hP : ∀ q ∈ P, ∀ r ∈ S, ¬ r ∣ q) :\n    ∃ b ∈ vectors S, #(rowsLeft S P b) * ∏ r ∈ S, (r - 1) ≤ #P * ∏ r ∈ S, (r - 2) :=\n  Finset.exists_le_of_sum_le (vectors_nonempty S hS)\n    (f := fun b => #(rowsLeft S P b) * ∏ r ∈ S, (r - 1))\n    (g := fun _ => #P * ∏ r ∈ S, (r - 2))\n    (le_of_eq (sum_card_rowsLeft_mul S P (fun r hr => by\n      have := hS r hr\n      omega) hP))", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.exists_rowsLeft_le Cap.sum_card_rowsLeft FirstMoment", "note": {"level": "engine", "text": "Sets the baseline: a random-like cover leaves this many rows. Anything better has to be searched for."}}, {"id": "c_nofree", "group": "law", "title": "No free lunch for the choice of moduli", "gist": "For moduli of at least 3, the average over residue vectors of (rows left × ∏ r/(r − 1)) is at least |P|/2. No choice of moduli improves the average.", "detail": "So an averaging argument cannot be sharpened by picking better moduli. To beat the average you need a special design, and finding one is the hard search problem.", "chips": ["Cap/FirstMoment.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.noFreeLunch", true], ["File", "goldbach/lean/GoldbachGaps/Cap/FirstMoment.lean", true]], "source": "/-- **No free lunch.** For moduli `≥ 3` and rows not divisible by any of them, the average\nover nonzero residue vectors of `rows left × ∏ r/(r - 1)` is at least `|P| / 2`:\n`|P| · (number of vectors) · ∏ (r - 1) ≤ 2 · (Σ_b rows left) · ∏ r`. No choice of moduli\nimproves the average. -/\ntheorem noFreeLunch (S P : Finset ℕ) (hS : ∀ r ∈ S, 3 ≤ r)\n    (hP : ∀ q ∈ P, ∀ r ∈ S, ¬ r ∣ q) :\n    #P * (#(vectors S) * ∏ r ∈ S, (r - 1)) ≤\n      2 * ((∑ b ∈ vectors S, #(rowsLeft S P b)) * ∏ r ∈ S, r) := by\n  rw [sum_card_rowsLeft S P (fun r hr => by\n    have := hS r hr\n    omega) hP, card_vectors]\n  have h := prod_pred_sq_le S hS\n  rw [Finset.prod_pow, Finset.prod_mul_distrib] at h\n  generalize (∏ r ∈ S, (r - 1)) = V at h ⊢\n  generalize (∏ r ∈ S, (r - 2)) = W at h ⊢\n  generalize (∏ r ∈ S, r) = R at h ⊢\n  calc #P * (V * V) = #P * V ^ 2 := by ring\n    _ ≤ #P * (2 * (R * W)) := Nat.mul_le_mul_left _ h\n    _ = 2 * (#P * W * R) := by ring", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.noFreeLunch  FirstMoment", "note": {"level": "bound", "text": "Says that different moduli cannot improve the average. Any improvement has to come from structure in the design."}}, {"id": "c_layers", "group": "law", "title": "Layered covers (Erdős–Rankin style)", "gist": "Split the moduli into a fixed layer F, a pigeonhole layer S and a mop-up layer T. If a counting inequality holds, the classes on F extend to a full cover of every row.", "detail": "The formal heart of the asymptotic covering bounds: the first layer kills most rows, the second handles the survivors by averaging, the third finishes them. Proved from the first-moment pigeonhole.", "chips": ["Cap/Layers.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Cap.exists_cover_of_layers", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Layers.lean", true]], "source": "/-- **Layered covers.** Let `F`, `S`, `T` be pairwise disjoint sets of moduli, the moduli of\n`S` being at least `2`, and let classes `a₀` be given on `F`. Among the rows `P`, let `P₁` be\nthose not divisible by any modulus of `S` and not in the class `a₀ r` for any `r ∈ F`, and\nlet `Z` be those divisible by some modulus of `S`. If\n  `|P₁| · ∏_{r ∈ S} (r - 2) + |Z| · ∏_{r ∈ S} (r - 1) ≤ |T| · ∏_{r ∈ S} (r - 1)`,\nthen the classes on `F` extend to `F ∪ S ∪ T` so that every row of `P` is in the class of\nsome modulus. -/\ntheorem exists_cover_of_layers (F S T P : Finset ℕ) (a₀ : ℕ → ℕ) (hS : ∀ r ∈ S, 2 ≤ r)\n    (hFS : Disjoint F S) (hFT : Disjoint F T) (hST : Disjoint S T)\n    (hcount : #{q ∈ P | (∀ r ∈ S, ¬ r ∣ q) ∧ ∀ r ∈ F, ¬ q ≡ a₀ r [MOD r]} * ∏ r ∈ S, (r - 2) +\n        #{q ∈ P | ∃ r ∈ S, r ∣ q} * ∏ r ∈ S, (r - 1) ≤ #T * ∏ r ∈ S, (r - 1)) :\n    ∃ a : ℕ → ℕ, (∀ r ∈ F, a r = a₀ r) ∧ ∀ q ∈ P, ∃ r ∈ F ∪ S ∪ T, q ≡ a r [MOD r] := by\n  classical\n  set P₁ := {q ∈ P | (∀ r ∈ S, ¬ r ∣ q) ∧ ∀ r ∈ F\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.exists_cover_of_layers  Layers"}, {"id": "c_cover_cap", "group": "cov", "title": "From a cover to a number below a cap", "gist": "If classes modulo odd primes r ≤ B cover the odd primes below Q, then some even N in all the classes with Q + B \u003c N ≤ Q + B + 2·∏r has no Goldbach summand below Q.", "detail": "The Chinese remainder theorem puts N below twice the product of the moduli. So a cover whose moduli multiply to less than 10^200 yields a number inside the budget game. A finite layered form is included.", "chips": ["Cap/Layers.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Cap.exists_even_le_of_cover", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Layers.lean", true], ["Also covers", "Cap.exists_even_le_of_layers", false]], "source": "/-- **From a cover to a number below a cap.** If the classes `a r` modulo the odd primes\n`r ∈ R` (all at most `B`) cover the odd primes below `Q`, then some even `N` with\n`Q + B \u003c N ≤ Q + B + 2 ∏ r` lies in all the classes and has no Goldbach summand below `Q`. -/\ntheorem exists_even_le_of_cover {R : Finset ℕ} {a : ℕ → ℕ} {Q B : ℕ}\n    (hR : ∀ r ∈ R, r.Prime ∧ r ≠ 2) (hB : ∀ r ∈ R, r ≤ B) (hB2 : 2 ≤ B)\n    (hcover : ∀ q, q.Prime → q ≠ 2 → q \u003c Q → ∃ r ∈ R, q ≡ a r [MOD r]) :\n    ∃ N, Even N ∧ Q + B \u003c N ∧ N ≤ Q + B + 2 * ∏ r ∈ R, r ∧ (∀ r ∈ R, N ≡ a r [MOD r]) ∧\n      ∀ q \u003c Q, ¬ IsSummand N q := by\n  classical\n  have hr3 : ∀ r ∈ R, 3 ≤ r := fun r hr => by\n    have h1 := (hR r hr).1.two_le\n    have h2 := (hR r hr).2\n    omega\n  set M := ∏ r ∈ R, r with hM\n  have hM0 : 0 \u003c M := Finset.prod_pos fun r hr => by\n    have := hr3 r hr\n    omega\n  have hrM : ∀ r ∈ R, r ∣ M := fun r hr => Finset.dvd_prod_of_mem (fun r => r) hr\n  have hpp : Set.Pairwise (R : Set ℕ) (Function.onFun Nat.Coprime fun r\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.exists_even_le_of_cover Cap.exists_even_le_of_layers Layers", "note": {"level": "engine", "text": "Links the cover design to the 10^200 cap: the product of moduli is the price of a cover."}}, {"id": "c_smooth", "group": "law", "title": "What survives a fixed layer is smooth or nearly", "gist": "If every prime factor of n \u003c w² is ≤ z or > w, then n is z-smooth, or n = A·p′ with p′ > w prime and A z-smooth. In row form: q − 1 is smooth, or q = A·p′ + 1.", "detail": "Step E4 of the Erdős–Rankin adaptation. It lets the rows left by the fixed layer be counted by smooth numbers and prime pairs.", "chips": ["Cap/Layers.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "Cap.smooth_or_large_prime_factor", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Layers.lean", true], ["Also covers", "Cap.row_structure_of_fixed_layer", false]], "source": "/-- **Structure of the rows surviving a fixed layer** (step (E4) of the Erdős–Rankin\nadaptation). If every prime factor of `n` is `≤ z` or `> w`, and `n \u003c w²`, then either `n` is\n`z`-smooth, or `n = A · p'` with `p' > w` prime and `A` `z`-smooth. -/\ntheorem smooth_or_large_prime_factor {n z w : ℕ} (hn : 0 \u003c n) (hlt : n \u003c w * w)\n    (h : ∀ p, p.Prime → p ∣ n → p ≤ z ∨ w \u003c p) :\n    (∀ p, p.Prime → p ∣ n → p ≤ z) ∨\n      ∃ p' A, p'.Prime ∧ w \u003c p' ∧ n = A * p' ∧ ∀ p, p.Prime → p ∣ A → p ≤ z := by\n  by_cases hall : ∀ p, p.Prime → p ∣ n → p ≤ z\n  · exact Or.inl hall\n  · right\n    have hex : ∃ p, p.Prime ∧ p ∣ n ∧ z \u003c p := by\n      by_contra hcon\n      exact hall fun p hp hd => by\n        by_contra hlt'\n        exact hcon ⟨p, hp, hd, by omega⟩\n    obtain ⟨p', hp', hdvd, hz⟩ := hex\n    have hw : w \u003c p' := by\n      rcases h p' hp' hdvd with h1 | h1\n      · omega\n      · exact h1\n    obtain ⟨A, hA⟩ := hdvd\n    refine ⟨p', A, hp', hw, by rw [hA, mul_comm], ?_⟩\n    intro p hp hpA\n    have hpn : p\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.smooth_or_large_prime_factor Cap.row_structure_of_fixed_layer Layers"}, {"id": "c_poly", "group": "law", "title": "Polynomial families are too sparse", "gist": "If f(c) ≥ c² for all c in a set T, and all the values f(c) are below Q, then T has at most √Q + 1 elements.", "detail": "With Q the row bound, this limits how many rows a family of degree 2 or more can remove. With Q the cap, it limits how many members the family has. Also proved: if N = f(u) and q = f(c) then N − q is divisible by u − c, hence composite when 1 \u003c u − c \u003c N − q.", "chips": ["Cap/Poly.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.card_le_sqrt_succ", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Poly.lean", true], ["Also covers", "Cap.not_prime_row_of_eval, Cap.not_prime_eval_sub_eval", false]], "source": "/-- **The value-set ceiling.** If `f(c) ≥ c²` for every `c` in a finite set `T` and all the\nvalues `f(c)`, `c ∈ T`, are below `Q`, then `T` has at most `√Q + 1` elements. With `Q` the\nrow bound this limits the rows a family of degree `≥ 2` can remove; with `Q = X` the cap, it\nlimits the number of members of the family. -/\ntheorem card_le_sqrt_succ (f : ℕ → ℕ) (Q : ℕ) (T : Finset ℕ)\n    (hT : ∀ c ∈ T, c ^ 2 ≤ f c ∧ f c \u003c Q) : T.card ≤ Nat.sqrt Q + 1 := by\n  rw [← Finset.card_range (Nat.sqrt Q + 1)]\n  refine Finset.card_le_card fun c hc => ?_\n  obtain ⟨h1, h2⟩ := hT c hc\n  rw [Finset.mem_range, Nat.lt_succ_iff, Nat.le_sqrt']\n  omega", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.card_le_sqrt_succ Cap.not_prime_row_of_eval Cap.not_prime_eval_sub_eval Poly"}, {"id": "c_transfer", "group": "cov", "title": "A prime gap gives a Goldbach gap", "gist": "If no prime lies strictly between p and p′ then p′ + 1 has no Goldbach summand up to p′ − p; and if p and p′ − p + 1 are prime, then g(p′ + 1) = p′ − p + 1.", "detail": "Ties g(N) to prime gaps: a very large prime gap automatically produces a number with large least summand. A different route from covering.", "chips": ["Cap/Transfer.lean"], "f": {"status": "lean", "impact": "aside"}, "meta": [["Lean name", "Cap.not_isSummand_of_desert", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Transfer.lean", true], ["Also covers", "Cap.isLeastSummand_of_desert", false]], "source": "theorem not_isSummand_of_desert {p p' q : ℕ} (hgap : ∀ n, p \u003c n → n \u003c p' → ¬ n.Prime)\n    (hq : q ≤ p' - p) : ¬ IsSummand (p' + 1) q := by\n  rintro ⟨hqp, hN⟩\n  have h2 := hqp.two_le\n  exact hgap (p' + 1 - q) (by omega) (by omega) hN", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.not_isSummand_of_desert Cap.isLeastSummand_of_desert Transfer", "note": {"level": "aside", "text": "Not used by any record. It would need an explicit prime gap as large as the target, which the covering construction avoids."}}, {"id": "c_hits", "group": "lim", "title": "Expected successes = Σ (1 − p)^(rows left)", "gist": "If each leftover row is prime with probability p, then for any chosen set of candidates the expected number of successes is the sum over candidates of (1 − p)^(rows left).", "detail": "The 'logged hit mass' printed by the search runs is exactly the expected number of successes. This is the cost model of the capped game.", "chips": ["Cap/Selection.lean"], "f": {"status": "lean", "impact": "steer"}, "meta": [["Lean name", "Cap.expected_hits", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Selection.lean", true]], "source": "/-- **The logged hit mass is the expected number of successes.** For every set `T` of\nselected members, member `k` having the rows `A k` left:\n`E [number of k ∈ T all of whose rows are composite] = Σ_{k ∈ T} (1 - p)^{|A k|}`. -/\ntheorem expected_hits (p : ℝ) (T : Finset κ) (A : κ → Finset ι) :\n    ∑ ω : ι → Bool, bern p ω * (∑ k ∈ T, ∏ i ∈ A k, if ω i then (0 : ℝ) else 1) =\n      ∑ k ∈ T, (1 - p) ^ #(A k) := by\n  simp_rw [Finset.mul_sum]\n  rw [Finset.sum_comm]\n  exact Finset.sum_congr rfl fun k _ => sum_bern_all_false p (A k)", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.expected_hits  Selection", "note": {"level": "steer", "text": "The identity every campaign plan is built on."}}, {"id": "c_selection", "group": "lim", "title": "Selection identity: where the successes sit", "gist": "If rows-left is Gaussian over candidates, those at least z standard deviations below the mean hold the fraction Φ(λ − z) of all the success probability, where λ = −√v·ln(1 − p).", "detail": "Says how concentrated the success probability is in the best-looking candidates, and so how many to test.", "chips": ["Cap/Tilt.lean"], "f": {"status": "lean", "impact": "steer"}, "meta": [["Lean name", "Cap.selection_fraction", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Tilt.lean", true]], "source": "/-- **The selection identity.** `R ~ N(μ, v)` over members, success probability `(1 - p)^R`:\nthe members with `R ≤ μ - z √v` hold the fraction `Φ(λ - z)` of the successes,\n`λ = -√v · ln(1 - p)`. -/\ntheorem selection_fraction (μ : ℝ) {v : ℝ≥0} (hv : v ≠ 0) {p : ℝ} (hp : p \u003c 1) (z : ℝ) :\n    (∫ r in Set.Iic (μ - z * √(v : ℝ)), (1 - p) ^ r ∂(gaussianReal μ v)) /\n        (∫ r, (1 - p) ^ r ∂(gaussianReal μ v)) =\n      (gaussianReal 0 1 (Set.Iic (-(√(v : ℝ) * Real.log (1 - p)) - z))).toReal := by\n  have hpos : 0 \u003c 1 - p := by linarith\n  have hs : 0 \u003c √(v : ℝ) := Real.sqrt_pos.mpr (by exact_mod_cast pos_of_ne_zero hv)\n  have hpow : ∀ r : ℝ, (1 - p) ^ r = rexp (Real.log (1 - p) * r) :=\n    fun r => Real.rpow_def_of_pos hpos r\n  simp_rw [hpow]\n  rw [setIntegral_exp_mul_gaussianReal μ hv _ measurableSet_Iic,\n    integral_exp_mul_gaussianReal μ hv, mul_div_cancel_left₀ _ (Real.exp_pos _).ne',\n    gaussianReal_Iic _ hv]\n  have key : (μ - z * √(v : ℝ) - (μ + v * Real.log (1 - p))) / √(v : ℝ) =\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.selection_fraction  Tilt"}, {"id": "c_tilt", "group": "lim", "title": "Tilt: what the best candidate is worth", "gist": "A candidate z standard deviations below the mean in rows left is e^(λz − λ²/2) times likelier to succeed than average. Among K candidates the best has z ≈ √(2 ln K), so picking the best gains only about λ·√(2 ln K) nats.", "detail": "A nat is a factor of e in the odds. The gain from picking the best of K candidates grows like √(ln K), not like K. Choosing promising candidates helps a little and cannot replace more search.", "chips": ["Cap/Tilt.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.enrichment_at", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Tilt.lean", true]], "source": "/-- **What the best member is worth.** A member whose number of rows left is `z` standard\ndeviations below the mean is `e^(λ z - λ²/2)` times as likely to succeed as an average member,\n`λ = -√v ln (1 - p)`. Among `K` members the best has `z ≈ √(2 ln K)`, so no search inside a\nprogression of `K` members gains more than about `λ √(2 ln K)` nats over testing at random. -/\ntheorem enrichment_at (μ : ℝ) {v : ℝ≥0} (hv : v ≠ 0) {p : ℝ} (hp : p \u003c 1) (z : ℝ) :\n    (1 - p) ^ (μ - z * √(v : ℝ)) / (∫ r, (1 - p) ^ r ∂(gaussianReal μ v)) =\n      rexp (-(√(v : ℝ) * Real.log (1 - p)) * z - (√(v : ℝ) * Real.log (1 - p)) ^ 2 / 2) := by\n  have hpos : 0 \u003c 1 - p := by linarith\n  have hpow : ∀ r : ℝ, (1 - p) ^ r = rexp (Real.log (1 - p) * r) :=\n    fun r => Real.rpow_def_of_pos hpos r\n  simp_rw [hpow]\n  rw [integral_exp_mul_gaussianReal μ hv, ← Real.exp_sub]\n  congr 1\n  have := Real.mul_self_sqrt v.coe_nonneg\n  linear_combination (Real.log (1 - p) ^ 2 / 2) * this", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.enrichment_at  Tilt", "note": {"level": "bound", "text": "Puts a hard price on the idea of picking good-looking N before testing."}}, {"id": "c_lattice", "group": "lim", "title": "Lattice decoding radius", "gist": "For k rows and sieve primes up to z ≥ k/e, a lattice method needs the smooth part of the leftover to be c times the typical one with c² ≥ e·ln K/4. For K = 2^32 candidates that means c ≥ 3.88.", "detail": "Quantifies how good a lattice-based construction of N would have to be: numbers almost four times smoother than typical.", "chips": ["Cap/Radius.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.lattice_radius", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Radius.lean", true], ["Also covers", "Cap.lattice_radius_two_pow_32", false]], "source": "/-- **The decoding radius of the lattice method.** `k` rows, sieve primes up to `z ≥ k/e`,\ntypical smooth exponent `β_typ = (k/z)(1 + ln (z/k))`. If the condition `ln K ≤ z β² / k` of\nthe method holds for `β = c β_typ`, then `c² ≥ e ln K / 4`. -/\ntheorem lattice_radius {k z c lnK : ℝ} (hk : 0 \u003c k) (hz : k * exp (-1) ≤ z)\n    (h : lnK ≤ z * (c * (k / z * (1 + log (z / k)))) ^ 2 / k) :\n    exp 1 * lnK / 4 ≤ c ^ 2 := by\n  have hz0 : 0 \u003c z := lt_of_lt_of_le (mul_pos hk (exp_pos _)) hz\n  have hx : exp (-1) ≤ z / k := by\n    rw [le_div_iff₀ hk]\n    linarith\n  have hx0 : 0 \u003c z / k := div_pos hz0 hk\n  have h1 := one_add_log_sq_le hx\n  have e : z * (c * (k / z * (1 + log (z / k)))) ^ 2 / k =\n      c ^ 2 * ((1 + log (z / k)) ^ 2 / (z / k)) := by\n    field_simp\n  rw [e] at h\n  have h2 : (1 + log (z / k)) ^ 2 / (z / k) ≤ 4 / exp 1 := by\n    rw [div_le_iff₀ hx0]\n    exact h1\n  have h3 : lnK ≤ c ^ 2 * (4 / exp 1) :=\n    h.trans (mul_le_mul_of_nonneg_left h2 (sq_nonneg c))\n  have he : 0 \u003c exp 1 := ex\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.lattice_radius Cap.lattice_radius_two_pow_32 Radius"}, {"id": "c_deficit", "group": "lim", "title": "Partial information costs more than it earns", "gist": "Restricting N to a list of ℓ classes modulo r (2 ≤ ℓ ≤ r/2) costs ln(r/ℓ) nats of search space but contributes only ln r/ℓ to the lattice condition. The cost exceeds the credit by at least ln 2 − 2 ln r/r.", "detail": "The inequality behind the next theorem.", "chips": ["Cap/Radius.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.list_deficit", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Radius.lean", true]], "source": "/-- **An informative list is outside the radius.** A list of `ℓ` classes modulo `r` with\n`2 ≤ ℓ ≤ r/2` carries `ln (r/ℓ)` nats of information and contributes `ln r / ℓ` to the lattice\ncondition; the first exceeds the second by at least `ln 2 - 2 ln r / r`. -/\ntheorem list_deficit {r l : ℝ} (hr : 16 ≤ r) (h2 : 2 ≤ l) (hl : l ≤ r / 2) :\n    log r / l + (log 2 - 2 * log r / r) ≤ log (r / l) := by\n  have hr0 : 0 \u003c r := by linarith\n  have hl0 : 0 \u003c l := by linarith\n  have hlogr : 4 * log 2 ≤ log r := by\n    have h16 : log 16 = 4 * log 2 := by\n      rw [show (16 : ℝ) = 2 ^ (4 : ℕ) by norm_num, Real.log_pow]\n      norm_num\n    rw [← h16]\n    exact Real.log_le_log (by norm_num) hr\n  have hlog2 : 0 \u003c log 2 := Real.log_pos (by norm_num)\n  -- `u = r / l` lies between `2` and `r / 2`\n  set u := r / l with hu\n  have hu2 : 2 ≤ u := by\n    rw [hu, le_div_iff₀ hl0]\n    linarith\n  have hur : u ≤ r / 2 := by\n    rw [hu, div_le_div_iff₀ hl0 (by norm_num)]\n    nlinarith\n  have hrl : log r / l = log r / r\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.list_deficit  Radius"}, {"id": "c_johnson", "group": "lim", "title": "Inside the Johnson radius only the cover is left", "gist": "If the lattice condition holds and a solution is expected, then the informative lists are paid for by lists containing more than half of the classes, which give almost nothing. For moduli ≥ 443 there are at least 23 such near-trivial lists for every informative one.", "detail": "The Lean statement is titled 'Inside the Johnson radius only the cover is left': running the lattice method as far as it can go leaves nothing beyond a plain cover.", "chips": ["Cap/Radius.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.johnson_leaves_the_cover", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Radius.lean", true], ["Also covers", "Cap.informative_lists_le", false]], "source": "/-- **Inside the Johnson radius only the cover is left.** Lists of `l i` classes modulo `r i`,\n`r i ≥ 16`. If the lattice condition `∑ ln r_i / ℓ_i ≥ L` holds and a solution is expected,\n`∑ ln (r_i / ℓ_i) ≤ L`, then the deficits of the informative lists (`2 ≤ ℓ ≤ r/2`) are paid by\nthe lists with more than half of the classes, which give at most `2 ln r / r` each.\nSingleton lists (the Chinese remainder theorem) neither pay nor cost. -/\ntheorem johnson_leaves_the_cover {ι : Type*} (s : Finset ι) (r : ι → ℝ) (l : ι → ℕ) (L : ℝ)\n    (hr : ∀ i ∈ s, 16 ≤ r i) (hl1 : ∀ i ∈ s, 1 ≤ l i) (hlr : ∀ i ∈ s, (l i : ℝ) ≤ r i)\n    (hD : L ≤ ∑ i ∈ s, log (r i) / l i) (hS : ∑ i ∈ s, log (r i / l i) ≤ L) :\n    ∑ i ∈ s.filter (fun i => 2 ≤ l i ∧ (l i : ℝ) ≤ r i / 2), (log 2 - 2 * log (r i) / r i) ≤\n      ∑ i ∈ s.filter (fun i => r i / 2 \u003c (l i : ℝ)), 2 * log (r i) / r i := by\n  classical\n  rw [Finset.sum_filter, Finset.sum_filter, ← sub_nonpos, ← Finset.sum_sub_distrib]\n  have hsum : ∑ i ∈ s, (log (r i / l\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.johnson_leaves_the_cover Cap.informative_lists_le Radius"}, {"id": "c_blackbox", "group": "lim", "title": "Black-box bound: no free search", "gist": "Among K candidates with g good ones, any strategy that asks m questions finds a good one on at most the fraction m·g/K of the possible arrangements.", "detail": "Without structure to exploit, finding a good candidate takes about K/g questions. The formal version of 'there is no shortcut by queries alone'.", "chips": ["Cap/BlackBox.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.blackbox_fraction", true], ["File", "goldbach/lean/GoldbachGaps/Cap/BlackBox.lean", true], ["Also covers", "Cap.blackbox_bound", false]], "source": "/-- **The black-box bound.** Of the `C(K, g)` possible sets of `g` good members, `m` questions\nfind a good member for at most the fraction `m g / K`. -/\ntheorem blackbox_fraction (K g m : ℕ) (hK : 1 ≤ K) (hg : 1 ≤ g) (t : Fin m → Fin K) :\n    (((univ : Finset (Fin K)).powersetCard g).filter (fun G => ∃ j, t j ∈ G)).card * K ≤\n      m * g * K.choose g := by\n  obtain ⟨n, rfl⟩ : ∃ n, K = n + 1 := ⟨K - 1, by omega⟩\n  obtain ⟨k, rfl⟩ : ∃ k, g = k + 1 := ⟨g - 1, by omega⟩\n  have h := blackbox_bound (n + 1) (k + 1) m t\n  simp only [Nat.add_sub_cancel] at h\n  have e := Nat.add_one_mul_choose_eq n k\n  calc _ ≤ m * n.choose k * (n + 1) := Nat.mul_le_mul_right _ h\n    _ = m * ((n + 1) * n.choose k) := by ring\n    _ = m * ((n + 1).choose (k + 1) * (k + 1)) := by rw [e]\n    _ = m * (k + 1) * (n + 1).choose (k + 1) := by ring", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.blackbox_fraction Cap.blackbox_bound BlackBox"}, {"id": "c_population", "group": "lim", "title": "No selection beats the population", "gist": "Whichever candidates are tested, their hit mass is at most |S|·y^k plus the hit mass of all candidates with fewer than k rows left.", "detail": "The only way to gain is to find candidates with unusually few leftover rows. Testing a cleverly chosen subset gets no more than the tail of the population allows.", "chips": ["Cap/Population.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.hitMass_selected_le", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Population.lean", true]], "source": "theorem hitMass_selected_le {T : Type*} (pop S : Finset T) (hS : S ⊆ pop) (R : T → ℕ) {y : ℝ}\n    (hy0 : 0 ≤ y) (hy1 : y ≤ 1) (k : ℕ) :\n    ∑ t ∈ S, y ^ R t ≤ #S * y ^ k + ∑ t ∈ pop.filter (fun t => R t \u003c k), y ^ R t := by\n  classical\n  rw [← Finset.sum_filter_add_sum_filter_not S (fun t => k ≤ R t)]\n  refine add_le_add ?_ ?_\n  · calc ∑ t ∈ S.filter (fun t => k ≤ R t), y ^ R t\n        ≤ ∑ _t ∈ S.filter (fun t => k ≤ R t), y ^ k :=\n          Finset.sum_le_sum fun t ht =>\n            pow_le_pow_of_le_one hy0 hy1 (Finset.mem_filter.mp ht).2\n      _ = #(S.filter (fun t => k ≤ R t)) * y ^ k := by rw [Finset.sum_const, nsmul_eq_mul]\n      _ ≤ #S * y ^ k := by\n          refine mul_le_mul_of_nonneg_right ?_ (pow_nonneg hy0 k)\n          exact_mod_cast Finset.card_le_card (Finset.filter_subset _ _)\n  · refine Finset.sum_le_sum_of_subset_of_nonneg (fun t ht => ?_) fun t _ _ => pow_nonneg hy0 _\n    obtain ⟨htS, hnot⟩ := Finset.mem_filter.mp ht\n    exact Finset.mem_filter.mpr ⟨hS htS, not_le.mp hno\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.hitMass_selected_le  Population"}, {"id": "c_fewrows", "group": "lim", "title": "Few rows left is rare", "gist": "With μ the mean number of rows left, a candidate has at most μ − a rows left with probability at most exp(−a²/(2μ)).", "detail": "A concentration bound: candidates with unusually few leftover rows are exponentially rare.", "chips": ["Cap/Population.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.prob_patternRows_le", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Population.lean", true], ["Also covers", "Cap.sum_patternWeight_le", false]], "source": "/-- **Few rows left is rare.** With `μ = ∑ s_j > 0` the mean number of rows left: a member has\nat most `k ≤ μ - a` rows left with probability at most `exp (-a² / (2 μ))`. -/\ntheorem prob_patternRows_le {s : ι → ℝ} (hs0 : ∀ j, 0 ≤ s j) (hs1 : ∀ j, s j ≤ 1) {a : ℝ}\n    (ha : 0 ≤ a) (hμ : 0 \u003c ∑ j, s j) (k : ℕ) (hk : (k : ℝ) ≤ ∑ j, s j - a) :\n    ∑ ω ∈ univ.filter (fun ω : ι → Bool => patternRows ω ≤ k), patternWeight s ω ≤\n      Real.exp (-(a ^ 2) / (2 * ∑ j, s j)) := by\n  set μ := ∑ j, s j with hμdef\n  have hk0 : (0 : ℝ) ≤ k := Nat.cast_nonneg k\n  have haμ : a ≤ μ := by linarith\n  set θ := a / μ with hθdef\n  have hθ0 : 0 ≤ θ := div_nonneg ha hμ.le\n  have hu0 : 0 \u003c Real.exp (-θ) := Real.exp_pos _\n  have hu1 : Real.exp (-θ) ≤ 1 := Real.exp_le_one_iff.mpr (by linarith)\n  have h := sum_patternWeight_le hs0 hs1 (y := 1) (by norm_num) hu0 hu1 k\n  simp only [one_pow, mul_one, one_mul] at h\n  refine h.trans ?_\n  have h2 := prod_le_exp_neg hs0 hs1 hu0.le\n  have h3 : (Real.exp (-θ) ^ k)⁻¹ = Real.e\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.prob_patternRows_le Cap.sum_patternWeight_le Population"}, {"id": "c_mitm", "group": "lim", "title": "Meet-in-the-middle price", "gist": "Merging two lists of a and b partial designs costs at least a + b ≥ 2√(ab), and yields K·a·b/P complete candidates on average, so the cost per candidate is at least 2P/(K·√(ab)).", "detail": "The best possible price for combining partial designs by merging. Any sublinear trick has to beat this.", "chips": ["Cap/Population.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.mitm_cost", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Population.lean", true], ["Also covers", "Cap.mitm_condition, Cap.mitm_condition_log", false]], "source": "/-- Merging two lists of `a` and `b` entries costs at least `a + b`, and `a + b ≥ 2 √(a b)`;\nthe merge yields `K a b / P` members on average. So the cost per member found is at least\n`2 P / (K √(a b))`. -/\ntheorem mitm_cost {a b P K : ℝ} (ha : 0 \u003c a) (hb : 0 \u003c b) (hP : 0 \u003c P) (hK : 0 \u003c K) :\n    2 * P / (K * Real.sqrt (a * b)) ≤ (a + b) / (K * (a * b) / P) := by\n  have hab : 0 \u003c a * b := mul_pos ha hb\n  have hs : 0 \u003c Real.sqrt (a * b) := Real.sqrt_pos.mpr hab\n  have hss : Real.sqrt (a * b) * Real.sqrt (a * b) = a * b := Real.mul_self_sqrt hab.le\n  have hamgm : 2 * Real.sqrt (a * b) ≤ a + b := by\n    nlinarith [sq_nonneg (a - b), sq_nonneg (a + b - 2 * Real.sqrt (a * b)), mul_pos ha hb]\n  rw [div_le_div_iff₀ (mul_pos hK hs) (div_pos (mul_pos hK hab) hP)]\n  have e1 : 2 * P * (K * (a * b) / P) = 2 * K * (a * b) := by\n    field_simp\n  rw [e1]\n  have e2 : 2 * K * (a * b) = K * Real.sqrt (a * b) * (2 * Real.sqrt (a * b)) := by\n    linear_combination (-2 * K) * hss\n  rw [e2, mul_comm (a + b)]\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.mitm_cost Cap.mitm_condition Cap.mitm_condition_log Population"}, {"id": "c_listgain", "group": "lim", "title": "One prime buys few rows", "gist": "Restricting N to a list L of classes modulo one prime raises the average number of rows killed by at most (W − μ)/ln(W/μ) for every nat of search space the restriction costs.", "detail": "W is the most rows any one class kills and μ the average over all classes. A nat is a factor of e.", "chips": ["Cap/ListGain.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.list_gain_le", true], ["File", "goldbach/lean/GoldbachGaps/Cap/ListGain.lean", true]], "source": "/-- **A nat of constraint on one prime buys at most `(W - μ) / ln (W / μ)` rows.**\n`w a` is the number of rows killed when `N` is in the class `a`; `μ = ∑ w / s` is the average\nover all `s` classes and `W` a bound for every class. For any nonempty list `L` of classes, the\naverage over the list exceeds `μ` by at most `(W - μ) / ln (W / μ)` times `ln (s / |L|)`, the\nnats that the restriction to `L` costs. -/\ntheorem list_gain_le {α : Type*} [Fintype α] (w : α → ℝ) (W : ℝ) (hw0 : ∀ a, 0 ≤ w a)\n    (hwW : ∀ a, w a ≤ W) (L : Finset α) (hL : L.Nonempty) (hpos : 0 \u003c ∑ a, w a)\n    (hlt : (∑ a, w a) / Fintype.card α \u003c W) :\n    (∑ a ∈ L, w a) / L.card - (∑ a, w a) / Fintype.card α ≤\n      (W - (∑ a, w a) / Fintype.card α) / Real.log (W / ((∑ a, w a) / Fintype.card α)) *\n        Real.log (Fintype.card α / L.card) := by\n  classical\n  have hl : (0 : ℝ) \u003c L.card := by exact_mod_cast hL.card_pos\n  have hls : (L.card : ℝ) ≤ Fintype.card α := by exact_mod_cast Finset.card_le_univ L\n  have hs : (0 : ℝ)\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.list_gain_le  ListGain"}, {"id": "c_listgain_q", "group": "lim", "title": "Above Q no list pays", "gist": "For a prime s ≥ 213,070 every class kills at most one row. With at most 1,609 rows left (the best covers at the 10% target), restricting N to a list of classes gains at most 0.207 rows per nat spent.", "detail": "Closes one tempting way to spend leftover budget: putting constraints on primes above the cover.", "chips": ["Cap/ListGain.lean"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Cap.list_gain_above_Q", true], ["File", "goldbach/lean/GoldbachGaps/Cap/ListGain.lean", true]], "source": "/-- **Above `Q` no list pays.** For a prime `s ≥ 213070` every class kills at most one row. If\nat most `1609` rows are left (the best covers at the 10% target), then for every list `L` of\nclasses the chance that `s` kills a row, for a member uniform in the list, exceeds the\nunrestricted chance `|R| / s` by at most `0.207 · ln (s / |L|)`: at most `0.207` rows for each\nnat the restriction costs. -/\ntheorem list_gain_above_Q {α : Type*} [Fintype α] [DecidableEq α] (R L : Finset α)\n    (hs : 213070 ≤ Fintype.card α) (hR : R.card ≤ 1609) (hL : L.Nonempty) :\n    ((R ∩ L).card : ℝ) / L.card - (R.card : ℝ) / Fintype.card α ≤\n      0.207 * Real.log (Fintype.card α / L.card) := by\n  have hl : (0 : ℝ) \u003c L.card := by exact_mod_cast hL.card_pos\n  have hls : (L.card : ℝ) ≤ Fintype.card α := by exact_mod_cast Finset.card_le_univ L\n  have hs' : (213070 : ℝ) ≤ Fintype.card α := by exact_mod_cast hs\n  have hs0 : (0 : ℝ) \u003c Fintype.card α := by linarith\n  have hlog : 0 ≤ Real.log (Fintype.card α / L.card)\n...", "sourceLabel": "Lean statement and proof (first lines)", "search": "Cap.list_gain_above_Q  ListGain", "note": {"level": "bound", "text": "A hard limit on one extension of the cover at the stretch target."}}, {"id": "c_brainstorm", "group": "lim", "title": "Brainstorm: what a kernel could decide among 100 ideas", "gist": "On 2026-11-22 the research session sent 100 ideas for raising the record and asked the Lean session to try to prove each one wrong. Twenty-one of them contained a theorem; this file holds those, numbered as in the list.", "detail": "Examples. One exponent serves every row: N − q passes the base-2 Fermat test exactly when 2^(N−1) ≡ 2^q modulo it, so a scanner can reuse one exponent for all rows of N (fermat_common_exponent). No stopping rule helps: abandoning a candidate never spends fewer tests per success than never abandoning (never_abandon). Moves under the cap keep at most three new rows (move_keeps_at_most_three). For primes of 213,070 or more, a divisor shared by two rows is impossible (large_divisors_unique). The rest of the list is engineering, measurement or heuristic counting with no theorem in it.", "chips": ["Cap/Brainstorm.lean", "24 theorems", "IDEAS100.md"], "f": {"status": "lean", "impact": "bound"}, "meta": [["Lean name", "Brainstorm.fermat_common_exponent", true], ["File", "goldbach/lean/GoldbachGaps/Cap/Brainstorm.lean", true], ["Also covers", "Brainstorm.affine_combination, Brainstorm.card_prescribed_le, Brainstorm.card_zero_class_rows_le_one, Brainstorm.cost_per_hit_le, Brainstorm.doubling_window, Brainstorm.faulty_scan_reports_hits, Brainstorm.fermat_from_product, Brainstorm.large_divisor_budget, Brainstorm.large_divisors_unique, Brainstorm.modulo, Brainstorm.move_budget, Brainstorm.move_keeps_at_most_three, Brainstorm.never_abandon, Brainstorm.no_shared_row_value_of_six, Brainstorm.odd_N_trivial, Brainstorm.pow_succ_ge, Brainstorm.pow_window, Brainstorm.prod_le_sub_of_modEq, Brainstorm.shared_row_value, Brainstorm.test_order, Brainstorm.two_pow_not_dvd_row, Brainstorm.union_density, Brainstorm.zero_class_row", false]], "source": "/-- **Idea 28.** The row `N - q` (odd) passes the base-2 Fermat test iff\n`2^(N-1) ≡ 2^q` modulo it: the exponent `N - 1` serves every row of `N`. -/\ntheorem fermat_common_exponent {N q : ℕ} (hq : q \u003c N) (hodd : (N - q) % 2 = 1) :\n    2 ^ (N - 1) ≡ 2 ^ q [MOD N - q] ↔ 2 ^ (N - q - 1) ≡ 1 [MOD N - q] := by\n  have he : N - 1 = (N - q - 1) + q := by omega\n  have h2 : Nat.Coprime (N - q) 2 := by\n    rw [Nat.coprime_comm, Nat.Prime.coprime_iff_not_dvd Nat.prime_two]\n    omega\n  have hc : Nat.Coprime (N - q) (2 ^ q) := Nat.Coprime.pow_right q h2\n  rw [he, pow_add]\n  constructor\n  · intro h\n    have h' : 2 ^ (N - q - 1) * 2 ^ q ≡ 1 * 2 ^ q [MOD N - q] := by simpa using h\n    exact Nat.ModEq.cancel_right_of_coprime hc h'\n  · intro h\n    simpa using h.mul_right (2 ^ q)", "sourceLabel": "Lean statement and proof (first lines)", "search": "Brainstorm.fermat_common_exponent Brainstorm.affine_combination Brainstorm.card_prescribed_le Brainstorm.card_zero_class_rows_le_one Brainstorm.cost_per_hit_le Brainstorm.doubling_window Brainstorm.faulty_scan_reports_hits Brainstorm.fermat_from_product Brainstorm.large_divisor_budget Brainstorm.large_divisors_unique Brainstorm.modulo Brainstorm.move_budget Brainstorm.move_keeps_at_most_three Brainstorm.never_abandon Brainstorm.no_shared_row_value_of_six Brainstorm.odd_N_trivial Brainstorm.pow_succ_ge Brainstorm.pow_window Brainstorm.prod_le_sub_of_modEq Brainstorm.shared_row_value Brainstorm.test_order Brainstorm.two_pow_not_dvd_row Brainstorm.union_density Brainstorm.zero_class_row Brainstorm", "note": {"level": "bound", "text": "Closes off many cheap-looking ideas with proofs, so the team does not spend campaigns on them. The standing record at the time was 133,981, then 6.3% of the modelled ceiling."}}, {"id": "x_fermat", "group": "chk", "title": "A failed Fermat test proves a number composite", "gist": "If 2^(m−1) mod m is not 1, then m is not prime. This lets a record show that thousands of 200-digit rows are composite by checking one modular power each.", "detail": "Only this direction is needed: a failed test is a proof, a passed test proves nothing. The record files list, for the rows left by the cover, which ones are shown composite this way, and the kernel recomputes each one.", "chips": ["Desert.lean", "base-2 Fermat"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "not_prime_of_powMod_ne_one", true], ["File", "goldbach/lean/GoldbachGaps/Desert.lean", true]], "source": "/-- A number that fails the base-2 Fermat test is not an odd prime. -/\ntheorem not_prime_of_powMod_ne_one {m : ℕ} (hm : 2 \u003c m) (h : powMod 2 (m - 1) m ≠ 1) :\n    ¬ m.Prime := by\n  intro hp\n  apply h\n  have hcop : Nat.Coprime 2 m := (Nat.coprime_primes Nat.prime_two hp).mpr (by omega)\n  have := Nat.ModEq.pow_totient hcop\n  rw [Nat.totient_prime hp] at this\n  rw [powMod_def]\n  exact Eq.trans this (Nat.mod_eq_of_lt (by omega))", "sourceLabel": "Lean statement and proof (first lines)", "search": "not_prime_of_powMod_ne_one  Desert", "note": {"level": "engine", "text": "Everything above the covered range (the 90% of the record that comes from luck) is certified by this single theorem."}}, {"id": "x_block", "group": "chk", "title": "Block check: no summand in a range of q", "gist": "A computable check for a block of consecutive values q: each N − q is divisible by a covering modulus, or by a small prime, or fails the Fermat test. If the check returns true, no q in the block is a Goldbach summand.", "detail": "A record is split into about twenty blocks so the kernel can check them one at a time. The check is evaluated by Lean's kernel itself. A text search of the library finds no native_decide, sorry or axiom declaration.", "chips": ["Desert.lean"], "f": {"status": "lean", "impact": "engine"}, "meta": [["Lean name", "noSummandIn_of_desertBlockCheck", true], ["File", "goldbach/lean/GoldbachGaps/Desert.lean", true]], "source": "/-- Soundness of `desertBlockCheck`. -/\ntheorem noSummandIn_of_desertBlockCheck {N g lo len : ℕ}\n    {coverMods smallPrimes residuals : List ℕ}\n    (hlists : desertListsCheck N g coverMods smallPrimes = true)\n    (h : desertBlockCheck N lo len coverMods smallPrimes residuals = true)\n    (hg : lo + len ≤ g) : NoSummandIn N lo (lo + len) := by\n  simp only [desertListsCheck, Bool.and_eq_true, decide_eq_true_eq, List.all_eq_true] at hlists\n  obtain ⟨⟨hN, hsmall⟩, hcover⟩ := hlists\n  simp only [desertBlockCheck, Bool.and_eq_true, List.all_eq_true, beq_iff_eq, bne_iff_ne] at h\n  obtain ⟨hres, hfermat⟩ := h\n  rintro q hlo hhi ⟨hqp, hNq⟩\n  have hq2 := hqp.two_le\n  -- a prime has no proper divisor among `smallPrimes`\n  have hnodiv : (smallPrimes.any fun d => decide (d \u003c q) && q % d == 0) = false := by\n    rw [Bool.eq_false_iff]\n    intro hany\n    obtain ⟨d, hd, hdq
