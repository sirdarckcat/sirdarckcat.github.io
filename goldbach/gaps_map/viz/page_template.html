<title>/*PAGETITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout concept: a left-to-right layered dependency map (claims on the left, foundations on the right)
   beside a reading panel; on phones the panel is a bottom sheet and an outline view replaces the map on demand.
   Type: Space Grotesk for titles, Inter for text, system mono for Lean names. Palette: cool slate neutrals,
   one teal accent, and seven muted role hues used only as thin stripes. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface2: #e8ecf2; --line: #d0d7e1;
  --fg: #131923; --muted: #566074; --accent: #0a6a78; --accent-weak: #d3edf0; --on-accent: #ffffff;
  --edge: #8e9bb0; --edge-dim: #c9d0db; --shadow: 0 10px 30px rgba(20, 30, 50, .16);
  --k1: #b5472e; --k2: #9a7414; --k3: #4f66b3; --k4: #0a6a78; --k5: #6e56a8; --k6: #3f7d44; --k7: #a8547f; --k8: #7a5c3a; --k9: #2f7aa8; --k10: #8a94a6;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d27; --surface2: #1e2733; --line: #2b3646;
    --fg: #e6ebf2; --muted: #9aa6b9; --accent: #4cc2d1; --accent-weak: #16363c; --on-accent: #06222a;
    --edge: #5b6a80; --edge-dim: #2a3442; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --k1: #e07a62; --k2: #d1a63e; --k3: #8399e2; --k4: #4cc2d1; --k5: #a690dc; --k6: #7dbd83; --k7: #dc86b5; --k8: #c29a6e; --k9: #6db4e0; --k10: #9aa6b9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --surface2: #1e2733; --line: #2b3646;
  --fg: #e6ebf2; --muted: #9aa6b9; --accent: #4cc2d1; --accent-weak: #16363c; --on-accent: #06222a;
  --edge: #5b6a80; --edge-dim: #2a3442; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  --k1: #e07a62; --k2: #d1a63e; --k3: #8399e2; --k4: #4cc2d1; --k5: #a690dc; --k6: #7dbd83; --k7: #dc86b5; --k8: #c29a6e; --k9: #6db4e0; --k10: #9aa6b9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
.wrap { max-width: 1500px; margin: 0 auto; padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 1.45rem; line-height: 1.2; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 78ch; }
button { font: inherit; color: inherit; }
button:focus-visible, .node:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header + controls */
.top { background: var(--bg); padding-bottom: 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: .9rem; min-height: 36px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.lab { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.field { display: inline-flex; flex-direction: column; gap: 3px; }
.search { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 9px; padding: 7px 10px; min-height: 36px; width: 100%; font: inherit; }
.field.grow { flex: 1 1 200px; max-width: 360px; }
.opts > summary { cursor: pointer; padding: 8px 0 0; color: var(--muted); font-size: .88rem; }
.opts[open] > summary { padding-bottom: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: .84rem; min-height: 32px; }
.chip i { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--accent)); display: inline-block; }
.chip[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
.chip small { color: var(--muted); }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 6px; }
.mapwrap { position: relative; height: 64dvh; min-height: 380px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.drag { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 2; }
.zoom button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; cursor: pointer; font-size: 1.1rem; line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.zoom button.txt { font-size: .8rem; width: auto; padding: 0 12px; }
@media (hover: none) { .hint { display: none; } }
.hint { position: absolute; left: 12px; bottom: 14px; z-index: 2; font-size: .78rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 4px 8px; border-radius: 7px; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 2px 0; font-size: .82rem; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend svg { width: 34px; height: 10px; }
.legend button.lk { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 3px 6px; margin: 0 -4px; border-radius: 7px; color: inherit; font: inherit; cursor: pointer; }
.legend button.lk:hover { background: var(--surface2); }
.legend button.lk[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }

/* svg parts */
.node { cursor: pointer; }
.node .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.node .t { fill: var(--fg); font: 600 13px var(--sans); pointer-events: none; }
.node .stripe { fill: var(--stripe, var(--accent)); }
.node:hover .box { stroke: var(--muted); }
.node.sel .box { stroke: var(--accent); stroke-width: 2.4; }
.node.dep .box { stroke: var(--accent); stroke-width: 1.4; }
.node.usedby .box { stroke: var(--muted); stroke-dasharray: 3 3; }
.node.match .box { fill: var(--accent-weak); stroke: var(--accent); }
.node.dim { opacity: .3; }
.edge path.line { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.indirect path.line { stroke-dasharray: 6 4; }
.edge.doc path.line { stroke-dasharray: 1.5 5.5; stroke-linecap: round; opacity: .75; }
.edge.direct path.line { stroke-width: 1.8; }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.edge.on path.line { stroke: var(--accent); stroke-width: 2.2; }
.edge.dim path.line { stroke: var(--edge-dim); }
.edge.sel path.line { stroke: var(--accent); stroke-width: 3; }
#ah { color: var(--edge); } #ah-on { color: var(--accent); } #ah-dim { color: var(--edge-dim); }
.elabel rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1; }
.elabel text { fill: var(--fg); font: 500 11.5px var(--sans); }

/* panel */
.panel, .intro { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow: auto; }
.panel h2, .intro h2 { font-size: 1.2rem; line-height: 1.25; }
.panel h3, .intro h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 6px; font-family: var(--sans); font-weight: 600; }
.panel .x { display: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.tag { font-size: .76rem; border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.tag.role { border-color: var(--c); color: var(--fg); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.tag.since { border-color: var(--c); color: var(--fg); background: color-mix(in srgb, var(--c) 22%, var(--surface)); font-weight: 600; }
.news { margin: 6px 0 0; padding-left: 1.1rem; display: grid; gap: 7px; }
.news button.link { font-weight: 600; }
.gist { font-size: 1.02rem; margin: 12px 0 0; }
.detail { color: var(--muted); margin: 8px 0 0; }
.rel { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rel li { border-top: 1px solid var(--line); padding-top: 8px; }
.rel .row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.rel .lbl { font-size: .76rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.rel .lbl.ind { border-style: dashed; }
.rel .lbl.docl { border-style: dotted; }
.rel p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
.gb { border-left: 3px solid var(--gbc, var(--line)); padding: 2px 0 2px 10px; margin: 0; }
pre { margin: 6px 0 0; padding: 10px; background: var(--surface2); border-radius: 8px; overflow-x: auto; font: 12px/1.45 var(--mono); max-height: 260px; }
code { font-family: var(--mono); font-size: .84em; background: var(--surface2); border-radius: 5px; padding: 1px 5px; word-break: break-all; }
.meta { display: grid; gap: 4px 10px; grid-template-columns: auto 1fr; font-size: .86rem; margin: 6px 0 0; }
.meta dt { color: var(--muted); } .meta dd { margin: 0; min-width: 0; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: .74rem; padding: 1px 7px; cursor: pointer; margin-left: 6px; }
details > summary { cursor: pointer; font-weight: 600; }
.start { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.start button { border: 1px solid var(--line); background: var(--surface2); border-radius: 9px; padding: 7px 11px; cursor: pointer; text-align: left; font-size: .9rem; min-height: 38px; }
.start button:hover { border-color: var(--accent); }
.panel ul.plain, .intro ul.plain { margin: 6px 0 0; padding-left: 1.1rem; display: grid; gap: 6px; }
.stats { color: var(--muted); font-size: .86rem; margin-top: 14px; }
.chain { margin: 6px 0 0; padding-left: 1.2rem; font: 12px/1.6 var(--mono); }

/* outline */
.outline { display: grid; gap: 22px; }
.outline h2 { font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.outline h2 i { width: 12px; height: 12px; border-radius: 4px; background: var(--c); display: inline-block; }
.outline .blurb { color: var(--muted); margin: 2px 0 8px; font-size: .92rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
.card > summary { padding: 10px 12px; list-style: none; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); flex: none; margin-right: 4px; align-self: center; transition: transform .15s; }
.card[open] > summary::before { transform: rotate(45deg); }
.card .body { padding: 0 14px 14px; }
.card .gistline { color: var(--muted); font-weight: 400; flex-basis: 100%; font-size: .9rem; padding-left: 19px; }
.foot { color: var(--muted); font-size: .86rem; margin-top: 22px; display: grid; gap: 6px; max-width: 95ch; }
.empty { color: var(--muted); padding: 18px 4px; }

/* desktop */
@media (min-width: 900px) {
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
  .stage { grid-template-columns: minmax(0, 1fr) 410px; align-items: start; }
  .mapwrap { height: calc(100dvh - var(--hdr, 200px) - 64px); min-height: 480px; }
  .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 200px) + 10px); max-height: calc(100dvh - var(--hdr, 200px) - 28px); }
  .outline-on .stage { grid-template-columns: minmax(0, 1fr); }
  .outline-on .panel { display: none; }
  #introInline { display: none; }
  .opts > summary { display: none; }
}
/* phone: bottom sheet */
@media (max-width: 899px) {
  h1 { font-size: 1.28rem; } .sub { font-size: .92rem; }
  .seg button { padding: 6px 11px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 54dvh; border-radius: 16px 16px 0 0; border-width: 1px 0 0; box-shadow: var(--shadow);
    transform: translateY(105%); transition: transform .22s ease; visibility: hidden;
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .panel.open { transform: none; visibility: visible; }
  .panel .x { display: inline-flex; position: absolute; right: 10px; top: 8px; width: 40px; height: 40px; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; font-size: 1.2rem; }
  .panel h2 { padding-right: 46px; }
  .outline-on .panel { display: none; }
  .mapwrap { height: 60dvh; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } .card > summary::before { transition: none; } }
</style>

<div class="wrap" id="root" data-lens="role">
  <header class="top">
    <h1>/*H1*/</h1>
    <p class="sub">/*SUB*/</p>
    <div class="bar" id="bar">
      <div class="field"><span class="lab">View</span>
        <div class="seg" id="viewSeg" role="group" aria-label="View">
          <button type="button" data-v="map" aria-pressed="true">Map</button><button type="button" data-v="outline" aria-pressed="false">Outline</button>
        </div></div>
      <div class="field" id="lensField"><span class="lab">Colour by</span>
        <div class="seg" id="lensSeg" role="group" aria-label="Colour by"></div></div>
      <div class="field grow" id="searchField"><label class="lab" for="q">Search</label>
        <input id="q" class="search" type="search" placeholder="/*PLACEHOLDER*/" autocomplete="off"></div>
    </div>
    <details class="opts" id="opts">
      <summary>Colours and groups</summary>
      <div class="optsbody" id="optsbody"><div class="chips" id="chips" role="group" aria-label="Show or hide groups"></div></div>
    </details>
  </header>

  <div class="stage" id="stage">
    <div>
      <div class="mapwrap" id="mapwrap">
        <svg id="map" role="group" aria-label="/*MAPLABEL*/"></svg>
        <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button><button type="button" id="zfit" class="txt" aria-label="Fit everything">Fit all</button></div>
        <div class="hint" id="hint">Drag to pan, pinch or Ctrl-scroll to zoom</div>
      </div>
      <div class="legend" id="legend"></div>
      <div id="outline" class="outline" hidden></div>
      <section id="introInline" class="intro" style="margin-top:14px"></section>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<script id="data" type="application/json">/*DATA*/</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var G = {}; D.groups.forEach(function (g, i) { g.order = i; G[g.id] = g; });
  var M = D.meta, LENSES = D.lenses;
  function kv(slot) { return "var(--k" + (slot || 10) + ")"; }
  var N = new Map(D.nodes.map(function (n) { return [n.id, n]; }));
  var E = new Map(D.edges.map(function (e) { return [e.id, e]; }));
  var OUT = new Map(), IN = new Map();
  D.nodes.forEach(function (n) { OUT.set(n.id, []); IN.set(n.id, []); });
  D.edges.forEach(function (e) { OUT.get(e.from).push(e); IN.get(e.to).push(e); });
  var state = { sel: null, selEdge: null, lens: "role", view: "map", hidden: {}, q: "", kinds: {} };
  Object.keys(M.edgeKinds).forEach(function (k) { state.kinds[k] = 1; });
  try { var saved = JSON.parse(localStorage.getItem(M.storeKey) || "{}"); if (saved.lens && LENSES.some(function (l) { return l.id === saved.lens; })) state.lens = saved.lens; if (saved.view) state.view = saved.view; if (saved.hidden) state.hidden = saved.hidden; if (saved.kinds) Object.keys(saved.kinds).forEach(function (k) { if (k in state.kinds) state.kinds[k] = saved.kinds[k] ? 1 : 0; }); } catch (e) {}
  function persist() { try { localStorage.setItem(M.storeKey, JSON.stringify({ lens: state.lens, view: state.view, hidden: state.hidden, kinds: state.kinds })); } catch (e) {} }

  /* ---------- helpers ---------- */
  function isVisible(n) { return !state.hidden[n.group]; }
  function matches(n) {
    if (!state.q) return false;
    var q = state.q.toLowerCase();
    return (n.title + " " + n.gist + " " + (n.detail || "") + " " + (n.search || "")).toLowerCase().indexOf(q) >= 0;
  }
  function deps(id) { var seen = new Set(), st = [id]; while (st.length) { var x = st.pop(); OUT.get(x).forEach(function (e) { if (!seen.has(e.to) && isVisible(N.get(e.to))) { seen.add(e.to); st.push(e.to); } }); } return seen; }
  function hashFor(id) { return "n-" + id.replace(/_/g, "-"); }
  function lensDef(id) { for (var i = 0; i < LENSES.length; i++) if (LENSES[i].id === id) return LENSES[i]; return LENSES[0]; }
  function slotOf(n, lensId) {
    if (lensId === "role") return G[n.group].slot;
    var L = lensDef(lensId), v = n.f && n.f[L.field], hit = (L.values || []).filter(function (x) { return x.v === v; })[0];
    return hit ? hit.slot : 10;
  }
  function idFromHash() { var h = (location.hash || "").slice(1); if (h.indexOf("n-") !== 0) return null; var id = h.slice(2).replace(/-/g, "_"); return N.has(id) ? id : null; }

  /* ---------- layout (left to right, layered) ---------- */
  var NW = 206, NH = 52, GX = 92, GY = 14;
  var pos = new Map(), bbox = { w: 0, h: 0 };
  function layout() {
    var vn = D.nodes.filter(isVisible), ids = new Set(vn.map(function (n) { return n.id; }));
    var ve = D.edges.filter(function (e) { return ids.has(e.from) && ids.has(e.to); });
    var ins = new Map(), outs = new Map(); vn.forEach(function (n) { ins.set(n.id, []); outs.set(n.id, []); });
    ve.forEach(function (e) { ins.get(e.to).push(e.from); outs.get(e.from).push(e.to); });
    var indeg = new Map(); vn.forEach(function (n) { indeg.set(n.id, ins.get(n.id).length); });
    var q = vn.filter(function (n) { return indeg.get(n.id) === 0; }).map(function (n) { return n.id; }), order = [];
    while (q.length) { var x = q.shift(); order.push(x); outs.get(x).forEach(function (y) { indeg.set(y, indeg.get(y) - 1); if (indeg.get(y) === 0) q.push(y); }); }
    var layer = new Map(); order.forEach(function (x) { var l = 0; ins.get(x).forEach(function (p) { l = Math.max(l, layer.get(p) + 1); }); layer.set(x, l); });
    var cols = []; vn.forEach(function (n) { var l = layer.get(n.id) || 0; (cols[l] = cols[l] || []).push(n.id); });
    cols = cols.filter(Boolean);
    cols.forEach(function (c) { c.sort(function (a, b) { return G[N.get(a).group].order - G[N.get(b).group].order || (a < b ? -1 : 1); }); });
    var y = new Map(); cols.forEach(function (c) { c.forEach(function (id, i) { y.set(id, i); }); });
    function bary(id) { var nb = ins.get(id).concat(outs.get(id)); if (!nb.length) return y.get(id); var s = 0; nb.forEach(function (o) { s += y.get(o); }); return s / nb.length; }
    for (var it = 0; it < 8; it++) {
      var seq = it % 2 ? cols.slice().reverse() : cols;
      seq.forEach(function (c) {
        var b = new Map(c.map(function (id) { return [id, bary(id)]; }));
        c.sort(function (p, r) { return b.get(p) - b.get(r) || (p < r ? -1 : 1); });
        c.forEach(function (id, i) { y.set(id, i); });
      });
    }
